<text x="34" y="39" fill="#162438" class="title">What Ranking Actually Allocates</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#00A6C7" class="mono" xml:space="preserve">   WHAT RANKING ACTUALLY ALLOCATES</text><text x="46" y="88" fill="#557184" class="mono" xml:space="preserve">   ═══════════════════════════════</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#557184" class="mono" xml:space="preserve">   ┌─────────────────────────────────────────┐</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">   │  rank 1  ████████████████  &lt;- attention  │</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">   │  rank 2  ████████          │            │</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">   │  rank 3  █████             │  exposure  │</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve">   │  rank 4  ███               │            │</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">   │  rank 5  ██                │            │</text><text x="46" y="248" fill="#557184" class="mono" xml:space="preserve">   │  ...     ·                 ▼            │</text><text x="46" y="268" fill="#557184" class="mono" xml:space="preserve">   └─────────────────────────────────────────┘</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#162438" class="mono" xml:space="preserve">   When the ranked items are JOB CANDIDATES,</text><text x="46" y="328" fill="#162438" class="mono" xml:space="preserve">   that column is economic opportunity.</text><text x="46" y="348" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#162438" class="mono" xml:space="preserve">   When they are SELLERS, it is revenue.</text><text x="46" y="388" fill="#162438" class="mono" xml:space="preserve">   When they are ARTICLES, it is influence.</text><text x="46" y="408" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;We just rank by relevance.&quot;</text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="488" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Relevance scores are continuous.</text><text x="46" y="528" fill="#D94C42" class="mono" xml:space="preserve">       /|\     Exposure is winner-take-most. A</text><text x="46" y="548" fill="#D94C42" class="mono" xml:space="preserve">       / \     candidate 1% less relevant can get</text><text x="46" y="568" fill="#162438" class="mono" xml:space="preserve">              80% less attention.&quot;</text>
</svg>
