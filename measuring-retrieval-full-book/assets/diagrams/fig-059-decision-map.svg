<svg xmlns="http://www.w3.org/2000/svg" width="720" height="406" viewBox="0 0 720 406">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="406" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#527368" class="mono" xml:space="preserve">   ┌────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#183029" class="mono" xml:space="preserve">   │  THE RBO DRIFT PROTOCOL                            │</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve">   │                                                    │</text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   │  1. Freeze 500 representative queries              │</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">   │  2. Record top-k for each, today, with the         │</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">   │     embedder version and k stamped on it           │</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve">   │  3. Monthly: recompute, report                     │</text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">   │     RBO(today, baseline) at p matched to your k    │</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve">   │  4. Alert on a sustained decline, not a single dip │</text><text x="46" y="248" fill="#183029" class="mono" xml:space="preserve">   │  5. Re-baseline deliberately after any intentional │</text><text x="46" y="268" fill="#183029" class="mono" xml:space="preserve">   │     change, and keep the old baseline              │</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve">   │                                                    │</text><text x="46" y="308" fill="#183029" class="mono" xml:space="preserve">   │  Cost: one afternoon to set up, minutes per month. │</text><text x="46" y="328" fill="#183029" class="mono" xml:space="preserve">   │  This is the cheapest real drift metric available. │</text><text x="46" y="348" fill="#527368" class="mono" xml:space="preserve">   └────────────────────────────────────────────────────┘</text>
</svg>
