<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">Why Harmonic, Not Arithmetic</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   WHY HARMONIC, NOT ARITHMETIC</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ════════════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   System A:  P = 0.50,  R = 0.50</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">   System B:  P = 1.00,  R = 0.01   &lt;- returns 1 doc, it&#x27;s right</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#D98B00" class="mono" xml:space="preserve">   ARITHMETIC MEAN:</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">      A: 0.500      B: 0.505   &lt;- B &quot;wins&quot;</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#D98B00" class="mono" xml:space="preserve">   HARMONIC MEAN (F1):</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">      A: 0.500      B: 0.020   &lt;- B is correctly destroyed</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;System B has the highest average score!&quot;</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;System B returns one document and</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       /|\     ignores 99% of the corpus.&quot;</text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="468" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="488" fill="#2A2518" class="mono" xml:space="preserve">   The harmonic mean PUNISHES IMBALANCE.</text><text x="46" y="508" fill="#2A2518" class="mono" xml:space="preserve">   That is not a side effect. That is the feature.</text>
</svg>
