<svg xmlns="http://www.w3.org/2000/svg" width="720" height="786" viewBox="0 0 720 786">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="786" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">WHAT I IMPLIED and WHAT THE PAPER FOUND</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#183029" class="mono" xml:space="preserve">   WHAT I IMPLIED and WHAT THE PAPER FOUND</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ══════════════════════════════════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   SUPPLEMENT A (wrong emphasis):</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">     &quot;If Jaccard and RankSimilarity are high, the</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">      migration is low risk.&quot;</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#168C63" class="mono" xml:space="preserve">   THE PAPER:</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve">     At the small k RAG actually uses, similarity is</text><text x="46" y="248" fill="#183029" class="mono" xml:space="preserve">     LOW and UNSTABLE. Different models retrieve</text><text x="46" y="268" fill="#183029" class="mono" xml:space="preserve">     largely DIFFERENT chunks.</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#527368" class="mono" xml:space="preserve">   ┌─────────────────────────────────────────────┐</text><text x="46" y="328" fill="#183029" class="mono" xml:space="preserve">   │  Jaccard similarity and k                    │</text><text x="46" y="348" fill="#183029" class="mono" xml:space="preserve">   │                                             │</text><text x="46" y="368" fill="#527368" class="mono" xml:space="preserve">   │  1.0 ┤                          ╭────────   │</text><text x="46" y="388" fill="#527368" class="mono" xml:space="preserve">   │      │                     ╭────╯           │</text><text x="46" y="408" fill="#527368" class="mono" xml:space="preserve">   │  0.5 ┤              ╭──────╯                │</text><text x="46" y="428" fill="#527368" class="mono" xml:space="preserve">   │      │      ╭───────╯                       │</text><text x="46" y="448" fill="#183029" class="mono" xml:space="preserve">   │  0.0 ┤ ╱╲╱╲╱                                │</text><text x="46" y="468" fill="#527368" class="mono" xml:space="preserve">   │      └─┬────┬────┬────┬────┬────┬─────      │</text><text x="46" y="488" fill="#183029" class="mono" xml:space="preserve">   │        3   10   50  100  500  1000    k     │</text><text x="46" y="508" fill="#527368" class="mono" xml:space="preserve">   │        ▲▲▲                                  │</text><text x="46" y="528" fill="#527368" class="mono" xml:space="preserve">   │        └── where RAG lives.                 │</text><text x="46" y="548" fill="#183029" class="mono" xml:space="preserve">   │            High variance. Low similarity.   │</text><text x="46" y="568" fill="#527368" class="mono" xml:space="preserve">   └─────────────────────────────────────────────┘</text><text x="46" y="588" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="608" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;So a high-CKA model is a safe swap?&quot;</text><text x="46" y="628" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="648" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="668" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="688" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;CKA similarity at the embedding level</text><text x="46" y="708" fill="#D94C42" class="mono" xml:space="preserve">       /|\     does NOT imply similar retrieval at</text><text x="46" y="728" fill="#D94C42" class="mono" xml:space="preserve">       / \     k=3. That&#x27;s the paper&#x27;s point.&quot;</text>
</svg>
