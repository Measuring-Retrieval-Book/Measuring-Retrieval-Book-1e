<text x="34" y="39" fill="#183029" class="title">Ch 5 Rank matters. Here is how to weight it</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">FORMULA</text>
<text x="46" y="68" fill="#183029" class="mono" xml:space="preserve">   Ch 5  Rank matters. Here is how to weight it.</text><text x="46" y="88" fill="#183029" class="mono" xml:space="preserve">              │</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve">              │  ...every rank metric needs to know</text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">              │     which documents are relevant.</text><text x="46" y="148" fill="#527368" class="mono" xml:space="preserve">              ▼</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">   Ch 6  You do not know that. Here is how to cope.</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve">              │</text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">              │  ...and RBP&#x27;s residual points at a</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve">              │     second use for rank metrics entirely.</text><text x="46" y="248" fill="#527368" class="mono" xml:space="preserve">              ▼</text><text x="46" y="268" fill="#183029" class="mono" xml:space="preserve">   Ch 7  Comparing two rankings - which is how you</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve">         measure drift.</text>
</svg>
