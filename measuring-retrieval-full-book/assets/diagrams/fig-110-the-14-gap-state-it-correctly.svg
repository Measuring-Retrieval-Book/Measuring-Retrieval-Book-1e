<text x="46" y="68" fill="#EDF5F7" class="mono" xml:space="preserve">   THE 14% GAP (state it correctly)</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ════════════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   Accuracy            71.0%</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">   Context Hit Rate    57.6%</text><text x="46" y="168" fill="#5264C8" class="mono" xml:space="preserve">                      ──────</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">   Gap                 13.4%  ≈ 14%   &lt;- THIS is the paper&#x27;s 14%</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">   Accuracy            71.0%</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">   Effective Use       49.2%</text><text x="46" y="268" fill="#5264C8" class="mono" xml:space="preserve">                      ──────</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">   Gap                 21.8%           &lt;- a DIFFERENT quantity</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve">   Do not merge these. They will not reconcile.</text>
