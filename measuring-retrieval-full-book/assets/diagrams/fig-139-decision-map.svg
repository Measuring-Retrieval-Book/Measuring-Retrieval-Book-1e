<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#527368" class="mono" xml:space="preserve">   ┌───────────────────────────────────────────────┐</text><text x="46" y="88" fill="#183029" class="mono" xml:space="preserve">   │  THE THREE THAT EARN DASHBOARD SPACE          │</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve">   │                                               │</text><text x="46" y="128" fill="#527368" class="mono" xml:space="preserve">   │  Claim Recall     ── did retrieval get it?    │</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">   │                      (the ceiling on all      │</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">   │                       downstream quality)     │</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve">   │                                               │</text><text x="46" y="208" fill="#527368" class="mono" xml:space="preserve">   │  Self-Knowledge   ── the Lucky Guess rate.    │</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve">   │                      Correct and ungrounded.  │</text><text x="46" y="248" fill="#183029" class="mono" xml:space="preserve">   │                      Nobody else measures     │</text><text x="46" y="268" fill="#183029" class="mono" xml:space="preserve">   │                      this and it is the       │</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve">   │                      most dangerous box.      │</text><text x="46" y="308" fill="#183029" class="mono" xml:space="preserve">   │                                               │</text><text x="46" y="328" fill="#527368" class="mono" xml:space="preserve">   │  Hallucination    ── wrong AND unsupported.   │</text><text x="46" y="348" fill="#183029" class="mono" xml:space="preserve">   │                      The classic failure.     │</text><text x="46" y="368" fill="#183029" class="mono" xml:space="preserve">   │                                               │</text><text x="46" y="388" fill="#183029" class="mono" xml:space="preserve">   │  Keep the other six for diagnosis when one    │</text><text x="46" y="408" fill="#183029" class="mono" xml:space="preserve">   │  of these three moves.                        │</text><text x="46" y="428" fill="#527368" class="mono" xml:space="preserve">   └───────────────────────────────────────────────┘</text>
</svg>
