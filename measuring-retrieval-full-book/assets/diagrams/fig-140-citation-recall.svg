<svg xmlns="http://www.w3.org/2000/svg" width="720" height="726" viewBox="0 0 720 726">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="726" rx="10" fill="#202541"/>
<rect width="720" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">Citation Recall</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   CITATION RECALL</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ═══════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve">   Does the CONCATENATION of cited documents entail the sentence?</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">   sentence: &quot;Bern became the capital in 1848.&quot;</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">   cited:    [1] [2] [3]</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#5264C8" class="mono" xml:space="preserve">   concat([1],[2],[3]) ──entails?──▶ YES  -&gt; recall credit</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">   CITATION PRECISION - the leave-one-out test</text><text x="46" y="288" fill="#5264C8" class="mono" xml:space="preserve">   ═══════════════════════════════════════════</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve">   For EACH cited document, remove it and re-test entailment.</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#5264C8" class="mono" xml:space="preserve">   remove [1]:  concat([2],[3]) ──entails?──▶ YES</text><text x="46" y="368" fill="#5264C8" class="mono" xml:space="preserve">                    ▲</text><text x="46" y="388" fill="#5264C8" class="mono" xml:space="preserve">                    └── then [1] was UNNECESSARY.</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve">                        Precision penalty.</text><text x="46" y="428" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="448" fill="#5264C8" class="mono" xml:space="preserve">   remove [2]:  concat([1],[3]) ──entails?──▶ NO</text><text x="46" y="468" fill="#5264C8" class="mono" xml:space="preserve">                    ▲</text><text x="46" y="488" fill="#5264C8" class="mono" xml:space="preserve">                    └── [2] was load-bearing. Good citation.</text><text x="46" y="508" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="528" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="548" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;I&#x27;ll cite everything to be safe.&quot;</text><text x="46" y="568" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="588" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="608" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="628" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Every unnecessary citation costs you</text><text x="46" y="648" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     precision. ALCE was built to catch</text><text x="46" y="668" fill="#FF9D8A" class="mono" xml:space="preserve">       / \     exactly that padding.&quot;</text>
</svg>
