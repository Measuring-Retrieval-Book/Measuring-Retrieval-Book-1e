<svg xmlns="http://www.w3.org/2000/svg" width="720" height="666" viewBox="0 0 720 666">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="666" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">Team-Draft Interleaving</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   TEAM-DRAFT INTERLEAVING</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ═══════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#D98B00" class="mono" xml:space="preserve">   RANKER A          RANKER B          INTERLEAVED</text><text x="46" y="148" fill="#736747" class="mono" xml:space="preserve">   ────────          ────────          ───────────</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">   1. doc-P          1. doc-Q          1. doc-P   [A]</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">   2. doc-Q          2. doc-R          2. doc-Q   [B]</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">   3. doc-S          3. doc-P          3. doc-R   [B]</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">   4. doc-T          4. doc-U          4. doc-S   [A]</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">                                       5. doc-U   [B]</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">                                       6. doc-T   [A]</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#736747" class="mono" xml:space="preserve">   User clicks doc-R  ──▶  point to B</text><text x="46" y="328" fill="#736747" class="mono" xml:space="preserve">   User clicks doc-S  ──▶  point to A</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#736747" class="mono" xml:space="preserve">   Aggregate over thousands of sessions ──▶ preference</text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#736747" class="mono" xml:space="preserve">   ┌──────────────────────────────────────────────────┐</text><text x="46" y="428" fill="#2A2518" class="mono" xml:space="preserve">   │  WHY THIS BEATS A/B TESTING                      │</text><text x="46" y="448" fill="#2A2518" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="468" fill="#2A2518" class="mono" xml:space="preserve">   │  A/B:  half your users see A, half see B.        │</text><text x="46" y="488" fill="#2A2518" class="mono" xml:space="preserve">   │        You compare two POPULATIONS.              │</text><text x="46" y="508" fill="#2A2518" class="mono" xml:space="preserve">   │        Population variance swamps the signal.    │</text><text x="46" y="528" fill="#2A2518" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="548" fill="#2A2518" class="mono" xml:space="preserve">   │  Interleaving: EVERY user sees both.             │</text><text x="46" y="568" fill="#2A2518" class="mono" xml:space="preserve">   │        You compare within-subject.               │</text><text x="46" y="588" fill="#2A2518" class="mono" xml:space="preserve">   │        Variance collapses. Far more sensitive.   │</text><text x="46" y="608" fill="#736747" class="mono" xml:space="preserve">   └──────────────────────────────────────────────────┘</text>
</svg>
