<text x="34" y="39" fill="#2A2518" class="title">RQ1: Is RAG always better than non-RAG?</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#2A2518" class="mono" xml:space="preserve">   RQ1: Is RAG always better than non-RAG?</text><text x="46" y="88" fill="#2A2518" class="mono" xml:space="preserve">   RQ2: Do more retrieved documents always help?</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve">   RQ3: Does document order affect results?</text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="148" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Obviously yes, yes, and no.&quot;</text><text x="46" y="168" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="188" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="228" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;All three are empirical questions with</text><text x="46" y="248" fill="#D94C42" class="mono" xml:space="preserve">       /|\     surprising answers. That&#x27;s why the paper</text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">       / \     exists.&quot;</text>
</svg>
