<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   CLAIM ORIGIN ATTRIBUTION</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ════════════════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#7B5960" class="mono" xml:space="preserve">   generated claim ──┬──▶ was it in the QUERY?      -&gt; leaked</text><text x="46" y="148" fill="#7B5960" class="mono" xml:space="preserve">                     ├──▶ was it in the CONTEXT?    -&gt; retrieved</text><text x="46" y="168" fill="#7B5960" class="mono" xml:space="preserve">                     └──▶ neither?                  -&gt; parametric</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve">   PKP scores only the third bucket, for correctness.</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">   PR (Parametric Rate) counts how OFTEN the third</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">   bucket is used.</text>
</svg>
