<text x="34" y="39" fill="#162438" class="title">The Problem In One Picture</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#00A6C7" class="mono" xml:space="preserve">   THE PROBLEM IN ONE PICTURE</text><text x="46" y="88" fill="#557184" class="mono" xml:space="preserve">   ══════════════════════════</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#00A6C7" class="mono" xml:space="preserve">   WHAT THE PAPERS SAID          WHAT ACTUALLY HAPPENED</text><text x="46" y="148" fill="#557184" class="mono" xml:space="preserve">   ────────────────────          ──────────────────────</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">   effectiveness                 effectiveness</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve">        │        ╱                    │</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">        │      ╱                      │  ~~~~~~~~~~~~~</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">        │    ╱                        │</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve">        │  ╱                          │</text><text x="46" y="288" fill="#557184" class="mono" xml:space="preserve">        └──────────── time            └──────────── time</text><text x="46" y="308" fill="#00A6C7" class="mono" xml:space="preserve">        1998      2008                1998      2008</text><text x="46" y="328" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#162438" class="mono" xml:space="preserve">   Each paper: &quot;+4% over baseline, p &lt; 0.05&quot;</text><text x="46" y="368" fill="#162438" class="mono" xml:space="preserve">   Ten years of those: no cumulative gain.</text><text x="46" y="388" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;How is that possible? They were</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       /|\     all significant.&quot;</text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="468" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Weak baselines. Selective reporting.</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       /|\     Multiple comparisons. Different</text><text x="46" y="528" fill="#D94C42" class="mono" xml:space="preserve">       / \     collections. All of it defensible</text><text x="46" y="548" fill="#162438" class="mono" xml:space="preserve">              per-paper and none of it additive.&quot;</text>
</svg>
