<svg xmlns="http://www.w3.org/2000/svg" width="721" height="646" viewBox="0 0 721 646">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="721" height="646" rx="10" fill="#202541"/>
<rect width="721" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">Decision map</text>
<text x="687" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#5264C8" class="mono" xml:space="preserve">┌─────────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#EDF5F7" class="mono" xml:space="preserve">│  DIVERSITY METRICS: WHAT TO USE                                 │</text><text x="46" y="108" fill="#5264C8" class="mono" xml:space="preserve">├─────────────────────────────────────────────────────────────────┤</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">│  S-recall       coverage of subtopics; RANK-BLIND               │</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">│                 -&gt; cheapest diagnostic; use first                │</text><text x="46" y="168" fill="#5264C8" class="mono" xml:space="preserve">├─────────────────────────────────────────────────────────────────┤</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">│  α-nDCG         position × novelty; α is the knob               │</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">│                 -&gt; the workhorse. Report alongside nDCG;         │</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">│                   the GAP is your redundancy cost               │</text><text x="46" y="248" fill="#5264C8" class="mono" xml:space="preserve">├─────────────────────────────────────────────────────────────────┤</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">│  ERR-IA         intent-weighted; generalizes α-nDCG             │</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">│                 -&gt; only if you can estimate intent priors        │</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve">│                   FROM DATA                                     │</text><text x="46" y="328" fill="#5264C8" class="mono" xml:space="preserve">├─────────────────────────────────────────────────────────────────┤</text><text x="46" y="348" fill="#EDF5F7" class="mono" xml:space="preserve">│  NRBP           novelty + RBP&#x27;s residual                        │</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve">│                 -&gt; best fit for sparse judgments; underused      │</text><text x="46" y="388" fill="#5264C8" class="mono" xml:space="preserve">├─────────────────────────────────────────────────────────────────┤</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve">│  FOR RAG, IF YOU CAN AFFORD NO ANNOTATION:                      │</text><text x="46" y="428" fill="#EDF5F7" class="mono" xml:space="preserve">│  RAG-X&#x27;s Pairwise Redundancy + Exclusive Hit Rate               │</text><text x="46" y="448" fill="#EDF5F7" class="mono" xml:space="preserve">│  (Supplement B §D.4) capture the same signal, label-free.       │</text><text x="46" y="468" fill="#5264C8" class="mono" xml:space="preserve">├─────────────────────────────────────────────────────────────────┤</text><text x="46" y="488" fill="#EDF5F7" class="mono" xml:space="preserve">│  THE ARGUMENT TO REMEMBER                                       │</text><text x="46" y="508" fill="#EDF5F7" class="mono" xml:space="preserve">│  Clarke et al.: evaluation measures act as objective functions  │</text><text x="46" y="528" fill="#EDF5F7" class="mono" xml:space="preserve">│  to be optimized. A measure blind to redundancy will produce    │</text><text x="46" y="548" fill="#EDF5F7" class="mono" xml:space="preserve">│  systems that generate it. Your reranker is optimizing whatever │</text><text x="46" y="568" fill="#EDF5F7" class="mono" xml:space="preserve">│  you measure - including the things you forgot to measure.      │</text><text x="46" y="588" fill="#5264C8" class="mono" xml:space="preserve">└─────────────────────────────────────────────────────────────────┘</text>
</svg>
