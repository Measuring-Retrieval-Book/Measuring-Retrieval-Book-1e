<svg xmlns="http://www.w3.org/2000/svg" width="721" height="866" viewBox="0 0 721 866">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="721" height="866" rx="10" fill="#3A1E25"/>
<rect width="721" height="8" rx="4" fill="#E45E4F"/>
<text x="34" y="39" fill="#FFFFFF" class="title">Summary panel</text>
<text x="687" y="37" text-anchor="end" fill="#197FA2" class="label">SUMMARY</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">┌──────────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#EDF5F7" class="mono" xml:space="preserve">│  THE EIGHT                                                       │</text><text x="46" y="108" fill="#E45E4F" class="mono" xml:space="preserve">├───┬──────────────────────────┬──────────────┬────────────────────┤</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">│ # │ METRIC                   │ DIMENSION    │ WHY THIS ONE       │</text><text x="46" y="148" fill="#E45E4F" class="mono" xml:space="preserve">├───┼──────────────────────────┼──────────────┼────────────────────┤</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">│ 1 │ Claim Recall             │ Correctness  │ ceiling on all     │</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">│   │ (RAGChecker)             │              │ downstream quality │</text><text x="46" y="208" fill="#E45E4F" class="mono" xml:space="preserve">├───┼──────────────────────────┼──────────────┼────────────────────┤</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">│ 2 │ Self-Knowledge           │ Correctness  │ the Lucky Guess    │</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">│   │ (RAGChecker)             │              │ rate. Nothing else │</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">│   │                          │              │ measures it.       │</text><text x="46" y="288" fill="#E45E4F" class="mono" xml:space="preserve">├───┼──────────────────────────┼──────────────┼────────────────────┤</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve">│ 3 │ Hallucination            │ Correctness  │ the classic        │</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve">│   │ (RAGChecker)             │              │ failure            │</text><text x="46" y="348" fill="#E45E4F" class="mono" xml:space="preserve">├───┼──────────────────────────┼──────────────┼────────────────────┤</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve">│ 4 │ nDCG@k  (k = injected)   │ Correctness  │ continuity +       │</text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve">│   │                          │              │ comparability      │</text><text x="46" y="408" fill="#E45E4F" class="mono" xml:space="preserve">├───┼──────────────────────────┼──────────────┼────────────────────┤</text><text x="46" y="428" fill="#EDF5F7" class="mono" xml:space="preserve">│ 5 │ One contribution metric  │ Alignment    │ pick ONE: eRAG /   │</text><text x="46" y="448" fill="#EDF5F7" class="mono" xml:space="preserve">│   │                          │              │ DIG / ΔSePer       │</text><text x="46" y="468" fill="#E45E4F" class="mono" xml:space="preserve">├───┼──────────────────────────┼──────────────┼────────────────────┤</text><text x="46" y="488" fill="#EDF5F7" class="mono" xml:space="preserve">│ 6 │ RBO and frozen baseline   │ Integrity    │ cheapest real      │</text><text x="46" y="508" fill="#EDF5F7" class="mono" xml:space="preserve">│   │                          │              │ drift metric       │</text><text x="46" y="528" fill="#E45E4F" class="mono" xml:space="preserve">├───┼──────────────────────────┼──────────────┼────────────────────┤</text><text x="46" y="548" fill="#EDF5F7" class="mono" xml:space="preserve">│ 7 │ Pairwise Redundancy      │ Efficiency   │ reveals quality    │</text><text x="46" y="568" fill="#EDF5F7" class="mono" xml:space="preserve">│   │                          │              │ waste, label-free  │</text><text x="46" y="588" fill="#E45E4F" class="mono" xml:space="preserve">├───┼──────────────────────────┼──────────────┼────────────────────┤</text><text x="46" y="608" fill="#EDF5F7" class="mono" xml:space="preserve">│ 8 │ TTFT p50 / p95           │ Efficiency   │ the latency users  │</text><text x="46" y="628" fill="#EDF5F7" class="mono" xml:space="preserve">│   │                          │              │ actually feel      │</text><text x="46" y="648" fill="#E45E4F" class="mono" xml:space="preserve">└───┴──────────────────────────┴──────────────┴────────────────────┘</text><text x="46" y="668" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="688" fill="#197FA2" class="mono" xml:space="preserve">   PLUS TWO NON-NEGOTIABLE CONTEXT LINES:</text><text x="46" y="708" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="728" fill="#EDF5F7" class="mono" xml:space="preserve">   ▸ Average claim count per response</text><text x="46" y="748" fill="#EDF5F7" class="mono" xml:space="preserve">     (else hallucination-rate improvements are just brevity)</text><text x="46" y="768" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="788" fill="#EDF5F7" class="mono" xml:space="preserve">   ▸ RAG-on and RAG-off accuracy</text><text x="46" y="808" fill="#EDF5F7" class="mono" xml:space="preserve">     (else you don&#x27;t know if retrieval earns its keep)</text>
</svg>
