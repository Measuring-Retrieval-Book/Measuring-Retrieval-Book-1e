<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;So what do I actually do?&quot;</text><text x="46" y="88" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="108" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="148" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Pick metrics that match your reader.</text><text x="46" y="168" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     Report their uncertainty. Tune your</text><text x="46" y="188" fill="#FF9D8A" class="mono" xml:space="preserve">       / \     baseline as hard as your system.</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">              Compare in pairs. Correct for the</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">              number of things you tried.</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">              And plot the k-sweep. Seriously.&quot;</text>
</svg>
