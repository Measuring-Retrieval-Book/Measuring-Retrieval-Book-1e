<svg xmlns="http://www.w3.org/2000/svg" width="720" height="546" viewBox="0 0 720 546">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="546" rx="10" fill="#FFF0ED"/>
<rect width="720" height="8" rx="4" fill="#E45E4F"/>
<text x="34" y="39" fill="#342127" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#7B5960" class="mono" xml:space="preserve">┌───────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#342127" class="mono" xml:space="preserve">│  YOU DO NOT KNOW WHAT IS RELEVANT. NOW WHAT?                  │</text><text x="46" y="108" fill="#7B5960" class="mono" xml:space="preserve">├───────────────────────────────────────────────────────────────┤</text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">│                                                               │</text><text x="46" y="148" fill="#7B5960" class="mono" xml:space="preserve">│  INHERITED a judgment pool     ──▶  bpref                     │</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">│                                     (+ report MAP-bpref gap)  │</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve">│                                                               │</text><text x="46" y="208" fill="#7B5960" class="mono" xml:space="preserve">│  BUILDING a judgment set       ──▶  random sample + infAP     │</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">│                                     with confidence intervals │</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">│                                                               │</text><text x="46" y="268" fill="#342127" class="mono" xml:space="preserve">│  WANT UNCERTAINTY ON THE FACE                                 │</text><text x="46" y="288" fill="#7B5960" class="mono" xml:space="preserve">│  OF THE METRIC                 ──▶  RBP with residual (§5.5)  │</text><text x="46" y="308" fill="#342127" class="mono" xml:space="preserve">│                                                               │</text><text x="46" y="328" fill="#7B5960" class="mono" xml:space="preserve">│  SPARSE RAG LABELS             ──▶  bpref, and stop reporting │</text><text x="46" y="348" fill="#342127" class="mono" xml:space="preserve">│  (gold chunk only)                  precision with       │</text><text x="46" y="368" fill="#342127" class="mono" xml:space="preserve">│                                     unjudged = irrelevant     │</text><text x="46" y="388" fill="#7B5960" class="mono" xml:space="preserve">├───────────────────────────────────────────────────────────────┤</text><text x="46" y="408" fill="#342127" class="mono" xml:space="preserve">│  THE DIAGNOSTIC WORTH RUNNING TODAY                           │</text><text x="46" y="428" fill="#342127" class="mono" xml:space="preserve">│  Compute MAP and bpref on the same runs. The gap between      │</text><text x="46" y="448" fill="#342127" class="mono" xml:space="preserve">│  them estimates how much your incomplete judgments are        │</text><text x="46" y="468" fill="#342127" class="mono" xml:space="preserve">│  distorting your conclusions. It costs one command.           │</text><text x="46" y="488" fill="#7B5960" class="mono" xml:space="preserve">└───────────────────────────────────────────────────────────────┘</text>
</svg>
