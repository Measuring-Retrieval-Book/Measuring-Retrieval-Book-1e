<text x="34" y="39" fill="#183029" class="title">The Independence Trap</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#168C63" class="mono" xml:space="preserve">   THE INDEPENDENCE TRAP</text><text x="46" y="88" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve">   Question: &quot;Did revenue grow faster than costs in FY24?&quot;</text><text x="46" y="128" fill="#527368" class="mono" xml:space="preserve">   Doc A: revenue figures     ──alone──▶ can&#x27;t answer ──▶ label 0</text><text x="46" y="148" fill="#527368" class="mono" xml:space="preserve">   Doc B: cost figures        ──alone──▶ can&#x27;t answer ──▶ label 0</text><text x="46" y="168" fill="#527368" class="mono" xml:space="preserve">   Doc A + Doc B together     ──────────▶ perfect answer</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">   eRAG nDCG: 0.00           Actual system: works fine</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Our retriever scores zero on eRAG.&quot;</text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="308" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Your task is multi-hop. eRAG scores</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       /|\     single documents. It&#x27;s measuring the</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">       / \     wrong unit.&quot;</text>
</svg>
