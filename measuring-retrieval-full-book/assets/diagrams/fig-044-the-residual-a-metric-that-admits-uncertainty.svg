<svg xmlns="http://www.w3.org/2000/svg" width="720" height="666" viewBox="0 0 720 666">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="666" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">The Residual - A Metric That Admits Uncertainty</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#168C63" class="mono" xml:space="preserve">   THE RESIDUAL - A METRIC THAT ADMITS UNCERTAINTY</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ═══════════════════════════════════════════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#527368" class="mono" xml:space="preserve">   ┌──────────────────────────────────────────────┐</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">   │  RBP = 0.42  [+0.05]     &lt;- small residual    │</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">   │                             judgments are    │</text><text x="46" y="188" fill="#527368" class="mono" xml:space="preserve">   │  ├────────┤                 adequate         │</text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">   │  0.42  0.47                                  │</text><text x="46" y="228" fill="#527368" class="mono" xml:space="preserve">   └──────────────────────────────────────────────┘</text><text x="46" y="248" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#527368" class="mono" xml:space="preserve">   ┌──────────────────────────────────────────────┐</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve">   │  RBP = 0.42  [+0.31]     &lt;- HUGE residual     │</text><text x="46" y="308" fill="#183029" class="mono" xml:space="preserve">   │                             your judgments   │</text><text x="46" y="328" fill="#527368" class="mono" xml:space="preserve">   │  ├────────────────────┤     cannot support   │</text><text x="46" y="348" fill="#183029" class="mono" xml:space="preserve">   │  0.42              0.73     this comparison  │</text><text x="46" y="368" fill="#527368" class="mono" xml:space="preserve">   └──────────────────────────────────────────────┘</text><text x="46" y="388" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Both systems scored 0.42.&quot;</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="468" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;One of them might actually be 0.73.</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       /|\     You need more judgments before you</text><text x="46" y="528" fill="#D94C42" class="mono" xml:space="preserve">       / \     can claim anything.&quot;</text><text x="46" y="548" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="568" fill="#168C63" class="mono" xml:space="preserve">   NO OTHER METRIC IN THIS CHAPTER TELLS YOU THIS.</text><text x="46" y="588" fill="#183029" class="mono" xml:space="preserve">   nDCG and MAP report a point estimate and stay silent</text><text x="46" y="608" fill="#183029" class="mono" xml:space="preserve">   about how much of the ranking was never judged.</text>
</svg>
