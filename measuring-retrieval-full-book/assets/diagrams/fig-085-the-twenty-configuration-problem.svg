<svg xmlns="http://www.w3.org/2000/svg" width="720" height="426" viewBox="0 0 720 426">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="426" rx="10" fill="#202541"/>
<rect width="720" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">The Twenty-Configuration Problem</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   THE TWENTY-CONFIGURATION PROBLEM</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ════════════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   You try 20 chunk sizes.</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">   You test each against baseline at α = 0.05.</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">   Expected false positives if NOTHING works: 1</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="228" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Chunk size 384 was significantly better!&quot;</text><text x="46" y="248" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="268" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;You ran twenty tests. One coming back</text><text x="46" y="328" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     significant is the EXPECTED outcome</text><text x="46" y="348" fill="#FF9D8A" class="mono" xml:space="preserve">       / \     under the null. Correct for it, or</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve">              hold out a confirmation set.&quot;</text>
</svg>
