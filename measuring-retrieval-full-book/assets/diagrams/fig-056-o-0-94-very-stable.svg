<text x="46" y="68" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;τ = 0.94. Very stable.&quot;</text><text x="46" y="88" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="108" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="148" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Where were the disagreements?&quot;</text><text x="46" y="168" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="188" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="228" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Ranks 1 and 2 swapped.&quot;</text><text x="46" y="248" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">       / \   &quot;So the top result changed and your</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve">              metric called it 94% stable. τ cannot</text><text x="46" y="308" fill="#162438" class="mono" xml:space="preserve">              see that ranks 1-2 matter more.&quot;</text>
