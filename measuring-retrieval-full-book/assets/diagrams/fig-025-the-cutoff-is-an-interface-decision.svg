<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   THE CUTOFF IS AN INTERFACE DECISION</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ═══════════════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#5264C8" class="mono" xml:space="preserve">   ┌─────────────┐</text><text x="46" y="148" fill="#62D6A8" class="mono" xml:space="preserve">   │ 1. ✓ relevant│  ┐</text><text x="46" y="168" fill="#FF8A76" class="mono" xml:space="preserve">   │ 2. ✗         │  │ P@3 = 2/3 = 0.67</text><text x="46" y="188" fill="#62D6A8" class="mono" xml:space="preserve">   │ 3. ✓ relevant│  ┘</text><text x="46" y="208" fill="#5264C8" class="mono" xml:space="preserve">   ├─────────────┤</text><text x="46" y="228" fill="#FF8A76" class="mono" xml:space="preserve">   │ 4. ✗         │  ┐</text><text x="46" y="248" fill="#62D6A8" class="mono" xml:space="preserve">   │ 5. ✓ relevant│  │ P@10 = 5/10 = 0.50</text><text x="46" y="268" fill="#FF8A76" class="mono" xml:space="preserve">   │ 6. ✗         │  │</text><text x="46" y="288" fill="#FF8A76" class="mono" xml:space="preserve">   │ 7. ✗         │  │</text><text x="46" y="308" fill="#62D6A8" class="mono" xml:space="preserve">   │ 8. ✓ relevant│  │</text><text x="46" y="328" fill="#FF8A76" class="mono" xml:space="preserve">   │ 9. ✗         │  │</text><text x="46" y="348" fill="#62D6A8" class="mono" xml:space="preserve">   │10. ✓ relevant│  ┘</text><text x="46" y="368" fill="#5264C8" class="mono" xml:space="preserve">   └─────────────┘</text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Which one do we report?&quot;</text><text x="46" y="428" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="448" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="468" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="488" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;How many results does your UI show?&quot;</text><text x="46" y="508" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="528" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="548" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="568" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Three.&quot;</text><text x="46" y="588" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="608" fill="#FF9D8A" class="mono" xml:space="preserve">       / \   &quot;Then P@10 is measuring an experience</text><text x="46" y="628" fill="#EDF5F7" class="mono" xml:space="preserve">              no human being has ever had.&quot;</text>
