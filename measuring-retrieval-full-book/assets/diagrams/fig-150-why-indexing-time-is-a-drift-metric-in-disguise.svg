<text x="34" y="39" fill="#FFFFFF" class="title">Why Indexing Time Is A Drift Metric In Disguise</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   WHY INDEXING TIME IS A DRIFT METRIC IN DISGUISE</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ═══════════════════════════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   Supplement A §B.2 recommendation:</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">     &quot;re-embed when the embedder changes&quot;</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">   That recommendation is FREE if a rebuild takes 2 hours.</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">   It is a PROJECT if a rebuild takes 3 weeks.</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;We&#x27;ll re-index quarterly.&quot;</text><text x="46" y="268" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="288" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Have you timed a full rebuild?&quot;</text><text x="46" y="348" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="368" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;...no.&quot;</text><text x="46" y="428" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="448" fill="#FF9D8A" class="mono" xml:space="preserve">       / \   &quot;Then you don&#x27;t have a drift policy.</text><text x="46" y="468" fill="#EDF5F7" class="mono" xml:space="preserve">              You have a drift aspiration.&quot;</text>
</svg>
