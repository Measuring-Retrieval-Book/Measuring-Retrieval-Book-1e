<text x="46" y="68" fill="#00A6C7" class="mono" xml:space="preserve">   VERSION-SENSITIVE QUESTIONS</text><text x="46" y="88" fill="#557184" class="mono" xml:space="preserve">   ═══════════════════════════</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve">   Naive RAG        58%   ███████████</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">   GraphRAG         64%   ████████████</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">   VersionRAG       90%   ██████████████████</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#00A6C7" class="mono" xml:space="preserve">   IMPLICIT CHANGE DETECTION</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">   (noticing an undocumented modification)</text><text x="46" y="248" fill="#557184" class="mono" xml:space="preserve">   ═══════════════════════════════════════</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve">   Baselines      0-10%   ▏</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve">   VersionRAG       60%   ████████████</text><text x="46" y="308" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Our RAG handles our docs fine.&quot;</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="388" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Can it tell you what changed between</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       /|\     v2.1 and v2.2 without being told</text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">       / \     a change occurred?&quot;</text><text x="46" y="468" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;...no.&quot;</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="528" fill="#D94C42" class="mono" xml:space="preserve">       / \    &quot;Neither can anyone else&#x27;s. 0-10%.&quot;</text>
