<svg xmlns="http://www.w3.org/2000/svg" width="730" height="446" viewBox="0 0 730 446">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="730" height="446" rx="10" fill="#FFF6DE"/>
<rect width="730" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">ALGORITHM 1 (as published</text>
<text x="696" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#2A2518" class="mono" xml:space="preserve">   ALGORITHM 1 (as published)</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ══════════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   Require: model M, reference answer a*, entailment model E,</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">            threshold τ, number of samples N</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">   1. Sample N responses  rᵢ ~ P_M(r)</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">   2. Compute likelihoods ℓᵢ = P_M(rᵢ)</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">   3. SePer_H  (hard / clustering variant):</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">        a. Cluster responses so that E(rᵢ,rⱼ) ≥ τ within a cluster</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">        b. Identify C_{a*}, the cluster matching the reference answer</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve">        c. P_M(a*) = Σ_{rᵢ ∈ C_{a*}} ℓᵢ</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">      SePer_S  (soft / kernel variant):</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">        a. kᵢ = E(rᵢ, a*)</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve">        b. P_M(a*) = Σᵢ ℓᵢ · kᵢ</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve">   4. Repeat with retrieved documents D to get P_M(a* | D)</text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve">   5. ΔSePer = P_M(a* | q, D) - P_M(a* | q)</text>
</svg>
