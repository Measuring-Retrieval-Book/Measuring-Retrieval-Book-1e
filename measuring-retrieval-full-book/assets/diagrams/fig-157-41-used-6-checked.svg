<text x="34" y="39" fill="#2A2518" class="title">41 Used. 6 Checked</text>
<text x="724" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   41 USED. 6 CHECKED.</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ═══════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   ████████████████████████████████████████  41 used LLM judges</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">   ██████                                     6 validated against humans</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Six studies found positive correlation.</text><text x="46" y="208" fill="#D94C42" class="mono" xml:space="preserve">       /|\     That&#x27;s reassuring.&quot;</text><text x="46" y="228" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;&#x27;Positive correlation&#x27; is the weakest</text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">       /|\     possible finding. r = 0.3 is a positive</text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">       / \     correlation. The survey&#x27;s own conclusion</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">              is that LLMs can be trusted &#x27;to some</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve">              extent&#x27; and their validity &#x27;remains to be</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve">              thoroughly established.&#x27;&quot;</text>
</svg>
