<svg xmlns="http://www.w3.org/2000/svg" width="720" height="486" viewBox="0 0 720 486">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="486" rx="10" fill="#202541"/>
<rect width="720" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">COHEN&#x27;S κ and KRIPPENDORFF&#x27;S α</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#EDF5F7" class="mono" xml:space="preserve">   COHEN&#x27;S κ and KRIPPENDORFF&#x27;S α</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ═════════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   Cohen&#x27;s κ:        exactly TWO raters, nominal data</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">   Krippendorff&#x27;s α: ANY number of raters, handles</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">                     missing data, works on nominal /</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">                     ordinal / interval scales</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">   Your setup: 1 LLM judge + 2 human annotators,</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">               and the humans didn&#x27;t both label</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">               everything.</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;We&#x27;ll report Cohen&#x27;s kappa.&quot;</text><text x="46" y="328" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="348" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;You have three raters and incomplete</text><text x="46" y="408" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     overlap. κ can&#x27;t represent that.</text><text x="46" y="428" fill="#FF9D8A" class="mono" xml:space="preserve">       / \     Use α.&quot;</text>
</svg>
