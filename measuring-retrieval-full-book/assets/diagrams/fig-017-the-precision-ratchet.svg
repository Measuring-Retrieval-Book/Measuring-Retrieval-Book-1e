<svg xmlns="http://www.w3.org/2000/svg" width="720" height="466" viewBox="0 0 720 466">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="466" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">The Precision Ratchet</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   THE PRECISION RATCHET</text><text x="46" y="88" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve">   Week 1:  P@10 = 0.55, k = 10</text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   Week 4:  P@10 = 0.71, k = 10   &quot;Great progress!&quot;</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">   Week 8:  P@5  = 0.80, k = 5    &quot;Even better!&quot;</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">   Week 12: P@3  = 0.91, k = 3    &quot;Best quarter ever!&quot;</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Recall over the same period?&quot;</text><text x="46" y="228" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="248" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;We stopped tracking it in week 3.&quot;</text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve">   The team optimized precision by returning less. Every</text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve">   number went up. The system found strictly less material</text><text x="46" y="408" fill="#2A2518" class="mono" xml:space="preserve">   every single week.</text>
</svg>
