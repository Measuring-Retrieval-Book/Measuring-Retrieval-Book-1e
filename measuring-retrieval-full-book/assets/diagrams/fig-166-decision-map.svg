<svg xmlns="http://www.w3.org/2000/svg" width="720" height="466" viewBox="0 0 720 466">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="466" rx="10" fill="#E8F7FA"/>
<rect width="720" height="8" rx="4" fill="#00A6C7"/>
<text x="34" y="39" fill="#162438" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#557184" class="mono" xml:space="preserve">   ┌──────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#162438" class="mono" xml:space="preserve">   │  STILL MISSING: MUTATION KILL RATE FOR RAG       │</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">   │  In software testing, you deliberately inject    │</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">   │  bugs and measure what fraction your test suite  │</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">   │  catches. That&#x27;s mutation testing.               │</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve">   │  The RAG analogue would be: corrupt the corpus   │</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">   │  in known ways - swap a date, negate a claim,    │</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">   │  delete a passage - and measure what fraction    │</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve">   │  of corruptions your eval set detects.           │</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="308" fill="#162438" class="mono" xml:space="preserve">   │  Nobody has published this. It is the most       │</text><text x="46" y="328" fill="#162438" class="mono" xml:space="preserve">   │  obvious missing instrument in RAG evaluation.   │</text><text x="46" y="348" fill="#162438" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="368" fill="#162438" class="mono" xml:space="preserve">   │  VersionRAG&#x27;s implicit change detection          │</text><text x="46" y="388" fill="#162438" class="mono" xml:space="preserve">   │  (0-10% baseline) is the closest existing work.  │</text><text x="46" y="408" fill="#557184" class="mono" xml:space="preserve">   └──────────────────────────────────────────────────┘</text>
</svg>
