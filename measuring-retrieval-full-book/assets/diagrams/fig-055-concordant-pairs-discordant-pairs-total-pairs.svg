<text x="34" y="39" fill="#FFFFFF" class="title">τ = (concordant pairs - discordant pairs) / total pairs</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">FORMULA</text>
<text x="46" y="68" fill="#EDF5F7" class="mono" xml:space="preserve">   τ = (concordant pairs - discordant pairs) / total pairs</text><text x="46" y="88" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve">   τ = 1   identical ordering</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   τ = 0   independent</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">   τ = -1  reversed</text>
</svg>
