<svg xmlns="http://www.w3.org/2000/svg" width="720" height="726" viewBox="0 0 720 726">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="726" rx="10" fill="#FFF0ED"/>
<rect width="720" height="8" rx="4" fill="#E45E4F"/>
<text x="34" y="39" fill="#342127" class="title">Agreement At Each Depth</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   AGREEMENT AT EACH DEPTH</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ═══════════════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">   List S (January)      List T (June)</text><text x="46" y="148" fill="#7B5960" class="mono" xml:space="preserve">   ┌──────────┐          ┌──────────┐</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">   │ 1. doc-A │          │ 1. doc-A │   depth 1: 1/1 = 1.00</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve">   │ 2. doc-B │          │ 2. doc-C │   depth 2: 1/2 = 0.50</text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve">   │ 3. doc-C │          │ 3. doc-B │   depth 3: 3/3 = 1.00</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">   │ 4. doc-D │          │ 4. doc-E │   depth 4: 3/4 = 0.75</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">   │ 5. doc-E │          │ 5. doc-F │   depth 5: 4/5 = 0.80</text><text x="46" y="268" fill="#7B5960" class="mono" xml:space="preserve">   └──────────┘          └──────────┘</text><text x="46" y="288" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#342127" class="mono" xml:space="preserve">   RBO = geometric-weighted average of</text><text x="46" y="328" fill="#E45E4F" class="mono" xml:space="preserve">         (1.00, 0.50, 1.00, 0.75, 0.80, ...)</text><text x="46" y="348" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#342127" class="mono" xml:space="preserve">   with p=0.9, shallow depths dominate.</text><text x="46" y="388" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#7B5960" class="mono" xml:space="preserve">   ┌────────────────────────────────────────────┐</text><text x="46" y="428" fill="#342127" class="mono" xml:space="preserve">   │  WHY THIS BEATS JACCARD FOR DRIFT          │</text><text x="46" y="448" fill="#342127" class="mono" xml:space="preserve">   │                                            │</text><text x="46" y="468" fill="#342127" class="mono" xml:space="preserve">   │  Jaccard:  |S∩T| / |S∪T|  at ONE depth     │</text><text x="46" y="488" fill="#342127" class="mono" xml:space="preserve">   │            order-blind, needs a fixed k    │</text><text x="46" y="508" fill="#342127" class="mono" xml:space="preserve">   │                                            │</text><text x="46" y="528" fill="#342127" class="mono" xml:space="preserve">   │  RBO:      every depth, weighted, and      │</text><text x="46" y="548" fill="#342127" class="mono" xml:space="preserve">   │            ORDER-SENSITIVE                 │</text><text x="46" y="568" fill="#342127" class="mono" xml:space="preserve">   │                                            │</text><text x="46" y="588" fill="#342127" class="mono" xml:space="preserve">   │  Two indexes returning the same 10 docs in │</text><text x="46" y="608" fill="#342127" class="mono" xml:space="preserve">   │  reversed order:                           │</text><text x="46" y="628" fill="#342127" class="mono" xml:space="preserve">   │     Jaccard = 1.00  (&quot;no change!&quot;)         │</text><text x="46" y="648" fill="#342127" class="mono" xml:space="preserve">   │     RBO     ≈ 0.5   (correctly alarmed)    │</text><text x="46" y="668" fill="#7B5960" class="mono" xml:space="preserve">   └────────────────────────────────────────────┘</text>
</svg>
