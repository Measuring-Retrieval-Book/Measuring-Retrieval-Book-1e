<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#342127" class="mono" xml:space="preserve">                       IS IT GROUNDED IN CONTEXT?</text><text x="46" y="88" fill="#E45E4F" class="mono" xml:space="preserve">                       YES                 NO</text><text x="46" y="108" fill="#7B5960" class="mono" xml:space="preserve">                 ┌──────────────────┬──────────────────┐</text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">      CORRECT    │  what you want   │  &quot;Lucky Guess&quot;   │</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve">                 │                  │  (RAG-X)         │</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">                 │  supported and   │  &quot;Self-Knowledge&quot;│</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve">                 │  right           │  (RAGChecker)    │</text><text x="46" y="208" fill="#C43C32" class="mono" xml:space="preserve">                 │                  │  CAUTION unauditable   │</text><text x="46" y="228" fill="#7B5960" class="mono" xml:space="preserve">                 ├──────────────────┼──────────────────┤</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">      INCORRECT  │  &quot;Noise          │  &quot;Hallucination&quot; │</text><text x="46" y="268" fill="#342127" class="mono" xml:space="preserve">                 │   Sensitivity&quot;   │                  │</text><text x="46" y="288" fill="#342127" class="mono" xml:space="preserve">                 │  (RAGChecker)    │  the classic     │</text><text x="46" y="308" fill="#342127" class="mono" xml:space="preserve">                 │                  │  failure         │</text><text x="46" y="328" fill="#342127" class="mono" xml:space="preserve">                 │  faithfully      │                  │</text><text x="46" y="348" fill="#342127" class="mono" xml:space="preserve">                 │  wrong           │                  │</text><text x="46" y="368" fill="#7B5960" class="mono" xml:space="preserve">                 └──────────────────┴──────────────────┘</text>
