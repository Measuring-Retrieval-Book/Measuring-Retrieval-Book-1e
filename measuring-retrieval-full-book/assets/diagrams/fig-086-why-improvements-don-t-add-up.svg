<text x="34" y="39" fill="#162438" class="title">Why Improvements Don&#x27;T Add Up</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#00A6C7" class="mono" xml:space="preserve">   WHY IMPROVEMENTS DON&#x27;T ADD UP</text><text x="46" y="88" fill="#557184" class="mono" xml:space="preserve">   ═════════════════════════════</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">   Paper 1: our method beats weak-BM25 by 8%</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">   Paper 2: our method beats weak-BM25 by 6%</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">   Paper 3: our method beats weak-BM25 by 7%</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve">   Combined expectation: ~21% over BM25</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">   Reality: all three are roughly level with</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">            a properly tuned BM25.</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;So the baseline was the problem.&quot;</text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="348" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;The baseline is ALWAYS the problem.</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       /|\     Armstrong et al. found a decade of it.&quot;</text>
</svg>
