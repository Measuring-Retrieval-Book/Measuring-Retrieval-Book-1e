<svg xmlns="http://www.w3.org/2000/svg" width="720" height="406" viewBox="0 0 720 406">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="406" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#736747" class="mono" xml:space="preserve">   ┌─────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#2A2518" class="mono" xml:space="preserve">   │  Before adding a metric to your dashboard:      │</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve">   │                                                 │</text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   │  1. Which ONE dimension does it primarily       │</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">   │     answer?                                     │</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">   │                                                 │</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">   │  2. Do you already have a metric for that       │</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">   │     dimension?                                  │</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">   │                                                 │</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">   │  3. If yes - does this one measure something    │</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">   │     the existing one CANNOT?                    │</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve">   │                                                 │</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">   │  If you cannot answer 3, you are adding noise,  │</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">   │  not signal.                                    │</text><text x="46" y="348" fill="#736747" class="mono" xml:space="preserve">   └─────────────────────────────────────────────────┘</text>
</svg>
