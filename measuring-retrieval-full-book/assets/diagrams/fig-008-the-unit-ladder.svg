<svg xmlns="http://www.w3.org/2000/svg" width="720" height="766" viewBox="0 0 720 766">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="766" rx="10" fill="#FFF0ED"/>
<rect width="720" height="8" rx="4" fill="#E45E4F"/>
<text x="34" y="39" fill="#342127" class="title">The Unit Ladder</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   THE UNIT LADDER</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ═══════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">   SYSTEM     ┃ one number for the whole deployment</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve">              ┃  e.g. Elo, index size</text><text x="46" y="168" fill="#7B5960" class="mono" xml:space="preserve">   ───────────┃──────────────────────────────────────</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve">   CORPUS     ┃ one number for the document collection</text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve">              ┃  e.g. coverage, pool bias, drift</text><text x="46" y="228" fill="#7B5960" class="mono" xml:space="preserve">   ───────────┃──────────────────────────────────────</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">   SESSION    ┃ one number per user journey</text><text x="46" y="268" fill="#342127" class="mono" xml:space="preserve">              ┃  e.g. sDCG, abandonment</text><text x="46" y="288" fill="#7B5960" class="mono" xml:space="preserve">   ───────────┃──────────────────────────────────────</text><text x="46" y="308" fill="#342127" class="mono" xml:space="preserve">   QUERY      ┃ one number per question</text><text x="46" y="328" fill="#342127" class="mono" xml:space="preserve">              ┃  e.g. nDCG, MRR, accuracy</text><text x="46" y="348" fill="#7B5960" class="mono" xml:space="preserve">   ───────────┃──────────────────────────────────────</text><text x="46" y="368" fill="#087A54" class="mono" xml:space="preserve">   PASSAGE    ┃ one number per retrieved chunk</text><text x="46" y="388" fill="#342127" class="mono" xml:space="preserve">              ┃  e.g. DIG, Gain, context relevance</text><text x="46" y="408" fill="#7B5960" class="mono" xml:space="preserve">   ───────────┃──────────────────────────────────────</text><text x="46" y="428" fill="#342127" class="mono" xml:space="preserve">   CLAIM      ┃ one number per atomic assertion</text><text x="46" y="448" fill="#342127" class="mono" xml:space="preserve">              ┃  e.g. FActScore, Claim Recall</text><text x="46" y="468" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="488" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">        o     &quot;Our average score is 0.82.&quot;</text><text x="46" y="528" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="548" fill="#D94C42" class="mono" xml:space="preserve">       / \    &quot;Averaged over claims or over queries?&quot;</text><text x="46" y="568" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="588" fill="#D94C42" class="mono" xml:space="preserve">        o     &quot;Does it matter?&quot;</text><text x="46" y="608" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="628" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="648" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="668" fill="#D94C42" class="mono" xml:space="preserve">        o     &quot;A query with 40 claims and a query with 2</text><text x="46" y="688" fill="#D94C42" class="mono" xml:space="preserve">       /|\     both count once at query level. They do NOT</text><text x="46" y="708" fill="#D94C42" class="mono" xml:space="preserve">       / \     count equally at claim level.&quot;</text>
</svg>
