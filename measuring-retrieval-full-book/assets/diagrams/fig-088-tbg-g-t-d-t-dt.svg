<text x="34" y="39" fill="#342127" class="title">TBG = ∫ G(t) · D(t) dt</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">FORMULA</text>
<text x="46" y="68" fill="#342127" class="mono" xml:space="preserve">   TBG = ∫  G(t) · D(t)  dt</text><text x="46" y="88" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve">     G(t) = gain accumulated by time t</text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">     D(t) = decay function: probability the user</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve">            CONTINUES until time t,  with D(0) = 1</text>
</svg>
