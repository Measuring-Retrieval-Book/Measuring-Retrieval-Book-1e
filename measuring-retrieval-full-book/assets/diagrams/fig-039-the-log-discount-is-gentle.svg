<svg xmlns="http://www.w3.org/2000/svg" width="720" height="726" viewBox="0 0 720 726">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="726" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">The Log Discount Is Gentle</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#168C63" class="mono" xml:space="preserve">   THE LOG DISCOUNT IS GENTLE</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ══════════════════════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   rank   1/i (MRR-ish)   1/log2(i+1) (DCG)</text><text x="46" y="148" fill="#527368" class="mono" xml:space="preserve">   ────   ─────────────   ─────────────────</text><text x="46" y="168" fill="#168C63" class="mono" xml:space="preserve">    1        1.000            1.000</text><text x="46" y="188" fill="#168C63" class="mono" xml:space="preserve">    2        0.500            0.631</text><text x="46" y="208" fill="#168C63" class="mono" xml:space="preserve">    3        0.333            0.500</text><text x="46" y="228" fill="#168C63" class="mono" xml:space="preserve">    5        0.200            0.387</text><text x="46" y="248" fill="#168C63" class="mono" xml:space="preserve">   10        0.100            0.289</text><text x="46" y="268" fill="#168C63" class="mono" xml:space="preserve">   20        0.050            0.228</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">        1.0 ┤●</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">            │ o●              o = 1/log2(i+1)</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">            │  o ●            ● = 1/i</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">        0.5 ┤   o  ●</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">            │     o   ●●</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">            │        ooo ●●●●●</text><text x="46" y="428" fill="#183029" class="mono" xml:space="preserve">        0.0 ┤            oooooo</text><text x="46" y="448" fill="#527368" class="mono" xml:space="preserve">            └──────────────────────</text><text x="46" y="468" fill="#168C63" class="mono" xml:space="preserve">              1  3  5  7  9  11  13</text><text x="46" y="488" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Why logarithmic specifically?&quot;</text><text x="46" y="528" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="548" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="568" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="588" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;It&#x27;s a modelling choice, not a derivation.</text><text x="46" y="608" fill="#D94C42" class="mono" xml:space="preserve">       /|\     Järvelin and Kekäläinen wanted a discount</text><text x="46" y="628" fill="#D94C42" class="mono" xml:space="preserve">       / \     that penalized depth without making rank 10</text><text x="46" y="648" fill="#183029" class="mono" xml:space="preserve">              worthless. Log does that. Other shapes</text><text x="46" y="668" fill="#183029" class="mono" xml:space="preserve">              would too - RBP picks a different one.&quot;</text>
</svg>
