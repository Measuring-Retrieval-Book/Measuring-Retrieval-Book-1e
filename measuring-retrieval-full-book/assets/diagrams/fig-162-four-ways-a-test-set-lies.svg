<text x="34" y="39" fill="#2A2518" class="title">Four Ways A Test Set Lies</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   FOUR WAYS A TEST SET LIES</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ═════════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#736747" class="mono" xml:space="preserve">   1. COVERAGE GAP    ── whole regions of the corpus</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">                         are never queried</text><text x="46" y="168" fill="#736747" class="mono" xml:space="preserve">   2. LEAKAGE         ── the answers are in the model&#x27;s</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">                         training data</text><text x="46" y="208" fill="#736747" class="mono" xml:space="preserve">   3. NO DIVERSITY    ── 200 questions, one template</text><text x="46" y="228" fill="#736747" class="mono" xml:space="preserve">   4. PRIVACY LEAK    ── synthetic questions carry</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">                         real sensitive content</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Our eval set has 500 questions.&quot;</text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Covering what fraction of your corpus?&quot;</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="428" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;...I don&#x27;t know how to answer that.&quot;</text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       / \   &quot;That&#x27;s what §14.1 is for.&quot;</text>
</svg>
