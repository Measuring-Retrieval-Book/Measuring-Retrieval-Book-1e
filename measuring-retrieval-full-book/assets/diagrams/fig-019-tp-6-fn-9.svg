<text x="46" y="68" fill="#183029" class="mono" xml:space="preserve">   TP = 6,  FN = 9</text><text x="46" y="88" fill="#183029" class="mono" xml:space="preserve">   R = 6 / (6 + 9) = 0.40</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   Note: precision was 0.60, recall is 0.40.</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">   Two numbers, same result set, very different stories.</text>
