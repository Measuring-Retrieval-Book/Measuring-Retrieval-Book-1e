<text x="34" y="39" fill="#342127" class="title">The Two 2018 Papers</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   THE TWO 2018 PAPERS</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ═══════════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#E45E4F" class="mono" xml:space="preserve">   SINGH &amp; JOACHIMS (KDD)        BIEGA ET AL. (SIGIR)</text><text x="46" y="148" fill="#7B5960" class="mono" xml:space="preserve">   ──────────────────────        ────────────────────</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">   GROUP fairness                INDIVIDUAL fairness</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve">   demographic parity            per-item proportionality</text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve">   within ONE ranking            AMORTIZED over many</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">                                 rankings</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Which one do I need?&quot;</text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="328" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Group labels and regulatory exposure</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">       /|\     -&gt; Singh &amp; Joachims.</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       / \     A marketplace where each seller is a</text><text x="46" y="408" fill="#342127" class="mono" xml:space="preserve">              stakeholder -&gt; Biega et al.</text><text x="46" y="428" fill="#342127" class="mono" xml:space="preserve">              They answer different questions.&quot;</text>
</svg>
