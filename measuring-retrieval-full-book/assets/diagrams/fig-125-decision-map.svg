<svg xmlns="http://www.w3.org/2000/svg" width="720" height="526" viewBox="0 0 720 526">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="526" rx="10" fill="#202541"/>
<rect width="720" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#5264C8" class="mono" xml:space="preserve">   ┌──────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#EDF5F7" class="mono" xml:space="preserve">   │  JUDGE DRIFT PROTOCOL  │</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   │  1. PIN the judge model version. Explicitly.     │</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">   │     Not &quot;gpt-4o&quot; - the dated snapshot.           │</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">   │  2. FREEZE an anchor set: 100-200 items with     │</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">   │     human labels.                                │</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">   │  3. On EVERY judge change, re-run the anchor     │</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">   │     set. Record judge-human agreement            │</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">   │     (Krippendorff&#x27;s α, not κ - you&#x27;ll have       │</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve">   │     more than two raters).                       │</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="348" fill="#EDF5F7" class="mono" xml:space="preserve">   │  4. If α moves materially, your historical       │</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve">   │     series is broken. Say so in the report       │</text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve">   │     and reset the historical line.       │</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="428" fill="#EDF5F7" class="mono" xml:space="preserve">   │  5. NEVER let the same model generate synthetic  │</text><text x="46" y="448" fill="#EDF5F7" class="mono" xml:space="preserve">   │     test data AND judge the results.             │</text><text x="46" y="468" fill="#5264C8" class="mono" xml:space="preserve">   └──────────────────────────────────────────────────┘</text>
</svg>
