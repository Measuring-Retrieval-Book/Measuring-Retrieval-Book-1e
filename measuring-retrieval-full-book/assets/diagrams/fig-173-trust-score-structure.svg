<svg xmlns="http://www.w3.org/2000/svg" width="720" height="466" viewBox="0 0 720 466">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="466" rx="10" fill="#FFF0ED"/>
<rect width="720" height="8" rx="4" fill="#E45E4F"/>
<text x="34" y="39" fill="#342127" class="title">Trust-Score Structure</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   TRUST-SCORE STRUCTURE</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ═════════════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#E45E4F" class="mono" xml:space="preserve">   RESPONSE TRUTHFULNESS</text><text x="46" y="148" fill="#7B5960" class="mono" xml:space="preserve">   ├── F1_GR  Grounded Refusal (macro-avg of two F1s)</text><text x="46" y="168" fill="#7B5960" class="mono" xml:space="preserve">   │     ├── F1_ref : correctly REFUSING unanswerable Qs</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve">   │     │     P_ref = |¬A_r ∩ ¬A_g| / |¬A_r|</text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve">   │     │     R_ref = |¬A_r ∩ ¬A_g| / |¬A_g|</text><text x="46" y="228" fill="#7B5960" class="mono" xml:space="preserve">   │     └── F1_ans : correctly ANSWERING answerable Qs</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">   │</text><text x="46" y="268" fill="#7B5960" class="mono" xml:space="preserve">   └── F1_AC  answer-calibrated Answer Correctness</text><text x="46" y="288" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#E45E4F" class="mono" xml:space="preserve">   ATTRIBUTION GROUNDEDNESS</text><text x="46" y="328" fill="#7B5960" class="mono" xml:space="preserve">   ├── R_cite  Citation Recall     ┐ adopted directly</text><text x="46" y="348" fill="#7B5960" class="mono" xml:space="preserve">   └── P_cite  Citation Precision  ┘ from ALCE (Gao et al.)</text><text x="46" y="368" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#342127" class="mono" xml:space="preserve">   where A_g / ¬A_g = ground-truth answerable / unanswerable</text><text x="46" y="408" fill="#342127" class="mono" xml:space="preserve">         A_r / ¬A_r = model answered / refused</text>
</svg>
