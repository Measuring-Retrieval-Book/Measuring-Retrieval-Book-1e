<svg xmlns="http://www.w3.org/2000/svg" width="748" height="726" viewBox="0 0 748 726">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="748" height="726" rx="10" fill="#202541"/>
<rect width="748" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">Decision map</text>
<text x="714" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#5264C8" class="mono" xml:space="preserve">┌────────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#EDF5F7" class="mono" xml:space="preserve">│  ONLINE EVALUATION: THE HIERARCHY                              │</text><text x="46" y="108" fill="#5264C8" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">│  DECIDING between rankers                                      │</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">│    ▸ high traffic     -&gt; INTERLEAVING (most sensitive)          │</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">│    ▸ no deployment    -&gt; IPS / counterfactual (shortlist)       │</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">│    ▸ low traffic      -&gt; offline metrics; online won&#x27;t reach    │</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">│                         significance                           │</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">│  MONITORING for breakage                                       │</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">│    ▸ absolute click metrics ARE useful here                    │</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve">│    ▸ they are NOT useful for deciding quality                  │</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="348" fill="#5264C8" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="368" fill="#FF8A76" class="mono" xml:space="preserve">│  CAUTION THE 2008 RESULT, RESTATED                                  │</text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve">│  Eight absolute usage metrics - clicks, reformulations,        │</text><text x="46" y="428" fill="#EDF5F7" class="mono" xml:space="preserve">│  abandonment among them - did NOT reliably reflect retrieval   │</text><text x="46" y="448" fill="#EDF5F7" class="mono" xml:space="preserve">│  quality at realistic sample sizes.                            │</text><text x="46" y="468" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="488" fill="#EDF5F7" class="mono" xml:space="preserve">│  Paired interleaved comparisons DID.                           │</text><text x="46" y="508" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="528" fill="#EDF5F7" class="mono" xml:space="preserve">│  Most production dashboards are built on the first group.      │</text><text x="46" y="548" fill="#5264C8" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="568" fill="#EDF5F7" class="mono" xml:space="preserve">│  THE RAG GAP                                                   │</text><text x="46" y="588" fill="#EDF5F7" class="mono" xml:space="preserve">│  You can interleave retrieved SOURCES. You cannot interleave   │</text><text x="46" y="608" fill="#EDF5F7" class="mono" xml:space="preserve">│  generated ANSWERS - the user reads one text. There is no      │</text><text x="46" y="628" fill="#EDF5F7" class="mono" xml:space="preserve">│  published answer to online RAG evaluation, and       │</text><text x="46" y="648" fill="#EDF5F7" class="mono" xml:space="preserve">│  anyone claiming otherwise is extrapolating.                   │</text><text x="46" y="668" fill="#5264C8" class="mono" xml:space="preserve">└────────────────────────────────────────────────────────────────┘</text>
</svg>
