<svg xmlns="http://www.w3.org/2000/svg" width="720" height="646" viewBox="0 0 720 646">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="646" rx="10" fill="#E8F7FA"/>
<rect width="720" height="8" rx="4" fill="#00A6C7"/>
<text x="34" y="39" fill="#162438" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#557184" class="mono" xml:space="preserve">┌────────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#162438" class="mono" xml:space="preserve">│  ALIGNMENT: WHAT TO ACTUALLY PUT ON THE DASHBOARD              │</text><text x="46" y="108" fill="#557184" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">│  PICK ONE contribution metric:                                 │</text><text x="46" y="168" fill="#557184" class="mono" xml:space="preserve">│     golden answers + offline  ──▶ ΔSePer                       │</text><text x="46" y="188" fill="#557184" class="mono" xml:space="preserve">│     golden answers + CI       ──▶ eRAG                         │</text><text x="46" y="208" fill="#557184" class="mono" xml:space="preserve">│     no golden answers         ──▶ DIG                          │</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">│  PLUS one from each other family:                              │</text><text x="46" y="268" fill="#557184" class="mono" xml:space="preserve">│     attribution               ──▶ WARG                         │</text><text x="46" y="288" fill="#557184" class="mono" xml:space="preserve">│     quadrant diagnosis        ──▶ CUE  (or MIRAGE offline)     │</text><text x="46" y="308" fill="#557184" class="mono" xml:space="preserve">│     machine-utility ranking   ──▶ UDCG (if generator stable)   │</text><text x="46" y="328" fill="#162438" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="348" fill="#557184" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="368" fill="#162438" class="mono" xml:space="preserve">│  THE THREE THINGS TO REMEMBER                                  │</text><text x="46" y="388" fill="#162438" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="408" fill="#162438" class="mono" xml:space="preserve">│  1. Never report faithfulness/adherence without a              │</text><text x="46" y="428" fill="#162438" class="mono" xml:space="preserve">│     retrieval-hit denominator beside it. (Adherence Paradox)   │</text><text x="46" y="448" fill="#162438" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="468" fill="#162438" class="mono" xml:space="preserve">│  2. Relevance and utility can point in OPPOSITE directions.    │</text><text x="46" y="488" fill="#162438" class="mono" xml:space="preserve">│     Two independent groups found this. (Preference Gap)        │</text><text x="46" y="508" fill="#162438" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="528" fill="#162438" class="mono" xml:space="preserve">│  3. On most queries the generator may not be using your        │</text><text x="46" y="548" fill="#162438" class="mono" xml:space="preserve">│     top-ranked document at all. Check before optimizing        │</text><text x="46" y="568" fill="#162438" class="mono" xml:space="preserve">│     rank. (47-67%, WARG)                                       │</text><text x="46" y="588" fill="#557184" class="mono" xml:space="preserve">└────────────────────────────────────────────────────────────────┘</text>
</svg>
