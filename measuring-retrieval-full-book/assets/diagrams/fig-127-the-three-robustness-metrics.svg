<rect width="720" height="746" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">The Three Robustness Metrics</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   THE THREE ROBUSTNESS METRICS</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ════════════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#D98B00" class="mono" xml:space="preserve">   NO-DEGRADATION RATE</text><text x="46" y="148" fill="#736747" class="mono" xml:space="preserve">   ┌────────────────────────────────────┐</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">   │  RAG ≥ no-RAG ?                    │</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">   │                                    │</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">   │  no-RAG:  ████████░░  0.62         │</text><text x="46" y="228" fill="#087A54" class="mono" xml:space="preserve">   │  RAG:     ██████████  0.71  ✓      │</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">   │                                    │</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">   │  Fails when retrieval makes it     │</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve">   │  WORSE - which happens more than   │</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">   │  anyone admits.                    │</text><text x="46" y="328" fill="#736747" class="mono" xml:space="preserve">   └────────────────────────────────────┘</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#D98B00" class="mono" xml:space="preserve">   RETRIEVAL SIZE ROBUSTNESS</text><text x="46" y="388" fill="#736747" class="mono" xml:space="preserve">   ┌────────────────────────────────────┐</text><text x="46" y="408" fill="#2A2518" class="mono" xml:space="preserve">   │  more docs ≥ fewer docs ?          │</text><text x="46" y="428" fill="#2A2518" class="mono" xml:space="preserve">   │                                    │</text><text x="46" y="448" fill="#2A2518" class="mono" xml:space="preserve">   │  k=5   ████████░░                  │</text><text x="46" y="468" fill="#2A2518" class="mono" xml:space="preserve">   │  k=20  █████████░                  │</text><text x="46" y="488" fill="#C43C32" class="mono" xml:space="preserve">   │  k=50  ███████░░░  ✗ dropped       │</text><text x="46" y="508" fill="#736747" class="mono" xml:space="preserve">   └────────────────────────────────────┘</text><text x="46" y="528" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="548" fill="#D98B00" class="mono" xml:space="preserve">   RETRIEVAL ORDER ROBUSTNESS</text><text x="46" y="568" fill="#736747" class="mono" xml:space="preserve">   ┌────────────────────────────────────┐</text><text x="46" y="588" fill="#2A2518" class="mono" xml:space="preserve">   │  original ≈ reversed ≈ shuffled ?  │</text><text x="46" y="608" fill="#2A2518" class="mono" xml:space="preserve">   │                                    │</text><text x="46" y="628" fill="#2A2518" class="mono" xml:space="preserve">   │  original  ████████░░              │</text><text x="46" y="648" fill="#2A2518" class="mono" xml:space="preserve">   │  reversed  ███████░░░              │</text><text x="46" y="668" fill="#2A2518" class="mono" xml:space="preserve">   │  shuffled  ████████░░              │</text><text x="46" y="688" fill="#736747" class="mono" xml:space="preserve">   └────────────────────────────────────┘</text>
</svg>
