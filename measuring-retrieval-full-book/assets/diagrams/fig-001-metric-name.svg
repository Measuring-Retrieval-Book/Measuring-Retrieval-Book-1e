<svg xmlns="http://www.w3.org/2000/svg" width="720" height="346" viewBox="0 0 720 346">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="346" rx="10" fill="#E8F7FA"/>
<rect width="720" height="8" rx="4" fill="#00A6C7"/>
<text x="34" y="39" fill="#162438" class="title"> Metric Name</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">FORMULA</text>
<text x="46" y="68" fill="#162438" class="mono" xml:space="preserve">### Metric Name</text><text x="46" y="88" fill="#162438" class="mono" xml:space="preserve">  One-line          - what it measures, in a sentence</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve">  Formula           - the actual computation</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">  Facets            - dimension | unit | supervision | stage</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">  The problem       - what you could not tell before it</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">  The idea          - how it works, built up in order</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">  Worked example    - real numbers, computed in the open</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve">  Advantages        - when it earns its place</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">  Disadvantages     - how it misleads</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">  Domain examples   - three sectors, concretely</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve">  Recommendation    - what to actually do</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve">  Failure mode      - the specific way teams get burned</text>
</svg>
