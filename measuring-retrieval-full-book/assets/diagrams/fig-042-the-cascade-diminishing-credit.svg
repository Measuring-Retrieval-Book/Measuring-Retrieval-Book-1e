<svg xmlns="http://www.w3.org/2000/svg" width="720" height="666" viewBox="0 0 720 666">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="666" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">The Cascade - Diminishing Credit</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   THE CASCADE - DIMINISHING CREDIT</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ════════════════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   Case 1: relevant at rank 5, NOTHING above it</text><text x="46" y="148" fill="#736747" class="mono" xml:space="preserve">     ┌───────────────────────┐</text><text x="46" y="168" fill="#C43C32" class="mono" xml:space="preserve">     │ 1 ✗  ↓                │</text><text x="46" y="188" fill="#C43C32" class="mono" xml:space="preserve">     │ 2 ✗  ↓  user keeps    │  user very likely</text><text x="46" y="208" fill="#C43C32" class="mono" xml:space="preserve">     │ 3 ✗  ↓  scanning      │  REACHES rank 5</text><text x="46" y="228" fill="#C43C32" class="mono" xml:space="preserve">     │ 4 ✗  ↓                │</text><text x="46" y="248" fill="#087A54" class="mono" xml:space="preserve">     │ 5 ✓  STOP             │  -&gt; rank 5 gets</text><text x="46" y="268" fill="#736747" class="mono" xml:space="preserve">     └───────────────────────┘    substantial credit</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">   Case 2: relevant at rank 5, ALSO relevant at rank 1</text><text x="46" y="328" fill="#736747" class="mono" xml:space="preserve">     ┌───────────────────────┐</text><text x="46" y="348" fill="#087A54" class="mono" xml:space="preserve">     │ 1 ✓  STOP  ────────╮  │  user probably</text><text x="46" y="368" fill="#C43C32" class="mono" xml:space="preserve">     │ 2 ✗                │  │  NEVER REACHES 5</text><text x="46" y="388" fill="#C43C32" class="mono" xml:space="preserve">     │ 3 ✗                │  │</text><text x="46" y="408" fill="#C43C32" class="mono" xml:space="preserve">     │ 4 ✗                │  │  -&gt; rank 5 gets</text><text x="46" y="428" fill="#087A54" class="mono" xml:space="preserve">     │ 5 ✓  (unseen) ◀────╯  │    almost no credit</text><text x="46" y="448" fill="#736747" class="mono" xml:space="preserve">     └───────────────────────┘</text><text x="46" y="468" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;nDCG gives rank 5 the same discount</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       /|\     in both cases.&quot;</text><text x="46" y="528" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="548" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="568" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Right. ERR doesn&#x27;t. That&#x27;s the whole</text><text x="46" y="588" fill="#D94C42" class="mono" xml:space="preserve">       /|\     contribution.&quot;</text><text x="46" y="608" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
</svg>
