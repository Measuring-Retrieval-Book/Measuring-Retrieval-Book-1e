<svg xmlns="http://www.w3.org/2000/svg" width="721" height="466" viewBox="0 0 721 466">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="721" height="466" rx="10" fill="#202541"/>
<rect width="721" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">The Fisherman&#x27;S First Question</text>
<text x="687" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">        THE FISHERMAN&#x27;S FIRST QUESTION</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">        ══════════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   &quot;Is everything in my net actually a fish?&quot;</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="168" fill="#5264C8" class="mono" xml:space="preserve">         ╔═══════════════╗</text><text x="46" y="188" fill="#5264C8" class="mono" xml:space="preserve">         ║  &gt;&lt;&gt;   &gt;&lt;&gt;    ║       ╔═══════════════╗</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">         ║      &gt;&lt;&gt;      ║       ║  &gt;&lt;&gt;   [boot] ║</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">         ║  &gt;&lt;&gt;          ║       ║  [can] &gt;&lt;&gt;    ║</text><text x="46" y="248" fill="#5264C8" class="mono" xml:space="preserve">         ╚═══════════════╝       ╚═══════════════╝</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">          PRECISION = 1.0         PRECISION = 0.5</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#FF9D8A" class="mono" xml:space="preserve">              o                        o</text><text x="46" y="328" fill="#FF9D8A" class="mono" xml:space="preserve">             /|\  &quot;Perfect!&quot;          /|\  &quot;Half my net is garbage.&quot;</text><text x="46" y="348" fill="#FF9D8A" class="mono" xml:space="preserve">             / \                      / \</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve">   Neither figure has ANY idea how many fish are still</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve">   in the river. That is a different question entirely.</text>
</svg>
