<rect width="720" height="526" rx="10" fill="#FFF0ED"/>
<rect width="720" height="8" rx="4" fill="#E45E4F"/>
<text x="34" y="39" fill="#342127" class="title">The Sign Problem</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   THE SIGN PROBLEM</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ════════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#E45E4F" class="mono" xml:space="preserve">   CLASSICAL IR:              RAG:</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve">   relevance ∈ [0, 3]         utility ∈ [-?, +?]</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#7B5960" class="mono" xml:space="preserve">   ┌──────────────┐           ┌──────────────┐</text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve">   │ irrelevant   │           │ distracting  │</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">   │   gain = 0   │           │  gain &lt; 0    │</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">   │              │           │              │</text><text x="46" y="268" fill="#342127" class="mono" xml:space="preserve">   │ &quot;costs you   │           │ &quot;costs you   │</text><text x="46" y="288" fill="#342127" class="mono" xml:space="preserve">   │  a slot&quot;     │           │  the ANSWER&quot; │</text><text x="46" y="308" fill="#7B5960" class="mono" xml:space="preserve">   └──────────────┘           └──────────────┘</text><text x="46" y="328" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;nDCG says this doc contributes zero.&quot;</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="408" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;It contributes NEGATIVE. nDCG has no</text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">       /|\     way to express that.&quot;</text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
</svg>
