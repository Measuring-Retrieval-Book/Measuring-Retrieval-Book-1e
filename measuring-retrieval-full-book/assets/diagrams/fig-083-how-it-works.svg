<svg xmlns="http://www.w3.org/2000/svg" width="720" height="606" viewBox="0 0 720 606">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="606" rx="10" fill="#FFF0ED"/>
<rect width="720" height="8" rx="4" fill="#E45E4F"/>
<text x="34" y="39" fill="#342127" class="title">How It Works</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   HOW IT WORKS</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">   For each query, you have two scores: A_q and B_q.</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve">   Observed difference: D = mean(A) - mean(B)</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve">   Now: for each query, randomly SWAP A_q and B_q</text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve">        (or don&#x27;t), with probability ½.</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">        Recompute the mean difference.</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">        Repeat 10,000 times.</text><text x="46" y="268" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#7B5960" class="mono" xml:space="preserve">   ┌──────────────────────────────────────────┐</text><text x="46" y="308" fill="#342127" class="mono" xml:space="preserve">   │  distribution of shuffled differences    │</text><text x="46" y="328" fill="#342127" class="mono" xml:space="preserve">   │                                          │</text><text x="46" y="348" fill="#342127" class="mono" xml:space="preserve">   │           ▁▃▅███▅▃▁                      │</text><text x="46" y="368" fill="#7B5960" class="mono" xml:space="preserve">   │      ─────────────────────────── 0       │</text><text x="46" y="388" fill="#7B5960" class="mono" xml:space="preserve">   │                        ▲                 │</text><text x="46" y="408" fill="#7B5960" class="mono" xml:space="preserve">   │                        └── your observed  │</text><text x="46" y="428" fill="#342127" class="mono" xml:space="preserve">   │                            D             │</text><text x="46" y="448" fill="#342127" class="mono" xml:space="preserve">   │                                          │</text><text x="46" y="468" fill="#342127" class="mono" xml:space="preserve">   │  p = fraction of shuffles ≥ |D|          │</text><text x="46" y="488" fill="#7B5960" class="mono" xml:space="preserve">   └──────────────────────────────────────────┘</text><text x="46" y="508" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="528" fill="#342127" class="mono" xml:space="preserve">   If your observed difference is unremarkable among</text><text x="46" y="548" fill="#342127" class="mono" xml:space="preserve">   random reshuffles, it is not evidence of anything.</text>
</svg>
