<svg xmlns="http://www.w3.org/2000/svg" width="748" height="666" viewBox="0 0 748 666">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="748" height="666" rx="10" fill="#202541"/>
<rect width="748" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">Decision map</text>
<text x="714" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#5264C8" class="mono" xml:space="preserve">┌────────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#EDF5F7" class="mono" xml:space="preserve">│  FAIRNESS: WHAT TO MEASURE                                     │</text><text x="46" y="108" fill="#5264C8" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">│  GROUP labels available + regulatory exposure                  │</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">│    -&gt; Fairness of Exposure (Singh &amp; Joachims, KDD&#x27;18)           │</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">│  NO group labels, repeated-interface system                    │</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">│    -&gt; Equity of Attention (Biega et al., SIGIR&#x27;18)              │</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">│  Multilingual retrieval                                        │</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">│    -&gt; PEER                                                      │</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve">│  Contested / political topics                                  │</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve">│    -&gt; DUO (indexical bias)                                      │</text><text x="46" y="348" fill="#5264C8" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve">│  THE DIAGNOSTIC TO RUN EVEN IF FAIRNESS ISN&#x27;T YOUR GOAL        │</text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve">│  Compute the exposure distribution over your corpus.           │</text><text x="46" y="428" fill="#EDF5F7" class="mono" xml:space="preserve">│  Two things fall out for free:                                 │</text><text x="46" y="448" fill="#EDF5F7" class="mono" xml:space="preserve">│    ▸ how concentrated attention is                             │</text><text x="46" y="468" fill="#EDF5F7" class="mono" xml:space="preserve">│    ▸ which documents are NEVER retrieved                       │</text><text x="46" y="488" fill="#EDF5F7" class="mono" xml:space="preserve">│  The second is a corpus-health signal no other metric gives.   │</text><text x="46" y="508" fill="#5264C8" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="528" fill="#FF8A76" class="mono" xml:space="preserve">│  CAUTION REMEMBER: these metrics can TRADE OFF against nDCG. They   │</text><text x="46" y="548" fill="#EDF5F7" class="mono" xml:space="preserve">│  are constraints, not quality measures. Optimizing them will   │</text><text x="46" y="568" fill="#EDF5F7" class="mono" xml:space="preserve">│  reduce measured relevance, and that is the intended           │</text><text x="46" y="588" fill="#EDF5F7" class="mono" xml:space="preserve">│  behaviour, not a regression.                                  │</text><text x="46" y="608" fill="#5264C8" class="mono" xml:space="preserve">└────────────────────────────────────────────────────────────────┘</text>
</svg>
