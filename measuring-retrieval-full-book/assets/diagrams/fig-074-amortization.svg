<svg xmlns="http://www.w3.org/2000/svg" width="720" height="466" viewBox="0 0 720 466">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="466" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">Amortization</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#168C63" class="mono" xml:space="preserve">   AMORTIZATION</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ════════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   Query 1:  A B C      Individually unfair (A wins)</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">   Query 2:  B C A      Individually unfair (B wins)</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">   Query 3:  C A B      Individually unfair (C wins)</text><text x="46" y="188" fill="#527368" class="mono" xml:space="preserve">             ───────</text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">   Amortized: A, B, C each got top position once.</text><text x="46" y="228" fill="#168C63" class="mono" xml:space="preserve">              FAIR IN AGGREGATE.</text><text x="46" y="248" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;So unfairness is fine if it averages out?&quot;</text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="328" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;It&#x27;s the only fairness achievable in a</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">       /|\     ranked interface. Position 1 is scarce</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       / \     by construction. Amortization is the</text><text x="46" y="408" fill="#183029" class="mono" xml:space="preserve">              honest response to that scarcity.&quot;</text>
</svg>
