<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   CORRECTNESS IS A PHOTOGRAPH, NOT A FILM</text><text x="46" y="88" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#7B5960" class="mono" xml:space="preserve">   ┌────────────────────┐</text><text x="46" y="128" fill="#087A54" class="mono" xml:space="preserve">   │   Query #4,412     │      Correct? YES ✓</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve">   │   Answer: &quot;Bern&quot;   │</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">   │   Truth:  &quot;Bern&quot;   │</text><text x="46" y="188" fill="#7B5960" class="mono" xml:space="preserve">   └────────────────────┘</text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="228" fill="#D94C42" class="mono" xml:space="preserve">        o     &quot;We&#x27;re at 91% correct!&quot;</text><text x="46" y="248" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="288" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">        o     &quot;On what? Retrieved from where? Compared to when?</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       /|\      And how many tokens did that cost?&quot;</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
