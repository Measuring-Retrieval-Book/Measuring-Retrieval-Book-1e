<svg xmlns="http://www.w3.org/2000/svg" width="720" height="466" viewBox="0 0 720 466">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="466" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">The Phantom Depth</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   THE PHANTOM DEPTH</text><text x="46" y="88" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve">   Retriever config:  return top 50</text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   Reranker config:   rerank top 50 -&gt; top 10</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">   Prompt builder:    inject top 4  &lt;- nobody remembers this</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">   Dashboard:         P@10</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;P@10 = 0.70. We&#x27;re good.&quot;</text><text x="46" y="228" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="248" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Six of those ten never reach the model.&quot;</text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve">   The dashboard measures a stage of the pipeline that</text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve">   does not determine the output. Trace your actual</text><text x="46" y="408" fill="#2A2518" class="mono" xml:space="preserve">   injection count before choosing K.</text>
</svg>
