<svg xmlns="http://www.w3.org/2000/svg" width="720" height="486" viewBox="0 0 720 486">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="486" rx="10" fill="#FFF0ED"/>
<rect width="720" height="8" rx="4" fill="#E45E4F"/>
<text x="34" y="39" fill="#342127" class="title">Pooling, And What It Assumes</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   POOLING, AND WHAT IT ASSUMES</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ════════════════════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">   system A top-100 ─┐</text><text x="46" y="148" fill="#7B5960" class="mono" xml:space="preserve">   system B top-100 ─┼──▶ POOL ──▶ humans judge these</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">   system C top-100 ─┘              (say 4,000 docs)</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve">   Corpus: 10,000,000 documents</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">   Judged:      4,000 documents</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">   Assumed irrelevant: 9,996,000</text><text x="46" y="268" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;That&#x27;s a big assumption.&quot;</text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="348" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;It&#x27;s usually a fine one - most documents</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       /|\     really are irrelevant. The problem is the</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       / \     relevant ones that no pooled system found.</text><text x="46" y="428" fill="#342127" class="mono" xml:space="preserve">              They&#x27;re invisible, and they&#x27;re not random.&quot;</text>
</svg>
