<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">FORMULA</text>
<text x="46" y="68" fill="#162438" class="mono" xml:space="preserve">   F1 = 2PR / (P + R)</text><text x="46" y="88" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve">   Fβ = (1 + β²) · PR / (β²P + R)</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">   β &lt; 1  -&gt;  weights PRECISION more</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">   β = 1  -&gt;  balanced (F1)</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">   β &gt; 1  -&gt;  weights RECALL more</text>
