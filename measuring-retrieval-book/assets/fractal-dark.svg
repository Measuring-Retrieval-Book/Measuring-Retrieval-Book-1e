<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="55%" stop-color="#35c2ff"/>
      <stop offset="100%" stop-color="#8bd450"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="45%" stop-color="#2459a6"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #102033; }
      .label { font: 700 24px Inter, Arial, sans-serif; fill: #102033; }
      .small { font: 500 18px Inter, Arial, sans-serif; fill: #31445c; }
      .tiny { font: 500 15px Inter, Arial, sans-serif; fill: #42546a; }
      .card { fill: #ffffff; stroke: #d7e2ef; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .ink { fill: #102033; }
      .muted { fill: #53657c; }
      .line { stroke: #40566e; stroke-width: 5; stroke-linecap: round; fill: none; }
      .dash { stroke: #8aa0b8; stroke-width: 4; stroke-dasharray: 10 10; fill: none; }
    </style>
  </defs>
  
  <rect width="1200" height="720" fill="#0d1321"/>
  <text x="70" y="90" style="font:700 42px Inter,Arial,sans-serif;fill:#f4fbff">Backend Fractal: What The System Pays</text>
  <g transform="translate(600 390)" fill="none">
    <path d="M0 -250 C140 -210 210 -140 250 0 C210 140 140 210 0 250 C-140 210 -210 140 -250 0 C-210 -140 -140 -210 0 -250Z" stroke="#35c2ff" stroke-width="16" opacity="0.7"/>
    <path d="M0 -178 C100 -150 150 -100 178 0 C150 100 100 150 0 178 C-100 150 -150 100 -178 0 C-150 -100 -100 -150 0 -178Z" stroke="#8bd450" stroke-width="13" opacity="0.8"/>
    <path d="M0 -118 C66 -100 100 -66 118 0 C100 66 66 100 0 118 C-66 100 -100 66 -118 0 C-100 -66 -66 -100 0 -118Z" stroke="#ffce54" stroke-width="10" opacity="0.9"/>
    <path d="M0 -68 C38 -58 58 -38 68 0 C58 38 38 58 0 68 C-38 58 -58 38 -68 0 C-58 -38 -38 -58 0 -68Z" stroke="#ff7a59" stroke-width="8"/>
    <g stroke="#f4fbff" stroke-width="3" opacity="0.35">
      <path d="M0 0 L0 -250"/>
      <path d="M0 0 L250 0"/>
      <path d="M0 0 L0 250"/>
      <path d="M0 0 L-250 0"/>
    </g>
  </g>
  <text x="125" y="640" style="font:500 18px Inter,Arial,sans-serif;fill:#d5e9ff">Indexing, retrieval, generation, judging, and monitoring each create cost surfaces.</text>

</svg>
