<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="55%" stop-color="#35c2ff"/>
      <stop offset="100%" stop-color="#8bd450"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="45%" stop-color="#2459a6"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #102033; }
      .label { font: 700 24px Inter, Arial, sans-serif; fill: #102033; }
      .small { font: 500 18px Inter, Arial, sans-serif; fill: #31445c; }
      .tiny { font: 500 15px Inter, Arial, sans-serif; fill: #42546a; }
      .card { fill: #ffffff; stroke: #d7e2ef; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .ink { fill: #102033; }
      .muted { fill: #53657c; }
      .line { stroke: #40566e; stroke-width: 5; stroke-linecap: round; fill: none; }
      .dash { stroke: #8aa0b8; stroke-width: 4; stroke-dasharray: 10 10; fill: none; }
    </style>
  </defs>
  
  <rect width="1200" height="720" fill="#fbfcff"/>
  <text x="70" y="80" class="title">A RAG Metric Must Say Which Layer It Measures</text>
  <g transform="translate(90 165)">
    <rect class="card" x="0" y="0" width="220" height="150"/>
    <text x="40" y="60" class="label">Query</text>
    <text x="40" y="100" class="small">user need</text>
  </g>
  <path class="line" d="M320 240 H430"/>
  <g transform="translate(450 145)">
    <rect class="card" x="0" y="0" width="270" height="190"/>
    <text x="35" y="58" class="label">Retriever</text>
    <text x="35" y="100" class="small">ranked evidence</text>
    <rect x="35" y="125" width="200" height="18" fill="#35c2ff" rx="9"/>
    <rect x="35" y="153" width="150" height="18" fill="#a9dfff" rx="9"/>
  </g>
  <path class="line" d="M735 240 H845"/>
  <g transform="translate(865 145)">
    <rect class="card" x="0" y="0" width="250" height="190"/>
    <text x="35" y="58" class="label">Generator</text>
    <text x="35" y="100" class="small">answer and cites</text>
    <circle cx="78" cy="145" r="22" fill="#8bd450"/>
    <circle cx="126" cy="145" r="22" fill="#ffce54"/>
    <circle cx="174" cy="145" r="22" fill="#ff7a59"/>
  </g>
  <g transform="translate(235 430)">
    <rect x="0" y="0" width="730" height="120" rx="20" fill="#eef7ff" stroke="#b8d9f8" stroke-width="2"/>
    <text x="38" y="48" class="label">Layer labels prevent false comfort.</text>
    <text x="38" y="84" class="small">Retrieval quality, answer grounding, judge reliability, and cost are separate measurements.</text>
  </g>

</svg>
