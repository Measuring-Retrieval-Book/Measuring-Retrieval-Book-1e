<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="55%" stop-color="#35c2ff"/>
      <stop offset="100%" stop-color="#8bd450"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="45%" stop-color="#2459a6"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #102033; }
      .label { font: 700 24px Inter, Arial, sans-serif; fill: #102033; }
      .small { font: 500 18px Inter, Arial, sans-serif; fill: #31445c; }
      .tiny { font: 500 15px Inter, Arial, sans-serif; fill: #42546a; }
      .card { fill: #ffffff; stroke: #d7e2ef; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .ink { fill: #102033; }
      .muted { fill: #53657c; }
      .line { stroke: #40566e; stroke-width: 5; stroke-linecap: round; fill: none; }
      .dash { stroke: #8aa0b8; stroke-width: 4; stroke-dasharray: 10 10; fill: none; }
    </style>
  </defs>
  
  <rect width="1200" height="720" fill="#f6fbff"/>
  <text x="70" y="80" class="title">The Four Questions</text>
  <g transform="translate(70 135)">
    <rect class="card" x="0" y="0" width="245" height="420"/>
    <rect x="0" y="0" width="245" height="14" fill="#1f77b4"/>
    <text x="28" y="72" class="label">Correctness</text>
    <text x="28" y="118" class="small">Is the answer right?</text>
    <circle cx="122" cy="250" r="70" fill="#e7f3ff" stroke="#1f77b4" stroke-width="6"/>
    <path d="M92 250 l22 24 l45 -58" stroke="#1f77b4" stroke-width="13" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(345 135)">
    <rect class="card" x="0" y="0" width="245" height="420"/>
    <rect x="0" y="0" width="245" height="14" fill="#00a676"/>
    <text x="28" y="72" class="label">Alignment</text>
    <text x="28" y="118" class="small">Do the parts cooperate?</text>
    <circle cx="88" cy="255" r="44" fill="#e9fbf4" stroke="#00a676" stroke-width="6"/>
    <circle cx="158" cy="255" r="44" fill="#e9fbf4" stroke="#00a676" stroke-width="6"/>
    <path d="M115 255 H132" stroke="#00a676" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g transform="translate(620 135)">
    <rect class="card" x="0" y="0" width="245" height="420"/>
    <rect x="0" y="0" width="245" height="14" fill="#7b61ff"/>
    <text x="28" y="72" class="label">Integrity</text>
    <text x="28" y="118" class="small">Did the system drift?</text>
    <path d="M70 300 C105 180, 160 330, 195 205" stroke="#7b61ff" stroke-width="10" fill="none"/>
    <path d="M70 300 C105 180, 160 330, 195 205" stroke="#c6bdff" stroke-width="28" fill="none" opacity="0.35"/>
  </g>
  <g transform="translate(895 135)">
    <rect class="card" x="0" y="0" width="245" height="420"/>
    <rect x="0" y="0" width="245" height="14" fill="#ff9f1c"/>
    <text x="28" y="72" class="label">Efficiency</text>
    <text x="28" y="118" class="small">What did quality cost?</text>
    <rect x="64" y="205" width="116" height="116" rx="18" fill="#fff3db" stroke="#ff9f1c" stroke-width="7"/>
    <path d="M94 265 h56 M122 235 v60" stroke="#ff9f1c" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M195 585 H1015" stroke="url(#warm)" stroke-width="10" stroke-linecap="round"/>
  <text x="345" y="645" class="small">A dashboard needs one strong answer to each question.</text>

</svg>
