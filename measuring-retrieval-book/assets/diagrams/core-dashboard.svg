<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="55%" stop-color="#35c2ff"/>
      <stop offset="100%" stop-color="#8bd450"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="45%" stop-color="#2459a6"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #102033; }
      .label { font: 700 24px Inter, Arial, sans-serif; fill: #102033; }
      .small { font: 500 18px Inter, Arial, sans-serif; fill: #31445c; }
      .tiny { font: 500 15px Inter, Arial, sans-serif; fill: #42546a; }
      .card { fill: #ffffff; stroke: #d7e2ef; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .ink { fill: #102033; }
      .muted { fill: #53657c; }
      .line { stroke: #40566e; stroke-width: 5; stroke-linecap: round; fill: none; }
      .dash { stroke: #8aa0b8; stroke-width: 4; stroke-dasharray: 10 10; fill: none; }
    </style>
  </defs>
  
  <rect width="1200" height="720" fill="#f7fbf8"/>
  <text x="70" y="82" class="title">The Eight-Metric Starter Dashboard</text>
  <g transform="translate(70 140)">
    <rect class="card" x="0" y="0" width="1060" height="470"/>
    <g transform="translate(40 45)">
      <rect x="0" y="0" width="225" height="170" rx="16" fill="#e7f3ff"/>
      <text x="24" y="42" class="label">Correctness</text>
      <text x="24" y="82" class="small">Claim Recall</text>
      <text x="24" y="112" class="small">Self-Knowledge</text>
      <text x="24" y="142" class="small">Hallucination</text>
    </g>
    <g transform="translate(295 45)">
      <rect x="0" y="0" width="225" height="170" rx="16" fill="#edfbe9"/>
      <text x="24" y="42" class="label">Retrieval</text>
      <text x="24" y="82" class="small">nDCG@injected-k</text>
    </g>
    <g transform="translate(550 45)">
      <rect x="0" y="0" width="225" height="170" rx="16" fill="#fff4df"/>
      <text x="24" y="42" class="label">Alignment</text>
      <text x="24" y="82" class="small">One contribution</text>
      <text x="24" y="112" class="small">metric</text>
    </g>
    <g transform="translate(805 45)">
      <rect x="0" y="0" width="225" height="170" rx="16" fill="#f1edff"/>
      <text x="24" y="42" class="label">Integrity</text>
      <text x="24" y="82" class="small">RBO against baseline</text>
    </g>
    <g transform="translate(205 255)">
      <rect x="0" y="0" width="280" height="145" rx="16" fill="#fff0f0"/>
      <text x="24" y="42" class="label">Efficiency</text>
      <text x="24" y="82" class="small">Pairwise Redundancy</text>
      <text x="24" y="112" class="small">TTFT p50 / p95</text>
    </g>
    <g transform="translate(545 255)">
      <rect x="0" y="0" width="310" height="145" rx="16" fill="#eaf8fb"/>
      <text x="24" y="42" class="label">Context Lines</text>
      <text x="24" y="82" class="small">Claim count</text>
      <text x="24" y="112" class="small">retrieval contribution</text>
    </g>
  </g>

</svg>
