<text x="34" y="39" fill="#2A2518" class="title">Two Discounts, Multiplied</text>
<text x="705" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   TWO DISCOUNTS, MULTIPLIED</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ═════════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   POSITIONAL (from nDCG)      NOVELTY (new in α-nDCG)</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">   1/log2(k+1)                 (1-α)^{times seen before}</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">   rank  subtopic  seen?  positional  novelty   gain</text><text x="46" y="208" fill="#736747" class="mono" xml:space="preserve">   ────  ────────  ─────  ──────────  ───────   ────</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">    1      A       0×       1.000      1.000    1.000</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">    2      A       1×       0.631      0.500    0.316   &lt;- halved</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">    3      A       2×       0.500      0.250    0.125   &lt;- quartered</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve">    4      B       0×       0.431      1.000    0.431   &lt;- FRESH,</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">                                                          beats rank 3</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">                                             (α = 0.5)</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Rank 4 scores higher than rank 3?&quot;</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="428" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Yes. It said something new. That inversion</text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">       /|\     IS the metric - it&#x27;s what makes diversity</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       / \     worth optimizing.&quot;</text>
</svg>
