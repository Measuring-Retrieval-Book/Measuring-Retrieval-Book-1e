<text x="34" y="39" fill="#342127" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#7B5960" class="mono" xml:space="preserve">   ┌──────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#342127" class="mono" xml:space="preserve">   │  THE k-SWEEP                                     │</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">   │  For k ∈ {1, 3, 5, 10, 20, 50}, record:          │</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">   │    ▸ Recall@k                                    │</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve">   │    ▸ your primary quality metric                 │</text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve">   │    ▸ Pairwise Redundancy                         │</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">   │    ▸ prompt tokens per query                     │</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">   │    ▸ TTFT p50 / p95                              │</text><text x="46" y="268" fill="#342127" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="288" fill="#342127" class="mono" xml:space="preserve">   │  Plot quality against tokens. Find the knee.     │</text><text x="46" y="308" fill="#342127" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="328" fill="#342127" class="mono" xml:space="preserve">   │  Cost: one afternoon. Almost nobody does it.     │</text><text x="46" y="348" fill="#342127" class="mono" xml:space="preserve">   │  It is the single highest-value experiment in    │</text><text x="46" y="368" fill="#342127" class="mono" xml:space="preserve">   │  this volume.                                    │</text><text x="46" y="388" fill="#7B5960" class="mono" xml:space="preserve">   └──────────────────────────────────────────────────┘</text>
</svg>
