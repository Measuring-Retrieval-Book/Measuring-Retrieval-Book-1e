<svg xmlns="http://www.w3.org/2000/svg" width="720" height="686" viewBox="0 0 720 686">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="686" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">The Decomposition Pipeline</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#168C63" class="mono" xml:space="preserve">   THE DECOMPOSITION PIPELINE</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ══════════════════════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#527368" class="mono" xml:space="preserve">   1. EXTRACT      answer ──▶ list of atomic claims</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">                   (an LLM rewrites the answer into</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">                    standalone, fully-understandable statements)</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#527368" class="mono" xml:space="preserve">   2. VERIFY       each claim ──▶ entailed by X? (NLI or LLM judge)</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve">                   where X ∈ {context, ground truth, each chunk}</text><text x="46" y="248" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#527368" class="mono" xml:space="preserve">   3. AGGREGATE    count ──▶ ratio</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#527368" class="mono" xml:space="preserve">        ┌─────────────────────────────────────┐</text><text x="46" y="348" fill="#183029" class="mono" xml:space="preserve">        │ &quot;Bern has been the capital since    │</text><text x="46" y="368" fill="#183029" class="mono" xml:space="preserve">        │  1848 and has 133,000 residents.&quot;   │</text><text x="46" y="388" fill="#527368" class="mono" xml:space="preserve">        └─────────────────────────────────────┘</text><text x="46" y="408" fill="#183029" class="mono" xml:space="preserve">                        │ EXTRACT</text><text x="46" y="428" fill="#527368" class="mono" xml:space="preserve">                        ▼</text><text x="46" y="448" fill="#527368" class="mono" xml:space="preserve">        ┌─────────────────────────────────────┐</text><text x="46" y="468" fill="#183029" class="mono" xml:space="preserve">        │ c1: Bern is the capital             │</text><text x="46" y="488" fill="#183029" class="mono" xml:space="preserve">        │ c2: Bern became capital in 1848     │</text><text x="46" y="508" fill="#183029" class="mono" xml:space="preserve">        │ c3: Bern has 133,000 residents      │</text><text x="46" y="528" fill="#527368" class="mono" xml:space="preserve">        └─────────────────────────────────────┘</text><text x="46" y="548" fill="#183029" class="mono" xml:space="preserve">                        │ VERIFY against context</text><text x="46" y="568" fill="#527368" class="mono" xml:space="preserve">                        ▼</text><text x="46" y="588" fill="#C43C32" class="mono" xml:space="preserve">                 c1 ✓   c2 ✓   c3 ✗</text><text x="46" y="608" fill="#183029" class="mono" xml:space="preserve">                        │</text><text x="46" y="628" fill="#183029" class="mono" xml:space="preserve">                 faithfulness = 2/3 = 0.67</text>
</svg>
