<text x="46" y="68" fill="#EDF5F7" class="mono" xml:space="preserve">   WHERE DOES THE METRIC LOOK?</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ═══════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#5264C8" class="mono" xml:space="preserve">        ┌──────────┐          ┌──────────┐</text><text x="46" y="148" fill="#5264C8" class="mono" xml:space="preserve">   Q ──▶│ RETRIEVER│───ctx───▶│ GENERATOR│──▶ A</text><text x="46" y="168" fill="#5264C8" class="mono" xml:space="preserve">        └──────────┘          └──────────┘</text><text x="46" y="188" fill="#5264C8" class="mono" xml:space="preserve">             ▲                     ▲</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">             │                     │</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">            [R]                   [G]</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">        retriever-only        generator-only</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">        nDCG, MRR, recall     faithfulness, Trust-Score</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#5264C8" class="mono" xml:space="preserve">        └──────────[E2E]────────────┘</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve">              end-to-end</text><text x="46" y="348" fill="#EDF5F7" class="mono" xml:space="preserve">        accuracy, CUE, eRAG, WARG</text>
