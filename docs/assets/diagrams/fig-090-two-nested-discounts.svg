<svg xmlns="http://www.w3.org/2000/svg" width="720" height="546" viewBox="0 0 720 546">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="546" rx="10" fill="#202541"/>
<rect width="720" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">Two Nested Discounts</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   TWO NESTED DISCOUNTS</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#E86850" class="mono" xml:space="preserve">   SESSION</text><text x="46" y="148" fill="#5264C8" class="mono" xml:space="preserve">   ├── query 1  (full weight)</text><text x="46" y="168" fill="#5264C8" class="mono" xml:space="preserve">   │     ├── rank 1  1/log2(2)</text><text x="46" y="188" fill="#5264C8" class="mono" xml:space="preserve">   │     ├── rank 2  1/log2(3)</text><text x="46" y="208" fill="#5264C8" class="mono" xml:space="preserve">   │     └── rank 3  1/log2(4)</text><text x="46" y="228" fill="#5264C8" class="mono" xml:space="preserve">   ├── query 2  (discounted - user had to reformulate)</text><text x="46" y="248" fill="#5264C8" class="mono" xml:space="preserve">   │     ├── rank 1  ...</text><text x="46" y="268" fill="#5264C8" class="mono" xml:space="preserve">   │     └── ...</text><text x="46" y="288" fill="#5264C8" class="mono" xml:space="preserve">   └── query 3  (discounted further)</text><text x="46" y="308" fill="#5264C8" class="mono" xml:space="preserve">         └── ...</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Why penalize later queries? The user</text><text x="46" y="368" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     found what they wanted.&quot;</text><text x="46" y="388" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="428" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;They found it after three attempts.</text><text x="46" y="448" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     A system that answered on attempt one</text><text x="46" y="468" fill="#FF9D8A" class="mono" xml:space="preserve">       / \     is better, and single-query metrics</text><text x="46" y="488" fill="#EDF5F7" class="mono" xml:space="preserve">              score them identically.&quot;</text>
</svg>
