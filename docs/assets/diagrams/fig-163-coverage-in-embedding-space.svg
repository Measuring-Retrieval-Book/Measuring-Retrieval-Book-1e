              └─────────────────┘  │</text><text x="46" y="428" fill="#7B5960" class="mono" xml:space="preserve">   └─────────────────────────────────────────┘</text><text x="46" y="448" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Our eval passes at 91%.&quot;</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="528" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="548" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;On the region your questions reach.</text><text x="46" y="568" fill="#D94C42" class="mono" xml:space="preserve">       /|\     That cluster on the right has never</text><text x="46" y="588" fill="#D94C42" class="mono" xml:space="preserve">       / \     been tested. It could be anything.&quot;</text>
