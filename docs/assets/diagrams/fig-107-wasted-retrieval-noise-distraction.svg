<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   WASTED RETRIEVAL              NOISE DISTRACTION</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ════════════════              ═════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   Retriever: &quot;#1 is best&quot;       Retriever: &quot;#4 is weak&quot;</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">   Generator: ignores #1          Generator: builds answer on #4</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#736747" class="mono" xml:space="preserve">   ┌────────┐                    ┌────────┐</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">   │#1 ★★★★★│ &lt;- never used       │#1 ★★★★★│</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">   │#2 ★★★★ │ &lt;- used             │#2 ★★★★ │</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">   │#3 ★★★  │                    │#3 ★★★  │</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">   │#4 ★    │                    │#4 ★     │ &lt;- primary source</text><text x="46" y="288" fill="#736747" class="mono" xml:space="preserve">   └────────┘                    └────────┘</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">   You paid to retrieve gold      Your answer rests on</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve">   and threw it away.             the weakest evidence.</text>
