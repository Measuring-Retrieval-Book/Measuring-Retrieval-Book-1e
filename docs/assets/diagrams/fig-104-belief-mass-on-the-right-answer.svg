<svg xmlns="http://www.w3.org/2000/svg" width="720" height="606" viewBox="0 0 720 606">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="606" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">Belief Mass On The Right Answer</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#168C63" class="mono" xml:space="preserve">   BELIEF MASS ON THE RIGHT ANSWER</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ═══════════════════════════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   BEFORE RETRIEVAL - sample 20 answers, cluster by meaning:</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="168" fill="#527368" class="mono" xml:space="preserve">     ┌────────────┬────────────┬────────────┐</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve">     │  &quot;Bern&quot;    │  &quot;Zurich&quot;  │ &quot;Geneva&quot;   │</text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">     │   ████     │  ████████  │   ██████   │</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve">     │   0.20     │    0.45    │    0.35    │</text><text x="46" y="248" fill="#527368" class="mono" xml:space="preserve">     └────────────┴────────────┴────────────┘</text><text x="46" y="268" fill="#527368" class="mono" xml:space="preserve">          ▲ correct cluster        P_M(a*) = 0.20</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#168C63" class="mono" xml:space="preserve">   AFTER RETRIEVAL:</text><text x="46" y="328" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#527368" class="mono" xml:space="preserve">     ┌────────────┬────────────┬────────────┐</text><text x="46" y="368" fill="#183029" class="mono" xml:space="preserve">     │  &quot;Bern&quot;    │  &quot;Zurich&quot;  │ &quot;Geneva&quot;   │</text><text x="46" y="388" fill="#183029" class="mono" xml:space="preserve">     │ ██████████ │     █      │     █      │</text><text x="46" y="408" fill="#183029" class="mono" xml:space="preserve">     │   0.88     │    0.07    │    0.05    │</text><text x="46" y="428" fill="#527368" class="mono" xml:space="preserve">     └────────────┴────────────┴────────────┘</text><text x="46" y="448" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="468" fill="#183029" class="mono" xml:space="preserve">              ΔSePer = 0.88 - 0.20 = 0.68</text><text x="46" y="488" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="508" fill="#183029" class="mono" xml:space="preserve">   NOTE: this is NOT token perplexity. Answers that</text><text x="46" y="528" fill="#183029" class="mono" xml:space="preserve">   MEAN the same thing are pooled, so &quot;Bern&quot; and</text><text x="46" y="548" fill="#183029" class="mono" xml:space="preserve">   &quot;the city of Bern&quot; land in one cluster.</text>
</svg>
