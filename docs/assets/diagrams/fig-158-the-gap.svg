<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   THE GAP</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ═══════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">   purpose-built  ██████████████████  0.91</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve">   cross-encoder  █████████████████   0.89</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">   GPT-4o judge   ██████████████      0.73</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve">   DeBERTa pool   █████████████       0.65</text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="228" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;GPT-4o is state of the art.&quot;</text><text x="46" y="248" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="288" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;At generating. As a VERIFIER on a</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       /|\     specific task, a purpose-built model</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       / \     beat it by 18 points. General</text><text x="46" y="368" fill="#342127" class="mono" xml:space="preserve">              capability is not measurement</text><text x="46" y="388" fill="#342127" class="mono" xml:space="preserve">              capability.&quot;</text>
