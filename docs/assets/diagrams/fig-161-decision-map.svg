<svg xmlns="http://www.w3.org/2000/svg" width="720" height="546" viewBox="0 0 720 546">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="546" rx="10" fill="#E8F7FA"/>
<rect width="720" height="8" rx="4" fill="#00A6C7"/>
<text x="34" y="39" fill="#162438" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#557184" class="mono" xml:space="preserve">   ┌──────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#162438" class="mono" xml:space="preserve">   │  JUDGE DRIFT PROTOCOL                                │</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve">   │                                                      │</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">   │  1. PIN the dated snapshot. Not &quot;gpt-4o&quot; -            │</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">   │     the version string.                              │</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">   │                                                      │</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">   │  2. FREEZE an anchor set: 100-200 items with          │</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve">   │     human labels. Never regenerate it.                │</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">   │                                                      │</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">   │  3. ON EVERY JUDGE CHANGE, re-run the anchor set     │</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve">   │     and record Krippendorff&#x27;s α.                      │</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve">   │                                                      │</text><text x="46" y="308" fill="#162438" class="mono" xml:space="preserve">   │  4. IF α MOVES MATERIALLY: your historical series    │</text><text x="46" y="328" fill="#162438" class="mono" xml:space="preserve">   │     is broken. Draw a vertical line on the chart      │</text><text x="46" y="348" fill="#162438" class="mono" xml:space="preserve">   │     and say so. Do not let the line continue.         │</text><text x="46" y="368" fill="#162438" class="mono" xml:space="preserve">   │                                                      │</text><text x="46" y="388" fill="#162438" class="mono" xml:space="preserve">   │  5. NEVER let one model generate synthetic test      │</text><text x="46" y="408" fill="#162438" class="mono" xml:space="preserve">   │     data AND judge results.                           │</text><text x="46" y="428" fill="#162438" class="mono" xml:space="preserve">   │                                                      │</text><text x="46" y="448" fill="#162438" class="mono" xml:space="preserve">   │  6. RECORD the judge version in every experiment     │</text><text x="46" y="468" fill="#162438" class="mono" xml:space="preserve">   │     record, beside the embedder version.              │</text><text x="46" y="488" fill="#557184" class="mono" xml:space="preserve">   └──────────────────────────────────────────────────────┘</text>
</svg>
