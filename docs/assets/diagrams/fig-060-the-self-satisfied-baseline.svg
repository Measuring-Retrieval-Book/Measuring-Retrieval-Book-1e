<svg xmlns="http://www.w3.org/2000/svg" width="720" height="526" viewBox="0 0 720 526">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="526" rx="10" fill="#202541"/>
<rect width="720" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">The Self-Satisfied Baseline</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   THE SELF-SATISFIED BASELINE</text><text x="46" y="88" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve">   Jan:  RBO and baseline = 1.00</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   Mar:  RBO and baseline = 1.00</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">   Jun:  RBO and baseline = 1.00</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Rock solid. No drift at all.&quot;</text><text x="46" y="208" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="228" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Is the corpus still being updated?&quot;</text><text x="46" y="288" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="308" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;...the ingestion job failed in February.&quot;</text><text x="46" y="368" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="388" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="428" fill="#EDF5F7" class="mono" xml:space="preserve">   Perfect stability can mean &#x27;healthy&#x27; or it can mean</text><text x="46" y="448" fill="#EDF5F7" class="mono" xml:space="preserve">   &#x27;nothing is happening&#x27;. RBO cannot distinguish them.</text><text x="46" y="468" fill="#EDF5F7" class="mono" xml:space="preserve">   Pair it with a corpus-freshness check.</text>
</svg>
