<svg xmlns="http://www.w3.org/2000/svg" width="720" height="906" viewBox="0 0 720 906">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="906" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">RANK DISCOUNT and TIME DISCOUNT</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#183029" class="mono" xml:space="preserve">   RANK DISCOUNT and TIME DISCOUNT</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ══════════════════════════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   TWO RESULT LISTS, IDENTICAL nDCG:</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="168" fill="#168C63" class="mono" xml:space="preserve">   LIST A                        LIST B</text><text x="46" y="188" fill="#527368" class="mono" xml:space="preserve">   ┌───────────────────────┐     ┌───────────────────────┐</text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">   │ 1. rel - good snippet │     │ 1. rel - bad snippet, │</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve">   │    (3 sec to judge)   │     │    40-page PDF        │</text><text x="46" y="248" fill="#183029" class="mono" xml:space="preserve">   │                       │     │    (90 sec to judge)  │</text><text x="46" y="268" fill="#183029" class="mono" xml:space="preserve">   │ 2. rel - good snippet │     │ 2. rel - bad snippet  │</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve">   │    (3 sec)            │     │    (90 sec)           │</text><text x="46" y="308" fill="#527368" class="mono" xml:space="preserve">   └───────────────────────┘     └───────────────────────┘</text><text x="46" y="328" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#183029" class="mono" xml:space="preserve">   nDCG:  identical</text><text x="46" y="368" fill="#183029" class="mono" xml:space="preserve">   TBG:   List A vastly better</text><text x="46" y="388" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;The same documents were retrieved.&quot;</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="468" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;The user gave up during item 1 of List B.</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       /|\     Retrieval was identical; the EXPERIENCE</text><text x="46" y="528" fill="#D94C42" class="mono" xml:space="preserve">       / \     wasn&#x27;t. Time-biased gain is the only</text><text x="46" y="548" fill="#183029" class="mono" xml:space="preserve">              measure here that notices.&quot;</text><text x="46" y="568" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="588" fill="#527368" class="mono" xml:space="preserve">   ┌─────────────────────────────────────────────────┐</text><text x="46" y="608" fill="#183029" class="mono" xml:space="preserve">   │  D(t): probability the user is still reading    │</text><text x="46" y="628" fill="#183029" class="mono" xml:space="preserve">   │                                                 │</text><text x="46" y="648" fill="#D94C42" class="mono" xml:space="preserve">   │  1.0 ┤●                                         │</text><text x="46" y="668" fill="#D94C42" class="mono" xml:space="preserve">   │      │ ●●                                       │</text><text x="46" y="688" fill="#D94C42" class="mono" xml:space="preserve">   │  0.5 ┤    ●●●                                   │</text><text x="46" y="708" fill="#D94C42" class="mono" xml:space="preserve">   │      │        ●●●●                              │</text><text x="46" y="728" fill="#D94C42" class="mono" xml:space="preserve">   │  0.0 ┤             ●●●●●●●●●                    │</text><text x="46" y="748" fill="#527368" class="mono" xml:space="preserve">   │      └────────────────────────── t (seconds)    │</text><text x="46" y="768" fill="#183029" class="mono" xml:space="preserve">   │        0    30   60   90   120                  │</text><text x="46" y="788" fill="#183029" class="mono" xml:space="preserve">   │                                                 │</text><text x="46" y="808" fill="#183029" class="mono" xml:space="preserve">   │  Gain arriving after the user leaves is worth   │</text><text x="46" y="828" fill="#183029" class="mono" xml:space="preserve">   │  nothing. Rank cannot represent this.           │</text><text x="46" y="848" fill="#527368" class="mono" xml:space="preserve">   └─────────────────────────────────────────────────┘</text>
</svg>
