<svg xmlns="http://www.w3.org/2000/svg" width="720" height="266" viewBox="0 0 720 266">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="266" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">bpref = (1/R) · Σ_{r} ( 1 - |n ranked higher than r| / R </text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">FORMULA</text>
<text x="46" y="68" fill="#183029" class="mono" xml:space="preserve">   bpref = (1/R) · Σ_{r}  ( 1 - |n ranked higher than r| / R )</text><text x="46" y="88" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve">     where  r = a judged-relevant document</text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">            n = judged-IRRELEVANT documents ranked above r</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">                (counted only up to the first R of them)</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">            R = number of judged relevant documents</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">   Unjudged documents are SKIPPED, not counted as irrelevant.</text>
</svg>
