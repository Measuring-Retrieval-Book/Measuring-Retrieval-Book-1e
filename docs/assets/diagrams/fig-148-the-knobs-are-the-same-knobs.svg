<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   THE KNOBS ARE THE SAME KNOBS</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ════════════════════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#7B5960" class="mono" xml:space="preserve">              k ▲                    k ▼</text><text x="46" y="148" fill="#7B5960" class="mono" xml:space="preserve">    ┌─────────────────────┬─────────────────────┐</text><text x="46" y="168" fill="#7B5960" class="mono" xml:space="preserve">    │ recall        ▲     │ recall        ▼     │</text><text x="46" y="188" fill="#7B5960" class="mono" xml:space="preserve">    │ faithfulness  ▲     │ faithfulness  ▼     │</text><text x="46" y="208" fill="#7B5960" class="mono" xml:space="preserve">    │ context util  ▼     │ context util  ▲     │</text><text x="46" y="228" fill="#7B5960" class="mono" xml:space="preserve">    │ noise sens.   ▲     │ noise sens.   ▼     │</text><text x="46" y="248" fill="#7B5960" class="mono" xml:space="preserve">    │ TOKENS        ▲▲▲   │ TOKENS        ▼▼▼   │</text><text x="46" y="268" fill="#7B5960" class="mono" xml:space="preserve">    │ LATENCY       ▲▲    │ LATENCY       ▼▼    │</text><text x="46" y="288" fill="#7B5960" class="mono" xml:space="preserve">    └─────────────────────┴─────────────────────┘</text><text x="46" y="308" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Quality and cost are separate concerns.&quot;</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="388" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;They&#x27;re the same dial. You cannot tune</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       /|\     one without moving the other.&quot;</text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
