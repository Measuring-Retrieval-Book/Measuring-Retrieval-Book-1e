<text x="34" y="39" fill="#FFFFFF" class="title">The Stale Weights</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   THE STALE WEIGHTS</text><text x="46" y="88" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve">   Jan:  fit UDCG weights on Llama-3.1-8B, k=5</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   Mar:  swap to Llama-4, keep the dashboard</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">   Jun:  &quot;UDCG has been flat for two quarters&quot;</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Stable retrieval quality!&quot;</text><text x="46" y="208" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="228" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;You&#x27;re scoring a new generator with</text><text x="46" y="288" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     the old one&#x27;s attention profile.</text><text x="46" y="308" fill="#FF9D8A" class="mono" xml:space="preserve">       / \     The number is measuring a model</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve">              you no longer run.&quot;</text>
</svg>
