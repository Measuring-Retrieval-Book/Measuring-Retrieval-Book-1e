<svg xmlns="http://www.w3.org/2000/svg" width="720" height="426" viewBox="0 0 720 426">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="426" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">The Mrr Ceiling</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#168C63" class="mono" xml:space="preserve">   THE MRR CEILING</text><text x="46" y="88" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve">   System A: finds gold chunk at rank 1. Misses the</text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">             other 6 relevant chunks entirely.</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">   System B: finds gold chunk at rank 1. Also finds</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">             all 6 others in the top 10.</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">   MRR:  A = 1.00     B = 1.00</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Identical performance.&quot;</text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="308" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;For a single-answer task, genuinely yes.</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       /|\     For anything else, you just declared a</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">       / \     6× recall difference invisible.&quot;</text>
</svg>
