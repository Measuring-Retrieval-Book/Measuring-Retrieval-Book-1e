<svg xmlns="http://www.w3.org/2000/svg" width="795" height="646" viewBox="0 0 795 646">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="795" height="646" rx="10" fill="#EAF7F1"/>
<rect width="795" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">Retrieved?</text>
<text x="761" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#183029" class="mono" xml:space="preserve">                    RETRIEVED?</text><text x="46" y="88" fill="#168C63" class="mono" xml:space="preserve">                 YES        NO</text><text x="46" y="108" fill="#527368" class="mono" xml:space="preserve">              ┌─────────┬─────────┐</text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">        YES   │   TP    │   FN    │  &lt;- relevant docs</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">   RELEVANT?  │  (win)  │ (missed)│</text><text x="46" y="168" fill="#527368" class="mono" xml:space="preserve">              ├─────────┼─────────┤</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve">        NO    │   FP    │   TN    │  &lt;- irrelevant docs</text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">              │ (noise) │ (fine)  │</text><text x="46" y="228" fill="#527368" class="mono" xml:space="preserve">              └─────────┴─────────┘</text><text x="46" y="248" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#183029" class="mono" xml:space="preserve">   PRECISION = TP / (TP + FP)     &quot;of what I returned, how much was good?&quot;</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve">   RECALL    = TP / (TP + FN)     &quot;of what was good, how much did I return?&quot;</text><text x="46" y="308" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#168C63" class="mono" xml:space="preserve">   THE ASYMMETRY NOBODY MENTIONS:</text><text x="46" y="368" fill="#183029" class="mono" xml:space="preserve">   TN is enormous and useless. In a 10M-document corpus with</text><text x="46" y="388" fill="#183029" class="mono" xml:space="preserve">   20 relevant documents, TN ≈ 9,999,980. Any metric that uses</text><text x="46" y="408" fill="#183029" class="mono" xml:space="preserve">   TN (like plain accuracy) will read 0.999998 for a system</text><text x="46" y="428" fill="#183029" class="mono" xml:space="preserve">   that returns nothing at all.</text><text x="46" y="448" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Our retrieval accuracy is 99.9998%!&quot;</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="528" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="548" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Your system returns the empty set.&quot;</text><text x="46" y="568" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="588" fill="#D94C42" class="mono" xml:space="preserve">       / \   &quot;...yes.&quot;</text>
</svg>
