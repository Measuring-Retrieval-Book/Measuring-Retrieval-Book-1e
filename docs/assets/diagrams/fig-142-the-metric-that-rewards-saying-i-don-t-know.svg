  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="546" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">The Metric That Rewards Saying &quot;I Don&#x27;T Know&quot;</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   THE METRIC THAT REWARDS SAYING &quot;I DON&#x27;T KNOW&quot;</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ═════════════════════════════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   Almost every metric in this supplement pair</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">   scores what the model SAID.</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">   Trust-Score scores whether it should have</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">   said anything at all.</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#736747" class="mono" xml:space="preserve">   ┌──────────────────────────────────────┐</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">   │ context insufficient                 │</text><text x="46" y="288" fill="#736747" class="mono" xml:space="preserve">   │ model answers anyway   ──▶ penalized │</text><text x="46" y="308" fill="#736747" class="mono" xml:space="preserve">   │ model refuses          ──▶ REWARDED  │</text><text x="46" y="328" fill="#736747" class="mono" xml:space="preserve">   └──────────────────────────────────────┘</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Refusal rate is a product metric,</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       /|\     not a quality metric.&quot;</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="428" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;In RAG it&#x27;s both. An answer with no</text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">       /|\     evidence behind it is a defect that</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       / \     happens to be well-formed.&quot;</text>
</svg>
