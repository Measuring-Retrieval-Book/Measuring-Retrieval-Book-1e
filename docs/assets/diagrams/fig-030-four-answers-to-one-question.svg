<text x="34" y="39" fill="#FFFFFF" class="title">Four Answers To One Question</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   FOUR ANSWERS TO ONE QUESTION</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ════════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   weight</text><text x="46" y="148" fill="#FF9D8A" class="mono" xml:space="preserve">     1.0 ┤●</text><text x="46" y="168" fill="#FF9D8A" class="mono" xml:space="preserve">         │ ●                MRR:  only the FIRST hit counts</text><text x="46" y="188" fill="#FF9D8A" class="mono" xml:space="preserve">     0.5 ┤  ●</text><text x="46" y="208" fill="#FF9D8A" class="mono" xml:space="preserve">         │   ●●             MAP:  average precision at each hit</text><text x="46" y="228" fill="#FF9D8A" class="mono" xml:space="preserve">         │     ●●●</text><text x="46" y="248" fill="#FF9D8A" class="mono" xml:space="preserve">     0.0 ┤        ●●●●●●    nDCG: 1/log2(i+1)  - gentle</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">         └─┬─┬─┬─┬─┬─┬─┬─   ERR:  stops when satisfied</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">           1 2 3 4 5 6 7    RBP:  p^(i-1) - geometric</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve">              rank</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Which discount is correct?&quot;</text><text x="46" y="368" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="388" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="428" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;None. Each encodes a different THEORY</text><text x="46" y="448" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     of how a user reads a result list.</text><text x="46" y="468" fill="#FF9D8A" class="mono" xml:space="preserve">       / \     Pick the theory that matches your user.&quot;</text>
</svg>
