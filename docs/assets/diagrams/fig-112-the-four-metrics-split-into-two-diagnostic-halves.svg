<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   THE FOUR METRICS SPLIT INTO TWO DIAGNOSTIC HALVES</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ═════════════════════════════════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#736747" class="mono" xml:space="preserve">   ┌──────────────────────┐    ┌──────────────────────┐</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">   │  RETRIEVER-SENSITIVE │    │   LLM-INTRINSIC      │</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">   │                      │    │                      │</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">   │  Noise Vulnerability │    │ Context Insensitivity│</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">   │  Context Acceptability│   │ Context Misinterp.   │</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">   │                      │    │                      │</text><text x="46" y="248" fill="#736747" class="mono" xml:space="preserve">   │  ▲ change retriever  │    │  ▲ change MODEL      │</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">   │    to move these     │    │    to move these     │</text><text x="46" y="288" fill="#736747" class="mono" xml:space="preserve">   └──────────────────────┘    └──────────────────────┘</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Context Insensitivity went up. New retriever?&quot;</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;That half doesn&#x27;t move with the retriever.</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       /|\     Something changed about your generator.&quot;</text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
