<text x="46" y="68" fill="#00A6C7" class="mono" xml:space="preserve">   POST-RATIONALIZATION</text><text x="46" y="88" fill="#557184" class="mono" xml:space="preserve">   ════════════════════</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#00A6C7" class="mono" xml:space="preserve">   WHAT YOU THINK HAPPENED        WHAT ACTUALLY HAPPENED</text><text x="46" y="148" fill="#557184" class="mono" xml:space="preserve">   ───────────────────────        ──────────────────────</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">   read doc [2]                   answer from memory</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">        ↓                              ↓</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve">   form answer                    search retrieved docs for</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">        ↓                         one that agrees</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">   cite [2]                            ↓</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve">                                  cite it</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#087A54" class="mono" xml:space="preserve">   Citation correctness: ✓ PASSES both times.</text><text x="46" y="328" fill="#162438" class="mono" xml:space="preserve">   The document really does support the claim.</text><text x="46" y="348" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Our citation accuracy is 94%.&quot;</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="428" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Up to 57% of citations in the systems</text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">       /|\     studied were unfaithful. Correctness</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       / \     cannot see this.&quot;</text>
