<svg xmlns="http://www.w3.org/2000/svg" width="720" height="486" viewBox="0 0 720 486">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="486" rx="10" fill="#202541"/>
<rect width="720" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#5264C8" class="mono" xml:space="preserve">   ┌────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#EDF5F7" class="mono" xml:space="preserve">   │  METRIC CONFOUNDING AUDIT                      │</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve">   │                                                │</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   │  Before reporting that metric M improved:      │</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">   │                                                │</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">   │  1. Can M be decomposed into a RATE term and   │</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">   │     a QUALITY term?                            │</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">   │                                                │</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">   │  2. If yes - decompose the variance.           │</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">   │                                                │</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">   │  3. If most movement is in the rate term,      │</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">   │     you have measured a behaviour change,      │</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve">   │     not a quality change.                      │</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve">   │                                                │</text><text x="46" y="348" fill="#EDF5F7" class="mono" xml:space="preserve">   │  Candidates in this supplement:                │</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve">   │    Self-Knowledge (rate of use × correctness)  │</text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve">   │    Faithfulness   (claim count × support rate) │</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve">   │    Hallucination  (verbosity × error rate)     │</text><text x="46" y="428" fill="#5264C8" class="mono" xml:space="preserve">   └────────────────────────────────────────────────┘</text>
</svg>
