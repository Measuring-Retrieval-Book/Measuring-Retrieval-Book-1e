<text x="34" y="39" fill="#162438" class="title">Relevant chunks at positions: 1, 3, 5, 8, 10</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">FORMULA</text>
<text x="46" y="68" fill="#162438" class="mono" xml:space="preserve">   Relevant chunks at positions: 1, 3, 5, 8, 10</text><text x="46" y="88" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve">   P@3  = 2/3  = 0.67   &lt;- what the GENERATOR sees</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">   P@5  = 3/5  = 0.60</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">   P@10 = 5/10 = 0.50   &lt;- what the RETRIEVER produced</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">   The number that determines answer quality is P@3.</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve">   The number most teams report is P@10.</text>
</svg>
