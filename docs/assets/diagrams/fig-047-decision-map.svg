<svg xmlns="http://www.w3.org/2000/svg" width="720" height="606" viewBox="0 0 720 606">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="606" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#736747" class="mono" xml:space="preserve">┌─────────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#2A2518" class="mono" xml:space="preserve">│  METRIC   USER MODEL                        USE WHEN            │</text><text x="46" y="108" fill="#736747" class="mono" xml:space="preserve">├─────────────────────────────────────────────────────────────────┤</text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">│  MRR      stops at first hit, never         one right answer    │</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">│           returns                           exists             │</text><text x="46" y="168" fill="#736747" class="mono" xml:space="preserve">├─────────────────────────────────────────────────────────────────┤</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">│  MAP      equally interested in every       judgments are       │</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">│           relevant doc                      complete           │</text><text x="46" y="228" fill="#736747" class="mono" xml:space="preserve">├─────────────────────────────────────────────────────────────────┤</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">│  nDCG     attention declines logarith-      default for human   │</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">│           mically; relevance is graded      search              │</text><text x="46" y="288" fill="#736747" class="mono" xml:space="preserve">├─────────────────────────────────────────────────────────────────┤</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">│  ERR      satisfices; stops probabil-       navigational web /  │</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">│           istically; redundancy is waste    e-commerce          │</text><text x="46" y="348" fill="#736747" class="mono" xml:space="preserve">├─────────────────────────────────────────────────────────────────┤</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve">│  RBP      continues with probability p;     judgments are       │</text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve">│           REPORTS ITS OWN UNCERTAINTY       SPARSE (i.e. most   │</text><text x="46" y="408" fill="#2A2518" class="mono" xml:space="preserve">│                                             real evaluations)   │</text><text x="46" y="428" fill="#736747" class="mono" xml:space="preserve">└─────────────────────────────────────────────────────────────────┘</text><text x="46" y="448" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="468" fill="#C43C32" class="mono" xml:space="preserve">   CAUTION FOR RAG, ALL FIVE ENCODE THE WRONG READER.</text><text x="46" y="488" fill="#2A2518" class="mono" xml:space="preserve">   Every discount above models a human scanning sequentially.</text><text x="46" y="508" fill="#2A2518" class="mono" xml:space="preserve">   An LLM reads the whole prompt. See UDCG (Supplement A §A.4.1)</text><text x="46" y="528" fill="#2A2518" class="mono" xml:space="preserve">   and keep a distraction-sensitive metric alongside whichever</text><text x="46" y="548" fill="#2A2518" class="mono" xml:space="preserve">   of these you report.</text>
</svg>
