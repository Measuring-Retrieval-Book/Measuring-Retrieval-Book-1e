<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   THE SYNTHETIC DATA TENSION</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ══════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#5264C8" class="mono" xml:space="preserve">   DIVERSITY ◀───────────────────▶ PRIVACY</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">   more varied questions           less risk of</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">   = better coverage               reproducing real</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">                                   sensitive content</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#5264C8" class="mono" xml:space="preserve">   Generate from your real corpus  ── high diversity,</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">                                      privacy risk</text><text x="46" y="288" fill="#5264C8" class="mono" xml:space="preserve">   Generate from templates         ── safe, low diversity</text>
</svg>
