<svg xmlns="http://www.w3.org/2000/svg" width="720" height="546" viewBox="0 0 720 546">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="546" rx="10" fill="#FFF0ED"/>
<rect width="720" height="8" rx="4" fill="#E45E4F"/>
<text x="34" y="39" fill="#342127" class="title">Two Different Problems, Often Conflated</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   TWO DIFFERENT PROBLEMS, OFTEN CONFLATED</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ═══════════════════════════════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">   AMBIGUITY (query side)          REDUNDANCY (document side)</text><text x="46" y="148" fill="#7B5960" class="mono" xml:space="preserve">   ──────────────────────          ──────────────────────────</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">   &quot;jaguar&quot;                        Five documents all saying</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve">     ├─ the animal                 the same thing about the</text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve">     ├─ the car                    same subtopic</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">     └─ the OS version</text><text x="46" y="248" fill="#7B5960" class="mono" xml:space="preserve">                                   ┌────────────┐</text><text x="46" y="268" fill="#342127" class="mono" xml:space="preserve">   Serving only &quot;car&quot; fails        │ doc A ████ │</text><text x="46" y="288" fill="#342127" class="mono" xml:space="preserve">   two thirds of your users        │ doc B ████ │ &lt;- identical</text><text x="46" y="308" fill="#342127" class="mono" xml:space="preserve">                                   │ doc C ████ │   content</text><text x="46" y="328" fill="#7B5960" class="mono" xml:space="preserve">                                   └────────────┘</text><text x="46" y="348" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Both are &#x27;diversity problems&#x27;.&quot;</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="428" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;They need different metrics. Ambiguity is</text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">       /|\     about COVERAGE of intents. Redundancy is</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       / \     about MARGINAL value of each document.&quot;</text>
</svg>
