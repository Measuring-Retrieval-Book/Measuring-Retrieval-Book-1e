<svg xmlns="http://www.w3.org/2000/svg" width="720" height="446" viewBox="0 0 720 446">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="446" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">The Ablation Trick</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   THE ABLATION TRICK</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ══════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#736747" class="mono" xml:space="preserve">   Ask the model WITHOUT the passage.     ──▶  measure something</text><text x="46" y="148" fill="#736747" class="mono" xml:space="preserve">   Ask the model WITH the passage.        ──▶  measure it again</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">   The DIFFERENCE is the passage&#x27;s value.</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#736747" class="mono" xml:space="preserve">        ┌──────────────┐        ┌──────────────┐</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">        │  q           │        │  q + passage │</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">        │              │  and.   │              │</text><text x="46" y="268" fill="#736747" class="mono" xml:space="preserve">        └──────┬───────┘        └──────┬───────┘</text><text x="46" y="288" fill="#736747" class="mono" xml:space="preserve">               ▼                       ▼</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">            score0                  score1</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve">              contribution = score1 - score0</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve">   The four metrics differ ONLY in what &quot;score&quot; means.</text>
</svg>
