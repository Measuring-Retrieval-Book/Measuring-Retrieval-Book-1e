<svg xmlns="http://www.w3.org/2000/svg" width="730" height="706" viewBox="0 0 730 706">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="730" height="706" rx="10" fill="#FFF6DE"/>
<rect width="730" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">Start: What Kind Of System Do You Have?</text>
<text x="696" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#2A2518" class="mono" xml:space="preserve">   START: WHAT KIND OF SYSTEM DO YOU HAVE?</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ═══════════════════════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   ┌─ Do you have golden answers?</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">   │</text><text x="46" y="168" fill="#736747" class="mono" xml:space="preserve">   ├── NO ──▶ REFERENCE-FREE TRACK</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">   │          Correctness:  RAGAS faithfulness (3-metric form)</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">   │          Alignment:    DIG  ·or·  WARG</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">   │          Integrity:    RBO and frozen baseline</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">   │          Efficiency:   Pairwise Redundancy + TTFT p95</text><text x="46" y="268" fill="#C43C32" class="mono" xml:space="preserve">   │          CAUTION Add: RAG-off comparison (leakage check)</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve">   │</text><text x="46" y="308" fill="#736747" class="mono" xml:space="preserve">   └── YES ─▶ Do you ship citations to users?</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">              │</text><text x="46" y="348" fill="#736747" class="mono" xml:space="preserve">              ├── YES ──▶ ATTRIBUTION TRACK</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve">              │           Correctness: RAGChecker (CR, SK, HL)</text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve">              │                      + ALCE citation precision</text><text x="46" y="408" fill="#2A2518" class="mono" xml:space="preserve">              │           Alignment:   CUE quadrants</text><text x="46" y="428" fill="#2A2518" class="mono" xml:space="preserve">              │           Integrity:   RBO + version-sensitive set</text><text x="46" y="448" fill="#2A2518" class="mono" xml:space="preserve">              │           Efficiency:  tokens/query + EHR@k</text><text x="46" y="468" fill="#2A2518" class="mono" xml:space="preserve">              │</text><text x="46" y="488" fill="#736747" class="mono" xml:space="preserve">              └── NO ───▶ Is retrieval single-shot or agentic?</text><text x="46" y="508" fill="#2A2518" class="mono" xml:space="preserve">                          │</text><text x="46" y="528" fill="#736747" class="mono" xml:space="preserve">                          ├── SINGLE ──▶ CORE TRACK  (§15.2)</text><text x="46" y="548" fill="#2A2518" class="mono" xml:space="preserve">                          │</text><text x="46" y="568" fill="#736747" class="mono" xml:space="preserve">                          └── AGENTIC ─▶ CORE TRACK</text><text x="46" y="588" fill="#2A2518" class="mono" xml:space="preserve">                                       + retrieval calls/answer</text><text x="46" y="608" fill="#2A2518" class="mono" xml:space="preserve">                                       + redundant-query rate</text><text x="46" y="628" fill="#C43C32" class="mono" xml:space="preserve">                                       CAUTION largely uninstrumented</text><text x="46" y="648" fill="#2A2518" class="mono" xml:space="preserve">                                          territory</text>
</svg>
