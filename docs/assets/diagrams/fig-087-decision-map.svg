<svg xmlns="http://www.w3.org/2000/svg" width="720" height="666" viewBox="0 0 720 666">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="666" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#736747" class="mono" xml:space="preserve">┌─────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#2A2518" class="mono" xml:space="preserve">│  BEFORE YOU REPORT A RETRIEVAL METRIC                       │</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve">│                                                             │</text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">│  THE METRIC                                                 │</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">│  □ Metric name AND cutoff k                                 │</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">│  □ Gain function, if nDCG (linear or exponential)           │</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">│  □ Persistence p, if RBP or RBO                             │</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">│  □ Novelty α, if α-nDCG                                     │</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">│  □ Judgment source and coverage                             │</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">│                                                             │</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">│  THE COMPARISON                                             │</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve">│  □ Number of queries                                        │</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">│  □ Significance test used (paired randomization preferred)  │</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">│  □ Effect size and confidence interval          │</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve">│  □ Multiple-comparison correction, if &gt;1 test               │</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve">│  □ Baseline configuration - was it TUNED?                   │</text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve">│                                                             │</text><text x="46" y="408" fill="#2A2518" class="mono" xml:space="preserve">│  THE HONESTY LINE                                           │</text><text x="46" y="428" fill="#2A2518" class="mono" xml:space="preserve">│  □ RBP residual, or MAP-bpref gap, or some statement of     │</text><text x="46" y="448" fill="#2A2518" class="mono" xml:space="preserve">│    how much judgment incompleteness could move the number   │</text><text x="46" y="468" fill="#2A2518" class="mono" xml:space="preserve">│                                                             │</text><text x="46" y="488" fill="#2A2518" class="mono" xml:space="preserve">│  FOR RAG, ADDITIONALLY                                      │</text><text x="46" y="508" fill="#2A2518" class="mono" xml:space="preserve">│  □ Embedder name AND version                                │</text><text x="46" y="528" fill="#2A2518" class="mono" xml:space="preserve">│  □ Generator name AND version                               │</text><text x="46" y="548" fill="#2A2518" class="mono" xml:space="preserve">│  □ Judge model AND dated snapshot, if LLM-judged            │</text><text x="46" y="568" fill="#2A2518" class="mono" xml:space="preserve">│  □ Chunk size and overlap                                   │</text><text x="46" y="588" fill="#2A2518" class="mono" xml:space="preserve">│  □ k actually injected into the prompt (not k retrieved)    │</text><text x="46" y="608" fill="#736747" class="mono" xml:space="preserve">└─────────────────────────────────────────────────────────────┘</text>
</svg>
