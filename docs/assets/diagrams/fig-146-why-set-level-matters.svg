<text x="34" y="39" fill="#162438" class="title">Why Set-Level Matters</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#00A6C7" class="mono" xml:space="preserve">   WHY SET-LEVEL MATTERS</text><text x="46" y="88" fill="#557184" class="mono" xml:space="preserve">   ═════════════════════</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#087A54" class="mono" xml:space="preserve">   PASSAGE-BY-PASSAGE SCORING:</text><text x="46" y="148" fill="#087A54" class="mono" xml:space="preserve">     p1: relevant ✓    p2: relevant ✓    p3: relevant ✓</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">     verdict: great retrieval</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#00A6C7" class="mono" xml:space="preserve">   SET-LEVEL REALITY:</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">     p1 and p2 CONTRADICT each other</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">     p3 is missing the second hop</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve">     verdict: insufficient</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;All three passages scored well.&quot;</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="368" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Independently. The problem is BETWEEN them.&quot;</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
</svg>
