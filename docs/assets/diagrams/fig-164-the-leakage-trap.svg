<svg xmlns="http://www.w3.org/2000/svg" width="720" height="586" viewBox="0 0 720 586">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="586" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">The Leakage Trap</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#168C63" class="mono" xml:space="preserve">   THE LEAKAGE TRAP</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ════════════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   Question: &quot;What is the capital of Switzerland?&quot;</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">   Retrieval: returns nothing useful</text><text x="46" y="168" fill="#087A54" class="mono" xml:space="preserve">   Answer: &quot;Bern&quot;  ✓ CORRECT</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">   Your metrics:</text><text x="46" y="228" fill="#087A54" class="mono" xml:space="preserve">     accuracy      ✓ high</text><text x="46" y="248" fill="#087A54" class="mono" xml:space="preserve">     faithfulness  ✓ high (nothing contradicts it)</text><text x="46" y="268" fill="#183029" class="mono" xml:space="preserve">     Lucky Guess   &lt;- the ONLY metric that catches this</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Our RAG scores 89% on our benchmark.&quot;</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="368" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;What does it score with retrieval</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       /|\     DISABLED?&quot;</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="448" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;...86%.&quot;</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       / \   &quot;Then your retrieval is worth three</text><text x="46" y="528" fill="#183029" class="mono" xml:space="preserve">              points and your benchmark is leaked.&quot;</text>
</svg>
