<text x="34" y="39" fill="#183029" class="title">The Ci Gate</text>
<text x="733" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#168C63" class="mono" xml:space="preserve">   THE CI GATE</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ═══════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#527368" class="mono" xml:space="preserve">   every commit  ──▶  ref + free metrics      (fast, deterministic)</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">                          │</text><text x="46" y="168" fill="#527368" class="mono" xml:space="preserve">   nightly       ──▶  judge metrics           (slow, costs money, drifts)</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve">                          │</text><text x="46" y="208" fill="#527368" class="mono" xml:space="preserve">   per release   ──▶  human anchor set        (slow, expensive, truth)</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#D94C42" class="mono" xml:space="preserve">        o   &quot;We run the full eval suite on every PR.&quot;</text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">       / \  &quot;Including the LLM judge?&quot;</text><text x="46" y="308" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">        o   &quot;...that&#x27;s why the bill is like that.&quot;</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
</svg>
