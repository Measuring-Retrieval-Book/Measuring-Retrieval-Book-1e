<svg xmlns="http://www.w3.org/2000/svg" width="720" height="646" viewBox="0 0 720 646">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="646" rx="10" fill="#E8F7FA"/>
<rect width="720" height="8" rx="4" fill="#00A6C7"/>
<text x="34" y="39" fill="#162438" class="title">Ap Measures Precision At Each Hit</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#00A6C7" class="mono" xml:space="preserve">   AP MEASURES PRECISION AT EACH HIT</text><text x="46" y="88" fill="#557184" class="mono" xml:space="preserve">   ═════════════════════════════════</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">   rank  doc   rel?   P@k at hits</text><text x="46" y="148" fill="#557184" class="mono" xml:space="preserve">   ────  ───   ────   ───────────</text><text x="46" y="168" fill="#087A54" class="mono" xml:space="preserve">    1     A     ✓     1/1 = 1.000  ●</text><text x="46" y="188" fill="#C43C32" class="mono" xml:space="preserve">    2     B     ✗</text><text x="46" y="208" fill="#087A54" class="mono" xml:space="preserve">    3     C     ✓     2/3 = 0.667  ●</text><text x="46" y="228" fill="#C43C32" class="mono" xml:space="preserve">    4     D     ✗</text><text x="46" y="248" fill="#087A54" class="mono" xml:space="preserve">    5     E     ✓     3/5 = 0.600  ●</text><text x="46" y="268" fill="#C43C32" class="mono" xml:space="preserve">    6     F     ✗</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve">    ...</text><text x="46" y="308" fill="#162438" class="mono" xml:space="preserve">   (R = 4 relevant documents exist; one never retrieved)</text><text x="46" y="328" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#162438" class="mono" xml:space="preserve">   AP = (1.000 + 0.667 + 0.600 + 0) / 4 = 0.567</text><text x="46" y="368" fill="#557184" class="mono" xml:space="preserve">                                     ▲</text><text x="46" y="388" fill="#557184" class="mono" xml:space="preserve">                                     └── the unretrieved</text><text x="46" y="408" fill="#162438" class="mono" xml:space="preserve">                                         relevant doc</text><text x="46" y="428" fill="#162438" class="mono" xml:space="preserve">                                         contributes ZERO</text><text x="46" y="448" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;So AP punishes missing documents?&quot;</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="528" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="548" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Yes - the divisor is R, not the number</text><text x="46" y="568" fill="#D94C42" class="mono" xml:space="preserve">       /|\     you found. That&#x27;s how recall gets into</text><text x="46" y="588" fill="#D94C42" class="mono" xml:space="preserve">       / \     a precision-flavoured metric.&quot;</text>
</svg>
