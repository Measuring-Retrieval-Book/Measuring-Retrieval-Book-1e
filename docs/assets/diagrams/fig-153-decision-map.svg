<text x="46" y="68" fill="#7B5960" class="mono" xml:space="preserve">   ═══════════════════════════════════════════════════════════</text><text x="46" y="88" fill="#E45E4F" class="mono" xml:space="preserve">   METRIC                    COST PER QUERY</text><text x="46" y="108" fill="#7B5960" class="mono" xml:space="preserve">   ═══════════════════════════════════════════════════════════</text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">   Precision / Recall / nDCG   ~free (given labels)</text><text x="46" y="148" fill="#7B5960" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────────</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">   RAGAS faithfulness          1 extraction + n entailment</text><text x="46" y="188" fill="#7B5960" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────────</text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve">   RAGChecker (all nine)       1 extraction × 2 (response + GT)</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">                               + entailment across</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">                                 claims × chunks</text><text x="46" y="268" fill="#7B5960" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────────</text><text x="46" y="288" fill="#342127" class="mono" xml:space="preserve">   ALCE citation precision     leave-one-out:</text><text x="46" y="308" fill="#342127" class="mono" xml:space="preserve">                               COMBINATORIAL in citations</text><text x="46" y="328" fill="#342127" class="mono" xml:space="preserve">                               per sentence</text><text x="46" y="348" fill="#7B5960" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────────</text><text x="46" y="368" fill="#342127" class="mono" xml:space="preserve">   eRAG                        k LLM calls (one per document)</text><text x="46" y="388" fill="#7B5960" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────────</text><text x="46" y="408" fill="#342127" class="mono" xml:space="preserve">   ΔSePer                      N samples × 2 conditions</text><text x="46" y="428" fill="#342127" class="mono" xml:space="preserve">                               + entailment over response pairs</text><text x="46" y="448" fill="#7B5960" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────────</text><text x="46" y="468" fill="#342127" class="mono" xml:space="preserve">   MIRAGE                      3 inference runs</text><text x="46" y="488" fill="#342127" class="mono" xml:space="preserve">                               (Base / Oracle / Mixed)</text><text x="46" y="508" fill="#7B5960" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────────</text><text x="46" y="528" fill="#342127" class="mono" xml:space="preserve">   WARG                        Shapley approximation - heavy</text><text x="46" y="548" fill="#7B5960" class="mono" xml:space="preserve">   ═══════════════════════════════════════════════════════════</text><text x="46" y="568" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="588" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;We&#x27;ll run the full suite on every PR.&quot;</text><text x="46" y="608" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="628" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="648" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="668" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Add up that column first.&quot;</text><text x="46" y="688" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="708" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
</svg>
