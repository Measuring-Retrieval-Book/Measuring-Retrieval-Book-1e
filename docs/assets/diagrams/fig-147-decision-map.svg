<svg xmlns="http://www.w3.org/2000/svg" width="720" height="806" viewBox="0 0 720 806">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="806" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#736747" class="mono" xml:space="preserve">┌────────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#2A2518" class="mono" xml:space="preserve">│  CORRECTNESS / GROUNDING: THE DASHBOARD                        │</text><text x="46" y="108" fill="#736747" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">│  NO GOLDEN ANSWERS:                                            │</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">│     RAGAS (paper form, 3 metrics) - and know its limits        │</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">│  GOLDEN ANSWERS AVAILABLE:                                     │</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">│     RAGChecker -&gt; promote Claim Recall, Self-Knowledge,         │</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">│     Hallucination. Keep the other six for diagnosis.           │</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">│  SHIPPING CITATIONS:                                           │</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve">│     ALCE citation precision (citation necessity)     │</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">│     + a counterfactual faithfulness spot-check                 │</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve">│  CHOOSING A MODEL:                                             │</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve">│     Trust-Score + MIRAGE&#x27;s LLM-intrinsic half                  │</text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="408" fill="#2A2518" class="mono" xml:space="preserve">│  MULTI-HOP:                                                    │</text><text x="46" y="428" fill="#2A2518" class="mono" xml:space="preserve">│     SURE-RAG framing - sufficiency is a SET property           │</text><text x="46" y="448" fill="#736747" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="468" fill="#2A2518" class="mono" xml:space="preserve">│  THE FOUR RULES                                                │</text><text x="46" y="488" fill="#2A2518" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="508" fill="#2A2518" class="mono" xml:space="preserve">│  1. Faithfulness NEVER ships without Claim Recall beside it.   │</text><text x="46" y="528" fill="#2A2518" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="548" fill="#2A2518" class="mono" xml:space="preserve">│  2. Correct and ungrounded is a real and dangerous category.   │</text><text x="46" y="568" fill="#2A2518" class="mono" xml:space="preserve">│     Three papers named it independently: Lucky Guess,          │</text><text x="46" y="588" fill="#2A2518" class="mono" xml:space="preserve">│     Self-Knowledge, post-rationalization. Measure it.          │</text><text x="46" y="608" fill="#2A2518" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="628" fill="#2A2518" class="mono" xml:space="preserve">│  3. Report claim COUNTS next to claim PROPORTIONS. A model     │</text><text x="46" y="648" fill="#2A2518" class="mono" xml:space="preserve">│     that says less scores better on hallucination rate         │</text><text x="46" y="668" fill="#2A2518" class="mono" xml:space="preserve">│     without being more truthful.                               │</text><text x="46" y="688" fill="#2A2518" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="708" fill="#2A2518" class="mono" xml:space="preserve">│  4. Cite the version you ran. RAGAS-the-paper and              │</text><text x="46" y="728" fill="#2A2518" class="mono" xml:space="preserve">│     RAGAS-the-library are not the same evaluation.             │</text><text x="46" y="748" fill="#736747" class="mono" xml:space="preserve">└────────────────────────────────────────────────────────────────┘</text>
</svg>
