<text x="34" y="39" fill="#2A2518" class="title">The Four Questions</text>
<text x="705" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">        THE FOUR QUESTIONS</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">        ══════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   CORRECTNESS          &quot;Is this right?&quot;</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">                         ↓</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">   ALIGNMENT            &quot;Do my parts cooperate?&quot;</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">                         ↓</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">   INTEGRITY / DRIFT    &quot;Is it still right, six months on?&quot;</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">                         ↓</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">   EFFICIENCY / COST    &quot;What did being right cost me?&quot;</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;All four are green.&quot;</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;You have four metrics. You need four DIFFERENT metrics.&quot;</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
