<svg xmlns="http://www.w3.org/2000/svg" width="720" height="826" viewBox="0 0 720 826">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="826" rx="10" fill="#202541"/>
<rect width="720" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">Week 1 - Free, And Unlocks Everything</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   WEEK 1 - FREE, AND UNLOCKS EVERYTHING</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ═════════════════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Freeze a baseline: 500 queries + top-k, stamped with</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">     embedder version and k</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Pin the judge model to a dated snapshot</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Freeze a 100-item human-labelled anchor set</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Time a full index rebuild. Write the number down.</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Trace your ACTUAL injected k (not retrieved k)</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#E86850" class="mono" xml:space="preserve">   WEEK 2-4 - THE CHEAP DIAGNOSTICS</text><text x="46" y="268" fill="#5264C8" class="mono" xml:space="preserve">   ════════════════════════════════</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">   □ RAG-on and RAG-off on your benchmark   &lt;- do this first</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Semantic test coverage of your eval set</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Pairwise Redundancy at current k</text><text x="46" y="348" fill="#EDF5F7" class="mono" xml:space="preserve">   □ MAP and bpref gap (judgment-distortion estimate)</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Position-bias test on your judge (swap A/B, re-score)</text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve">   MONTH 2 - THE k-SWEEP</text><text x="46" y="428" fill="#5264C8" class="mono" xml:space="preserve">   ═════════════════════</text><text x="46" y="448" fill="#EDF5F7" class="mono" xml:space="preserve">   □ k ∈ {1,3,5,10,20,50} × {recall, quality, redundancy,</text><text x="46" y="468" fill="#EDF5F7" class="mono" xml:space="preserve">     tokens, TTFT}</text><text x="46" y="488" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Plot quality and tokens. Find the knee. Set k there.</text><text x="46" y="508" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="528" fill="#E86850" class="mono" xml:space="preserve">   MONTH 3 - THE DIAGNOSTIC LAYER</text><text x="46" y="548" fill="#5264C8" class="mono" xml:space="preserve">   ══════════════════════════════</text><text x="46" y="568" fill="#EDF5F7" class="mono" xml:space="preserve">   □ RAGChecker full nine, offline; promote three</text><text x="46" y="588" fill="#EDF5F7" class="mono" xml:space="preserve">   □ CUE quadrants on a sample</text><text x="46" y="608" fill="#EDF5F7" class="mono" xml:space="preserve">   □ WARG once - is the generator even using your ranking?</text><text x="46" y="628" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Build a 50-question version-sensitive set</text><text x="46" y="648" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="668" fill="#E86850" class="mono" xml:space="preserve">   ONGOING</text><text x="46" y="688" fill="#5264C8" class="mono" xml:space="preserve">   ═══════</text><text x="46" y="708" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Monthly: RBO and baseline</text><text x="46" y="728" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Per release: the expensive diagnostics</text><text x="46" y="748" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Per judge change: anchor set + Krippendorff&#x27;s α</text><text x="46" y="768" fill="#EDF5F7" class="mono" xml:space="preserve">   □ Per embedder change: Jaccard + RankSimilarity at your k</text>
</svg>
