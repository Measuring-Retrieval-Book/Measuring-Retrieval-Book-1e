<svg xmlns="http://www.w3.org/2000/svg" width="720" height="546" viewBox="0 0 720 546">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="546" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#527368" class="mono" xml:space="preserve">   ┌──────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#183029" class="mono" xml:space="preserve">   │  LEAVE THESE OFF THE DASHBOARD                       │</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve">   │                                                      │</text><text x="46" y="128" fill="#C43C32" class="mono" xml:space="preserve">   │  ✗ More than one contribution metric                 │</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">   │    eRAG, Gain, DIG, ΔSePer are one family            │</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">   │                                                      │</text><text x="46" y="188" fill="#C43C32" class="mono" xml:space="preserve">   │  ✗ Faithfulness without Claim Recall beside it       │</text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">   │    the Adherence Paradox. Three papers. Enough.      │</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve">   │                                                      │</text><text x="46" y="248" fill="#C43C32" class="mono" xml:space="preserve">   │  ✗ An averaged composite &quot;RAG score&quot;                 │</text><text x="46" y="268" fill="#183029" class="mono" xml:space="preserve">   │    cross-unit aggregation destroys the diagnosis     │</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve">   │                                                      │</text><text x="46" y="308" fill="#C43C32" class="mono" xml:space="preserve">   │  ✗ CTR / abandonment as QUALITY measures             │</text><text x="46" y="328" fill="#183029" class="mono" xml:space="preserve">   │    eight absolute metrics tested in 2008; none       │</text><text x="46" y="348" fill="#183029" class="mono" xml:space="preserve">   │    reliably reflected quality. Keep for monitoring.  │</text><text x="46" y="368" fill="#183029" class="mono" xml:space="preserve">   │                                                      │</text><text x="46" y="388" fill="#C43C32" class="mono" xml:space="preserve">   │  ✗ nDCG at retrieval depth when you inject fewer     │</text><text x="46" y="408" fill="#183029" class="mono" xml:space="preserve">   │    measure what the generator SEES                   │</text><text x="46" y="428" fill="#183029" class="mono" xml:space="preserve">   │                                                      │</text><text x="46" y="448" fill="#C43C32" class="mono" xml:space="preserve">   │  ✗ Mean cosine similarity of retrieved chunks        │</text><text x="46" y="468" fill="#183029" class="mono" xml:space="preserve">   │    a signal, not a metric (Vol I Ch 3)               │</text><text x="46" y="488" fill="#527368" class="mono" xml:space="preserve">   └──────────────────────────────────────────────────────┘</text>
</svg>
