<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#527368" class="mono" xml:space="preserve">   ═══════════════════════════════════════════════════════</text><text x="46" y="88" fill="#168C63" class="mono" xml:space="preserve">   WHERE THE MONEY GOES              MEASURED BY</text><text x="46" y="108" fill="#527368" class="mono" xml:space="preserve">   ═══════════════════════════════════════════════════════</text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   INDEX TIME    building and        upload time, indexing</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">                 refreshing the      time, index size,</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">                 vector store        rebuild cadence</text><text x="46" y="188" fill="#527368" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────</text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">   QUERY TIME    retrieving and      retrieval speed,</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve">                 reranking           throughput, TTFT</text><text x="46" y="248" fill="#527368" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────</text><text x="46" y="268" fill="#183029" class="mono" xml:space="preserve">   TOKEN         context you pay     prompt tokens,</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve">                 for and don&#x27;t use   redundancy, EHR@k</text><text x="46" y="308" fill="#527368" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────</text><text x="46" y="328" fill="#183029" class="mono" xml:space="preserve">   EVALUATION    measuring all       judge calls, extraction</text><text x="46" y="348" fill="#183029" class="mono" xml:space="preserve">                 of the above        calls, GPU-hours</text><text x="46" y="368" fill="#527368" class="mono" xml:space="preserve">   ═══════════════════════════════════════════════════════</text>
</svg>
