<text x="34" y="39" fill="#FFFFFF" class="title">FOUR THINGS THAT DRIFT (and they are NOT the same thing</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#EDF5F7" class="mono" xml:space="preserve">   FOUR THINGS THAT DRIFT (and they are NOT the same thing)</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ═══════════════════════════════════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   1. THE CORPUS      Documents change. Policies get revised.</text><text x="46" y="148" fill="#5264C8" class="mono" xml:space="preserve">                      ──────────────────────────────────▶ time</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">   2. THE EMBEDDER    You upgrade the model. Vectors mean</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">                      something different now.</text><text x="46" y="228" fill="#5264C8" class="mono" xml:space="preserve">                      ──────────────────────────────────▶ time</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">   3. THE QUERIES     Users start asking about things that</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">                      didn&#x27;t exist at launch.</text><text x="46" y="308" fill="#5264C8" class="mono" xml:space="preserve">                      ──────────────────────────────────▶ time</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#EDF5F7" class="mono" xml:space="preserve">   4. THE JUDGE       Your LLM evaluator got a silent update.</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve">                      Every longitudinal number is now void.</text><text x="46" y="388" fill="#5264C8" class="mono" xml:space="preserve">                      ──────────────────────────────────▶ time</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="428" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Our drift metric is green.&quot;</text><text x="46" y="448" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="468" fill="#FF9D8A" class="mono" xml:space="preserve">       / \   &quot;Which of the four?&quot;</text><text x="46" y="488" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="508" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;...there are four?&quot;</text><text x="46" y="528" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="548" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text>
</svg>
