<svg xmlns="http://www.w3.org/2000/svg" width="720" height="366" viewBox="0 0 720 366">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="366" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">Who Else Has A Stake?</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#2A2518" class="mono" xml:space="preserve">   WHO ELSE HAS A STAKE?</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ═════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   Ch 8  The query had MULTIPLE INTENTS.</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">         Serving one well may serve the others not at all.</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">              │</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">   Ch 9  The DOCUMENTS have interests too.</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">         Ranking allocates attention, and attention is</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">         economic opportunity.</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">              │</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">   Ch 10 The USERS already told you what they think.</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve">         You have been ignoring it because you did not</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">         know how to read it.</text>
</svg>
