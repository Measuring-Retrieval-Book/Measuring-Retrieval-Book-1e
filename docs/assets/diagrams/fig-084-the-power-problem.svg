<svg xmlns="http://www.w3.org/2000/svg" width="720" height="586" viewBox="0 0 720 586">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="586" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">The Power Problem</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#168C63" class="mono" xml:space="preserve">   THE POWER PROBLEM</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ═════════════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   50 queries.  nDCG 0.712 and 0.698.  p = 0.04.</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="168" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Significant improvement!&quot;</text><text x="46" y="188" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="208" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;With 50 queries and that effect size,</text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">       /|\     what&#x27;s your power to detect a real</text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">       / \     difference? If it&#x27;s 0.35, then most</text><text x="46" y="308" fill="#183029" class="mono" xml:space="preserve">              real improvements would come back</text><text x="46" y="328" fill="#183029" class="mono" xml:space="preserve">              non-significant - and some</text><text x="46" y="348" fill="#183029" class="mono" xml:space="preserve">              non-improvements come back significant.&quot;</text><text x="46" y="368" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#527368" class="mono" xml:space="preserve">   ┌───────────────────────────────────────────┐</text><text x="46" y="408" fill="#183029" class="mono" xml:space="preserve">   │  UNDERPOWERED STUDIES DON&#x27;T JUST MISS     │</text><text x="46" y="428" fill="#183029" class="mono" xml:space="preserve">   │  REAL EFFECTS. They also inflate the      │</text><text x="46" y="448" fill="#183029" class="mono" xml:space="preserve">   │  ones they DO detect, because only large  │</text><text x="46" y="468" fill="#183029" class="mono" xml:space="preserve">   │  observed differences clear the bar -     │</text><text x="46" y="488" fill="#183029" class="mono" xml:space="preserve">   │  including the ones that are large by     │</text><text x="46" y="508" fill="#183029" class="mono" xml:space="preserve">   │  chance.                                  │</text><text x="46" y="528" fill="#527368" class="mono" xml:space="preserve">   └───────────────────────────────────────────┘</text>
</svg>
