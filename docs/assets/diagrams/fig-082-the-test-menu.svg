<svg xmlns="http://www.w3.org/2000/svg" width="720" height="686" viewBox="0 0 720 686">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="686" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">The Test Menu</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   THE TEST MENU</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ═════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#736747" class="mono" xml:space="preserve">   ┌────────────────────┬──────────────────────────────────┐</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">   │ TEST               │ CHARACTER                        │</text><text x="46" y="168" fill="#736747" class="mono" xml:space="preserve">   ├────────────────────┼──────────────────────────────────┤</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">   │ Paired t-test      │ assumes normality; surprisingly  │</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">   │                    │ robust in practice               │</text><text x="46" y="228" fill="#736747" class="mono" xml:space="preserve">   ├────────────────────┼──────────────────────────────────┤</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">   │ Randomization      │ makes no distributional          │</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">   │ (permutation) test │ assumption; recommended default  │</text><text x="46" y="288" fill="#736747" class="mono" xml:space="preserve">   ├────────────────────┼──────────────────────────────────┤</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">   │ Bootstrap          │ resampling; gives intervals      │</text><text x="46" y="328" fill="#736747" class="mono" xml:space="preserve">   ├────────────────────┼──────────────────────────────────┤</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve">   │ Wilcoxon signed-   │ rank-based; discards magnitude   │</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve">   │ rank               │                                  │</text><text x="46" y="388" fill="#736747" class="mono" xml:space="preserve">   ├────────────────────┼──────────────────────────────────┤</text><text x="46" y="408" fill="#2A2518" class="mono" xml:space="preserve">   │ Sign test          │ weakest; only direction          │</text><text x="46" y="428" fill="#736747" class="mono" xml:space="preserve">   └────────────────────┴──────────────────────────────────┘</text><text x="46" y="448" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Which one?&quot;</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="528" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="548" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Paired randomization. It assumes least,</text><text x="46" y="568" fill="#D94C42" class="mono" xml:space="preserve">       /|\     it&#x27;s cheap on modern hardware, and it</text><text x="46" y="588" fill="#D94C42" class="mono" xml:space="preserve">       / \     directly tests the thing you care about:</text><text x="46" y="608" fill="#2A2518" class="mono" xml:space="preserve">              could this difference have arisen by</text><text x="46" y="628" fill="#2A2518" class="mono" xml:space="preserve">              chance assignment?&quot;</text>
</svg>
