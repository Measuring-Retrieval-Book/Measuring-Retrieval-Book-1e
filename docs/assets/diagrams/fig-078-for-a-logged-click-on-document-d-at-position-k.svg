<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">FORMULA</text>
<text x="46" y="68" fill="#342127" class="mono" xml:space="preserve">   For a logged click on document d at position k:</text><text x="46" y="88" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve">     weight = 1 / P(examined at position k)</text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve">   Documents shown at low-attention positions get UP-weighted,</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">   correcting for the fact that they were rarely examined.</text>
