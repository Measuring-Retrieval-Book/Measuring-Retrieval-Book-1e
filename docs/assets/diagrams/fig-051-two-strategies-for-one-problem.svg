<svg xmlns="http://www.w3.org/2000/svg" width="720" height="586" viewBox="0 0 720 586">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="586" rx="10" fill="#E8F7FA"/>
<rect width="720" height="8" rx="4" fill="#00A6C7"/>
<text x="34" y="39" fill="#162438" class="title">Two Strategies For One Problem</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#00A6C7" class="mono" xml:space="preserve">   TWO STRATEGIES FOR ONE PROBLEM</text><text x="46" y="88" fill="#557184" class="mono" xml:space="preserve">   ══════════════════════════════</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">   bpref:  &quot;Change the metric so missing</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">            judgments don&#x27;t matter.&quot;</text><text x="46" y="168" fill="#557184" class="mono" xml:space="preserve">            ┌──────────────────────┐</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">            │ skip the unknowns    │</text><text x="46" y="208" fill="#557184" class="mono" xml:space="preserve">            └──────────────────────┘</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">   infAP:  &quot;Keep the metric. Sample properly.</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve">            ESTIMATE the true value.&quot;</text><text x="46" y="288" fill="#557184" class="mono" xml:space="preserve">            ┌──────────────────────┐</text><text x="46" y="308" fill="#557184" class="mono" xml:space="preserve">            │ random sample ──▶ AP̂ │</text><text x="46" y="328" fill="#162438" class="mono" xml:space="preserve">            │        + confidence  │</text><text x="46" y="348" fill="#557184" class="mono" xml:space="preserve">            └──────────────────────┘</text><text x="46" y="368" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Which is better?&quot;</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="448" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Depends on whether you CONTROLLED the</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       /|\     sampling. infAP needs a random sample.</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       / \     bpref works on whatever pool you</text><text x="46" y="528" fill="#162438" class="mono" xml:space="preserve">              inherited.&quot;</text>
</svg>
