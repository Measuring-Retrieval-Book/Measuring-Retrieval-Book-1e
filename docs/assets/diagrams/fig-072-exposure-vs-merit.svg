<svg xmlns="http://www.w3.org/2000/svg" width="720" height="626" viewBox="0 0 720 626">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="626" rx="10" fill="#FFF6DE"/>
<rect width="720" height="8" rx="4" fill="#D98B00"/>
<text x="34" y="39" fill="#2A2518" class="title">Exposure and Merit</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   EXPOSURE and MERIT</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ═════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   Two groups, nearly equal average relevance:</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">     Group A: mean relevance 0.62</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">     Group B: mean relevance 0.60</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#D98B00" class="mono" xml:space="preserve">   RELEVANCE-OPTIMAL RANKING:</text><text x="46" y="228" fill="#736747" class="mono" xml:space="preserve">   ┌──────────────────────────────────┐</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">   │ 1. A   ████████████████          │</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">   │ 2. A   ████████                  │  Group A exposure: 87%</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve">   │ 3. A   █████                     │  Group B exposure: 13%</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">   │ 4. B   ███                       │</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">   │ 5. B   ██                        │</text><text x="46" y="348" fill="#736747" class="mono" xml:space="preserve">   └──────────────────────────────────┘</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve">   A 3% relevance gap -&gt; a 74-point exposure gap.</text><text x="46" y="408" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;The ranking is correct.&quot;</text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="488" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;It&#x27;s utility-optimal. Whether it&#x27;s</text><text x="46" y="528" fill="#D94C42" class="mono" xml:space="preserve">       /|\     ACCEPTABLE is a different question,</text><text x="46" y="548" fill="#D94C42" class="mono" xml:space="preserve">       / \     and it&#x27;s the one this framework</text><text x="46" y="568" fill="#2A2518" class="mono" xml:space="preserve">              lets you answer.&quot;</text>
</svg>
