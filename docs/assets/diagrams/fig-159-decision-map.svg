<svg xmlns="http://www.w3.org/2000/svg" width="720" height="486" viewBox="0 0 720 486">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="486" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#527368" class="mono" xml:space="preserve">   ┌────────────────────┬────────────────────────────────┐</text><text x="46" y="88" fill="#183029" class="mono" xml:space="preserve">   │ BIAS               │ HOW TO TEST                    │</text><text x="46" y="108" fill="#527368" class="mono" xml:space="preserve">   ├────────────────────┼────────────────────────────────┤</text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   │ POSITION           │ Swap A/B order; re-score.      │</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">   │ prefers whichever  │ Disagreement rate IS the bias. │</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">   │ came first         │                                │</text><text x="46" y="188" fill="#527368" class="mono" xml:space="preserve">   ├────────────────────┼────────────────────────────────┤</text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">   │ VERBOSITY          │ Score matched-content pairs at │</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve">   │ prefers longer     │ two lengths. Any systematic    │</text><text x="46" y="248" fill="#183029" class="mono" xml:space="preserve">   │ answers            │ preference is bias.            │</text><text x="46" y="268" fill="#527368" class="mono" xml:space="preserve">   ├────────────────────┼────────────────────────────────┤</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve">   │ SELF-PREFERENCE    │ Have judge X score outputs from│</text><text x="46" y="308" fill="#183029" class="mono" xml:space="preserve">   │ prefers its own    │ X and from Y. Compare against  │</text><text x="46" y="328" fill="#183029" class="mono" xml:space="preserve">   │ family&#x27;s outputs   │ human ranking.                 │</text><text x="46" y="348" fill="#527368" class="mono" xml:space="preserve">   ├────────────────────┼────────────────────────────────┤</text><text x="46" y="368" fill="#183029" class="mono" xml:space="preserve">   │ VERSION DRIFT      │ Frozen anchor set, re-run on   │</text><text x="46" y="388" fill="#183029" class="mono" xml:space="preserve">   │ silently changes   │ every judge change. See §13.5. │</text><text x="46" y="408" fill="#183029" class="mono" xml:space="preserve">   │ over time          │                                │</text><text x="46" y="428" fill="#527368" class="mono" xml:space="preserve">   └────────────────────┴────────────────────────────────┘</text>
</svg>
