<text x="34" y="39" fill="#FFFFFF" class="title">The Missing Baseline</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   THE MISSING BASELINE</text><text x="46" y="88" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve">   Month 1:  ship it</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   Month 7:  &quot;users say results got worse&quot;</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">   Month 7:  &quot;when did it change?&quot;</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">             &quot;what did it look like before?&quot;</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">             &quot;...we don&#x27;t have that.&quot;</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="228" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Can we measure the drift?&quot;</text><text x="46" y="248" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="268" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Drift is a comparison. You have one</text><text x="46" y="328" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     side of it.&quot;</text><text x="46" y="348" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve">   Cost of freezing a baseline: one afternoon.</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve">   Cost of not having one: the entire dimension.</text>
</svg>
