<text x="46" y="68" fill="#2A2518" class="mono" xml:space="preserve">   WHAT &quot;CORRECT&quot; USED TO MEAN and WHAT IT MEANS NOW</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ════════════════════════════════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#D98B00" class="mono" xml:space="preserve">   CLASSICAL IR                  RAG</text><text x="46" y="148" fill="#736747" class="mono" xml:space="preserve">   ────────────                  ───</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">   unit: document                unit: CLAIM</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">   question: relevant?           question: supported? by WHAT?</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">   binary                        three-way at minimum</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">   one judgment per doc          one judgment per atomic assertion</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;The answer is correct.&quot;</text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Which parts of it? Supported by which</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">       /|\     passage? And would it still be correct</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       / \     if you removed the retrieval?&quot;</text>
