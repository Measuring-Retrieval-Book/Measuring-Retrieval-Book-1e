<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="386" rx="10" fill="#202541"/>
<rect width="720" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">The Unreported Threshold</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   THE UNREPORTED THRESHOLD</text><text x="46" y="88" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve">   Team A: τ = 0.90 (tight)   ΔSePer = 0.31</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   Team B: τ = 0.70 (loose)   ΔSePer = 0.58</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">   Same system. Same data. Same metric name.</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Team B&#x27;s retriever is much better!&quot;</text><text x="46" y="228" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="248" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Team B&#x27;s clustering is much looser.</text><text x="46" y="308" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     You compared two different metrics</text><text x="46" y="328" fill="#FF9D8A" class="mono" xml:space="preserve">       / \     that share a name.&quot;</text>
</svg>
