<text x="46" y="68" fill="#E39A21" class="mono" xml:space="preserve">      THE ALIGNMENT PROBLEM</text><text x="46" y="88" fill="#168C63" class="mono" xml:space="preserve">      ═════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#E39A21" class="mono" xml:space="preserve">   RETRIEVER                    GENERATOR</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">   &quot;Here are docs,              &quot;Cool. I&#x27;ll use</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">    ranked best first.&quot;          the third one.&quot;</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#168C63" class="mono" xml:space="preserve">    ┌──────────┐</text><text x="46" y="228" fill="#168C63" class="mono" xml:space="preserve">    │ #1 ★★★★★ │ ──────────╮        o</text><text x="46" y="248" fill="#FF9D8A" class="mono" xml:space="preserve">    │ #2 ★★★★  │           │       /|\   &quot;It&#x27;s fine.</text><text x="46" y="268" fill="#FF9D8A" class="mono" xml:space="preserve">    │ #3 ★★    │ ◀─────────╯       / \    The answer was right.&quot;</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">    │ #4 ★     │</text><text x="46" y="308" fill="#168C63" class="mono" xml:space="preserve">    └──────────┘</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#EDF5F7" class="mono" xml:space="preserve">   Retriever metrics: EXCELLENT (nDCG 0.89)</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve">   Generator metrics: EXCELLENT (faithfulness 0.84)</text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve">   System:            QUIETLY BROKEN</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="428" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Which dashboard shows that?&quot;</text><text x="46" y="448" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="468" fill="#FF9D8A" class="mono" xml:space="preserve">       / \    &quot;...none of them.&quot;</text>
