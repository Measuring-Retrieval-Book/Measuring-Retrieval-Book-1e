<text x="34" y="39" fill="#183029" class="title">The Propensity Correction</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#168C63" class="mono" xml:space="preserve">   THE PROPENSITY CORRECTION</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ═════════════════════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#168C63" class="mono" xml:space="preserve">   RAW LOG                    IPS-CORRECTED</text><text x="46" y="148" fill="#527368" class="mono" xml:space="preserve">   ───────                    ─────────────</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">   rank  clicks  P(examine)   corrected</text><text x="46" y="188" fill="#168C63" class="mono" xml:space="preserve">    1      500      0.90        556</text><text x="46" y="208" fill="#168C63" class="mono" xml:space="preserve">    2      200      0.60        333</text><text x="46" y="228" fill="#168C63" class="mono" xml:space="preserve">   10       20      0.10        200</text><text x="46" y="248" fill="#168C63" class="mono" xml:space="preserve">   20        5      0.03        167</text><text x="46" y="268" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Rank 20 only got 5 clicks.&quot;</text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="348" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;It was examined 3% of the time. Adjusted,</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       /|\     it performed comparably to rank 10.</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       / \     Your log said it was terrible. Your log</text><text x="46" y="428" fill="#183029" class="mono" xml:space="preserve">              was measuring exposure, not quality.&quot;</text>
