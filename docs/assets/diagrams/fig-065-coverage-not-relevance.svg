<text x="34" y="39" fill="#FFFFFF" class="title">Coverage, Not Relevance</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   COVERAGE, NOT RELEVANCE</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ═══════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   Query: &quot;jaguar&quot;   Subtopics: {animal, car, OS}</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">   SYSTEM A (relevance-optimal)     SYSTEM B (diverse)</text><text x="46" y="188" fill="#5264C8" class="mono" xml:space="preserve">   ┌───────────────────────┐        ┌───────────────────────┐</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">   │ 1. car review    [car]│        │ 1. car review    [car]│</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">   │ 2. car pricing   [car]│        │ 2. jaguar habitat [an]│</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">   │ 3. car dealers   [car]│        │ 3. Mac OS 10.2   [OS] │</text><text x="46" y="268" fill="#5264C8" class="mono" xml:space="preserve">   └───────────────────────┘        └───────────────────────┘</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">     nDCG:      0.95                  nDCG:      0.78</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve">     S-recall@3: 1/3 = 0.33            S-recall@3: 3/3 = 1.00</text><text x="46" y="328" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;System A has better nDCG.&quot;</text><text x="46" y="368" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="388" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="428" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;System A failed two thirds of the people</text><text x="46" y="448" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     who typed that word. nDCG can&#x27;t see that</text><text x="46" y="468" fill="#FF9D8A" class="mono" xml:space="preserve">       / \     because it averages over one assumed intent.&quot;</text>
