<text x="34" y="39" fill="#2A2518" class="title">The User Who Stops</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   THE USER WHO STOPS</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ══════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#736747" class="mono" xml:space="preserve">   ┌──────────────┐        ┌──────────────┐</text><text x="46" y="148" fill="#C43C32" class="mono" xml:space="preserve">   │ 1. ✗         │        │ 1. ✓  &lt;-STOP  │</text><text x="46" y="168" fill="#C43C32" class="mono" xml:space="preserve">   │ 2. ✗         │        │ 2. ✓         │</text><text x="46" y="188" fill="#087A54" class="mono" xml:space="preserve">   │ 3. ✓  &lt;-STOP  │        │ 3. ✓         │</text><text x="46" y="208" fill="#087A54" class="mono" xml:space="preserve">   │ 4. ✓         │        │ 4. ✓         │</text><text x="46" y="228" fill="#087A54" class="mono" xml:space="preserve">   │ 5. ✓         │        │ 5. ✓         │</text><text x="46" y="248" fill="#736747" class="mono" xml:space="preserve">   └──────────────┘        └──────────────┘</text><text x="46" y="268" fill="#2A2518" class="mono" xml:space="preserve">      RR = 1/3 = 0.33         RR = 1/1 = 1.00</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">   The left list has FOUR relevant results.</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">   The right list has FIVE.</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve">   MRR cares about neither number.</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;That throws away most of the information.&quot;</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="448" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Deliberately. If your user needs ONE</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       /|\     answer, the other four are decoration.&quot;</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
</svg>
