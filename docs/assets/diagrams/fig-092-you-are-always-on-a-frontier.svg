<text x="34" y="39" fill="#2A2518" class="title">You Are Always On A Frontier</text>
<text x="686" y="37" text-anchor="end" fill="#168C78" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#D98B00" class="mono" xml:space="preserve">   YOU ARE ALWAYS ON A FRONTIER</text><text x="46" y="88" fill="#736747" class="mono" xml:space="preserve">   ════════════════════════════</text><text x="46" y="108" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   quality</text><text x="46" y="148" fill="#736747" class="mono" xml:space="preserve">      │           ╭──────────── &lt;- diminishing returns</text><text x="46" y="168" fill="#736747" class="mono" xml:space="preserve">      │        ╭──╯</text><text x="46" y="188" fill="#2A2518" class="mono" xml:space="preserve">      │      ╭─╯</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">      │    ╭─╯</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">      │  ╭─╯</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">      │╭─╯</text><text x="46" y="268" fill="#736747" class="mono" xml:space="preserve">      └──────────────────────── cost</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve">        k=1  3   5   10  20  50</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">   RAGChecker&#x27;s measured saturation:</text><text x="46" y="348" fill="#2A2518" class="mono" xml:space="preserve">     &quot;moderately increasing the number and size of</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve">      chunks improves recall and thus F1 with minimal</text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve">      effort... the effect SATURATES as the total</text><text x="46" y="408" fill="#2A2518" class="mono" xml:space="preserve">      amount of relevant information is fixed&quot;</text><text x="46" y="428" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;So where do we sit on this curve?&quot;</text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="508" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="528" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Nobody knows, because almost nobody</text><text x="46" y="548" fill="#D94C42" class="mono" xml:space="preserve">       /|\     plots it. They pick k from a tutorial</text><text x="46" y="568" fill="#D94C42" class="mono" xml:space="preserve">       / \     and never revisit it.&quot;</text>
</svg>
