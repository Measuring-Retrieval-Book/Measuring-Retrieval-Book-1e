<svg xmlns="http://www.w3.org/2000/svg" width="721" height="706" viewBox="0 0 721 706">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="721" height="706" rx="10" fill="#FFF0ED"/>
<rect width="721" height="8" rx="4" fill="#E45E4F"/>
<text x="34" y="39" fill="#342127" class="title">Three Questions, Three Instruments</text>
<text x="687" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   THREE QUESTIONS, THREE INSTRUMENTS</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ══════════════════════════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">   1. CKA  (Centered Kernel Alignment)</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve">      &quot;Do these two embedders REPRESENT text similarly?&quot;</text><text x="46" y="168" fill="#7B5960" class="mono" xml:space="preserve">      ── compares the representation geometry itself</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="208" fill="#E45E4F" class="mono" xml:space="preserve">   2. JACCARD</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">      &quot;Do they RETRIEVE the same documents?&quot;</text><text x="46" y="248" fill="#7B5960" class="mono" xml:space="preserve">      ── set overlap of results, order-blind</text><text x="46" y="268" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#E45E4F" class="mono" xml:space="preserve">   3. RANKSIMILARITY</text><text x="46" y="308" fill="#342127" class="mono" xml:space="preserve">      &quot;Do they retrieve them in the same ORDER?&quot;</text><text x="46" y="328" fill="#7B5960" class="mono" xml:space="preserve">      ── rank-aware overlap of retrieved chunks</text><text x="46" y="348" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#7B5960" class="mono" xml:space="preserve">   ┌───────────┬──────────┬───────────────┬──────────────────┐</text><text x="46" y="408" fill="#342127" class="mono" xml:space="preserve">   │ CKA       │ Jaccard  │ RankSimilarity│ Interpretation   │</text><text x="46" y="428" fill="#7B5960" class="mono" xml:space="preserve">   ├───────────┼──────────┼───────────────┼──────────────────┤</text><text x="46" y="448" fill="#342127" class="mono" xml:space="preserve">   │ high      │ high     │ high          │ genuinely same   │</text><text x="46" y="468" fill="#342127" class="mono" xml:space="preserve">   │ LOW       │ high     │ high          │ different maths, │</text><text x="46" y="488" fill="#342127" class="mono" xml:space="preserve">   │           │          │               │ same behaviour - │</text><text x="46" y="508" fill="#342127" class="mono" xml:space="preserve">   │           │          │               │ safe to swap     │</text><text x="46" y="528" fill="#342127" class="mono" xml:space="preserve">   │ high      │ LOW      │ -             │ similar geometry,│</text><text x="46" y="548" fill="#342127" class="mono" xml:space="preserve">   │           │          │               │ divergent results│</text><text x="46" y="568" fill="#C43C32" class="mono" xml:space="preserve">   │           │          │               │ CAUTION investigate    │</text><text x="46" y="588" fill="#342127" class="mono" xml:space="preserve">   │ high      │ high     │ LOW           │ same docs, new   │</text><text x="46" y="608" fill="#342127" class="mono" xml:space="preserve">   │           │          │               │ order - matters  │</text><text x="46" y="628" fill="#342127" class="mono" xml:space="preserve">   │           │          │               │ a lot for RAG    │</text><text x="46" y="648" fill="#7B5960" class="mono" xml:space="preserve">   └───────────┴──────────┴───────────────┴──────────────────┘</text>
</svg>
