<text x="34" y="39" fill="#162438" class="title">The Unreported Persistence</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#00A6C7" class="mono" xml:space="preserve">   THE UNREPORTED PERSISTENCE</text><text x="46" y="88" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve">   Paper A: &quot;RBP = 0.62&quot;   (p = 0.95, not stated)</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">   Paper B: &quot;RBP = 0.41&quot;   (p = 0.50, not stated)</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="168" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;System A is much better.&quot;</text><text x="46" y="188" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="208" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;System A was measured with a user who</text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">       /|\     reads 20 results. System B&#x27;s user reads 2.</text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">       / \     You compared two different questions.&quot;</text>
</svg>
