<svg xmlns="http://www.w3.org/2000/svg" width="720" height="526" viewBox="0 0 720 526">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="526" rx="10" fill="#E8F7FA"/>
<rect width="720" height="8" rx="4" fill="#00A6C7"/>
<text x="34" y="39" fill="#162438" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#557184" class="mono" xml:space="preserve">   ┌────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#162438" class="mono" xml:space="preserve">   │  ACTION ITEMS REVISED BY THIS ADDENDUM             │</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve">   │                                                    │</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">   │  1. EMBEDDER MIGRATION                             │</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">   │     Was: &quot;check similarity, migrate if high&quot;       │</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">   │     Now: assume high risk. Measure Jaccard +       │</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">   │          RankSimilarity AT YOUR k, on YOUR corpus. │</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve">   │          Expect low numbers - that is normal, and  │</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">   │          it is why the check matters.              │</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">   │                                                    │</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve">   │  2. ROBUSTNESS REPORTING                           │</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve">   │     Was: &quot;run the RAG-and-no-RAG test&quot;              │</text><text x="46" y="308" fill="#162438" class="mono" xml:space="preserve">   │     Now: run it PER SAMPLE and report the          │</text><text x="46" y="328" fill="#C43C32" class="mono" xml:space="preserve">   │          DEGRADED fraction. The mean hides a       │</text><text x="46" y="348" fill="#162438" class="mono" xml:space="preserve">   │          redistribution.                           │</text><text x="46" y="368" fill="#162438" class="mono" xml:space="preserve">   │                                                    │</text><text x="46" y="388" fill="#162438" class="mono" xml:space="preserve">   │  3. EXPERIMENT METADATA                            │</text><text x="46" y="408" fill="#162438" class="mono" xml:space="preserve">   │     New: pin the EMBEDDER version alongside the    │</text><text x="46" y="428" fill="#162438" class="mono" xml:space="preserve">   │          judge version. Downstream metrics are     │</text><text x="46" y="448" fill="#162438" class="mono" xml:space="preserve">   │          not comparable across embedders.          │</text><text x="46" y="468" fill="#557184" class="mono" xml:space="preserve">   └────────────────────────────────────────────────────┘</text>
</svg>
