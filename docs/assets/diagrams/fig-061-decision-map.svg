<svg xmlns="http://www.w3.org/2000/svg" width="720" height="606" viewBox="0 0 720 606">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="606" rx="10" fill="#E8F7FA"/>
<rect width="720" height="8" rx="4" fill="#00A6C7"/>
<text x="34" y="39" fill="#162438" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#557184" class="mono" xml:space="preserve">┌────────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#162438" class="mono" xml:space="preserve">│  COMPARING RANKINGS                                            │</text><text x="46" y="108" fill="#557184" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">│  Kendall τ / Spearman ρ                                        │</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">│    ▸ uniform weighting, conjoint lists required                │</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">│    ▸ USE FOR: meta-evaluation (do two METRICS rank systems     │</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">│      the same way?)                                            │</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve">│    ▸ NOT FOR: retrieval drift                                  │</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">│  AP-correlation (Yilmaz, Aslam &amp; Robertson, SIGIR&#x27;08)          │</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve">│    ▸ top-weighted alternative to τ, built for IR               │</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="308" fill="#162438" class="mono" xml:space="preserve">│  RBO (Webber, Moffat &amp; Zobel, TOIS&#x27;10)                         │</text><text x="46" y="328" fill="#162438" class="mono" xml:space="preserve">│    ▸ top-weighted, non-conjoint, variable-length, has a        │</text><text x="46" y="348" fill="#162438" class="mono" xml:space="preserve">│      residual, needs no labels                                 │</text><text x="46" y="368" fill="#162438" class="mono" xml:space="preserve">│    ▸ USE FOR: drift, embedder migration, reranker impact       │</text><text x="46" y="388" fill="#162438" class="mono" xml:space="preserve">│    ▸ the metric this white paper recommends most strongly      │</text><text x="46" y="408" fill="#162438" class="mono" xml:space="preserve">│      relative to how rarely it is used                         │</text><text x="46" y="428" fill="#557184" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="448" fill="#162438" class="mono" xml:space="preserve">│  THE CONNECTING INSIGHT                                        │</text><text x="46" y="468" fill="#162438" class="mono" xml:space="preserve">│  RBP (§5.5) and RBO (§7.2) are the same idea - geometric        │</text><text x="46" y="488" fill="#162438" class="mono" xml:space="preserve">│  persistence weighting with an explicit residual - applied      │</text><text x="46" y="508" fill="#162438" class="mono" xml:space="preserve">│  once to QUALITY and once to COMPARISON. Same authors. If you   │</text><text x="46" y="528" fill="#162438" class="mono" xml:space="preserve">│  adopt one, adopt both; the mental model transfers for free.    │</text><text x="46" y="548" fill="#557184" class="mono" xml:space="preserve">└────────────────────────────────────────────────────────────────┘</text>
</svg>
