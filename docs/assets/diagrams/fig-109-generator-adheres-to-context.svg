<text x="34" y="39" fill="#183029" class="title">Generator Adheres To Context?</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#183029" class="mono" xml:space="preserve">                    GENERATOR ADHERES TO CONTEXT?</text><text x="46" y="88" fill="#168C63" class="mono" xml:space="preserve">                       YES              NO</text><text x="46" y="108" fill="#527368" class="mono" xml:space="preserve">                 ┌──────────────┬──────────────┐</text><text x="46" y="128" fill="#087A54" class="mono" xml:space="preserve">        FOUND    │ EFFECTIVE    │ INFORMATION  │</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">   RETRIEVER     │    USE       │  BLINDNESS   │</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">        IT?      │              │              │</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve">                 │ the only     │ you had it,  │</text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve">                 │ real success │ model missed │</text><text x="46" y="228" fill="#527368" class="mono" xml:space="preserve">                 ├──────────────┼──────────────┤</text><text x="46" y="248" fill="#183029" class="mono" xml:space="preserve">        MISSED   │ HALLUCINATION│   CORRECT    │</text><text x="46" y="268" fill="#183029" class="mono" xml:space="preserve">                 │ &quot;LUCKY GUESS&quot;│  REJECTION   │</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve">                 │              │              │</text><text x="46" y="308" fill="#183029" class="mono" xml:space="preserve">                 │ right answer │ model knew   │</text><text x="46" y="328" fill="#183029" class="mono" xml:space="preserve">                 │ NO evidence  │ it didn&#x27;t    │</text><text x="46" y="348" fill="#C43C32" class="mono" xml:space="preserve">                 │  CAUTION DANGER   │ know ✓       │</text><text x="46" y="368" fill="#527368" class="mono" xml:space="preserve">                 └──────────────┴──────────────┘</text><text x="46" y="388" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#183029" class="mono" xml:space="preserve">   Measured on GuidelineQA (Llama-3.1-8B + Qwen3-Embedding-8B):</text><text x="46" y="428" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="448" fill="#183029" class="mono" xml:space="preserve">     Effective Use          49.2%</text><text x="46" y="468" fill="#183029" class="mono" xml:space="preserve">     Lucky Guess            33.9%   &lt;- a THIRD of the system</text><text x="46" y="488" fill="#183029" class="mono" xml:space="preserve">     Information Blindness   8.5%</text><text x="46" y="508" fill="#183029" class="mono" xml:space="preserve">     Correct Rejection      ~8.4%</text>
</svg>
