<svg xmlns="http://www.w3.org/2000/svg" width="720" height="686" viewBox="0 0 720 686">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="686" rx="10" fill="#202541"/>
<rect width="720" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#5264C8" class="mono" xml:space="preserve">┌────────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#EDF5F7" class="mono" xml:space="preserve">│  EFFICIENCY / COST: WHAT TO MEASURE                            │</text><text x="46" y="108" fill="#5264C8" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">│  INDEX TIME                                                    │</text><text x="46" y="148" fill="#5264C8" class="mono" xml:space="preserve">│    ▸ Full rebuild duration ── the number that gates every      │</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">│      drift policy you have. Time it. Write it down.            │</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">│    ▸ Index size, upload time, indexing time                    │</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">│  QUERY TIME                                                    │</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">│    ▸ TTFT at p50 and p95 (NOT mean total latency)              │</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">│    ▸ Retrieval latency separately - it IS the TTFT             │</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve">│  TOKENS                                                        │</text><text x="46" y="328" fill="#5264C8" class="mono" xml:space="preserve">│    ▸ Pairwise Redundancy ── cheap, and reveals quality waste   │</text><text x="46" y="348" fill="#5264C8" class="mono" xml:space="preserve">│    ▸ EHR@k ── tells you whether to add diversity or protect    │</text><text x="46" y="368" fill="#EDF5F7" class="mono" xml:space="preserve">│      rank 1. Opposite strategies, same metric.                 │</text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve">│    ▸ Prompt tokens per query                                   │</text><text x="46" y="408" fill="#EDF5F7" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="428" fill="#EDF5F7" class="mono" xml:space="preserve">│  EVALUATION                                                    │</text><text x="46" y="448" fill="#EDF5F7" class="mono" xml:space="preserve">│    ▸ Tier your suite. The full stack on every commit is not    │</text><text x="46" y="468" fill="#EDF5F7" class="mono" xml:space="preserve">│      diligence, it is an unexamined invoice.                   │</text><text x="46" y="488" fill="#5264C8" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="508" fill="#EDF5F7" class="mono" xml:space="preserve">│  THE ONE INSIGHT                                               │</text><text x="46" y="528" fill="#EDF5F7" class="mono" xml:space="preserve">│  In RAG the efficiency knobs ARE the quality knobs. k, chunk   │</text><text x="46" y="548" fill="#EDF5F7" class="mono" xml:space="preserve">│  size, and rerank depth move recall, faithfulness, context     │</text><text x="46" y="568" fill="#EDF5F7" class="mono" xml:space="preserve">│  utilization, noise sensitivity, latency, and cost - all at    │</text><text x="46" y="588" fill="#EDF5F7" class="mono" xml:space="preserve">│  once, and not all in the same direction. You cannot reason    │</text><text x="46" y="608" fill="#EDF5F7" class="mono" xml:space="preserve">│  about that trade-off with one side unmeasured.                │</text><text x="46" y="628" fill="#5264C8" class="mono" xml:space="preserve">└────────────────────────────────────────────────────────────────┘</text>
</svg>
