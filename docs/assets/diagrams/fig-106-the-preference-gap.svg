<text x="34" y="39" fill="#162438" class="title">The Preference Gap</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#00A6C7" class="mono" xml:space="preserve">   THE PREFERENCE GAP</text><text x="46" y="88" fill="#557184" class="mono" xml:space="preserve">   ══════════════════</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#00A6C7" class="mono" xml:space="preserve">   RETRIEVER&#x27;S RANKING          LLM&#x27;S ACTUAL PREFERENCE</text><text x="46" y="148" fill="#557184" class="mono" xml:space="preserve">   ───────────────────          ───────────────────────</text><text x="46" y="168" fill="#557184" class="mono" xml:space="preserve">   1. dense, technical,     ──▶  confusing, hurts answer</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">      highly relevant</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="228" fill="#557184" class="mono" xml:space="preserve">   2. tangential, simple,   ──▶  provides the logical</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">      &quot;less relevant&quot;            clue that unlocks it</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;So we should retrieve WORSE documents?&quot;</text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="348" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;You should stop assuming your relevance</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       /|\     labels describe what the model needs.</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       / \     That&#x27;s what &#x27;gain&#x27; measures.&quot;</text>
</svg>
