"46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="468" fill="#2A2518" class="mono" xml:space="preserve"> </text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;Your DISTINCT recall is lower, and you</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       /|\     paid full price for the duplicates.&quot;</text><text x="46" y="528" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
