<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">SUMMARY</text>
<text x="46" y="68" fill="#E39A21" class="mono" xml:space="preserve">   THE INVISIBLE DRIFT</text><text x="46" y="88" fill="#168C63" class="mono" xml:space="preserve">   ═══════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#168C63" class="mono" xml:space="preserve">   Your faithfulness score:  0.87 ──── 0.87 ──── 0.87 ──── 0.87</text><text x="46" y="148" fill="#EDF5F7" class="mono" xml:space="preserve">                             Jan       Mar       Jun       Sep</text><text x="46" y="168" fill="#168C63" class="mono" xml:space="preserve">                                        ▲</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">                                        │</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">                              judge model silently</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">                              updated here</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">   Nothing on the dashboard changed colour.</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve">   Every comparison across that line is void.</text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="328" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Faithfulness has been stable all year.&quot;</text><text x="46" y="348" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="368" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="408" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Faithfulness has been measured by two</text><text x="46" y="428" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     different instruments all year.&quot;</text><text x="46" y="448" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text>
</svg>
