<text x="34" y="39" fill="#342127" class="title">The Fisherman&#x27;S Second Question</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">        THE FISHERMAN&#x27;S SECOND QUESTION</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">        ═══════════════════════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">   &quot;Did I get all the fish?&quot;</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="168" fill="#7B5960" class="mono" xml:space="preserve">     ╔═══════════╗</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve">     ║  &gt;&lt;&gt;  &gt;&lt;&gt; ║        ~~~~~~~~~~~~~~~~~~~~~~~~</text><text x="46" y="208" fill="#7B5960" class="mono" xml:space="preserve">     ╚═══════════╝        ~  &gt;&lt;&gt;    &gt;&lt;&gt;    &gt;&lt;&gt;   ~</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">       2 caught           ~     &gt;&lt;&gt;      &gt;&lt;&gt;     ~</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">                          ~~~~~~~~~~~~~~~~~~~~~~~~</text><text x="46" y="268" fill="#342127" class="mono" xml:space="preserve">                              5 still out there</text><text x="46" y="288" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#342127" class="mono" xml:space="preserve">              RECALL = 2 / 7 = 0.29</text><text x="46" y="328" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;How do you know there are 7?&quot;</text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="408" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;...I drained the river and counted.&quot;</text><text x="46" y="448" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="488" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;You cannot drain a 10-million-document river.</text><text x="46" y="528" fill="#D94C42" class="mono" xml:space="preserve">       /|\     This is why Chapter 6 exists.&quot;</text><text x="46" y="548" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
</svg>
