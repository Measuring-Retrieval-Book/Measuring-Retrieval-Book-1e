<svg xmlns="http://www.w3.org/2000/svg" width="720" height="626" viewBox="0 0 720 626">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="626" rx="10" fill="#E8F7FA"/>
<rect width="720" height="8" rx="4" fill="#00A6C7"/>
<text x="34" y="39" fill="#162438" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#557184" class="mono" xml:space="preserve">┌────────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#162438" class="mono" xml:space="preserve">│  INTEGRITY / DRIFT: WHAT TO ACTUALLY DO                        │</text><text x="46" y="108" fill="#557184" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">│  THIS WEEK (costs one afternoon, unlocks everything):          │</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">│    ▸ Freeze a baseline: 500 queries, top-k results, stored     │</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">│    ▸ Pin your judge model to a dated snapshot                  │</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve">│    ▸ Freeze a 100-item human-labelled anchor set               │</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">│  THIS QUARTER:                                                 │</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve">│    ▸ Jaccard + RankSimilarity and. baseline (monthly)           │</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve">│    ▸ CKA on any embedder change                                │</text><text x="46" y="308" fill="#162438" class="mono" xml:space="preserve">│    ▸ 50-question version-sensitive set, VersionQA template     │</text><text x="46" y="328" fill="#162438" class="mono" xml:space="preserve">│    ▸ RAG-and-no-RAG comparison (the test nobody runs)           │</text><text x="46" y="348" fill="#162438" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="368" fill="#162438" class="mono" xml:space="preserve">│  ACCEPT AS UNSOLVED:                                           │</text><text x="46" y="388" fill="#162438" class="mono" xml:space="preserve">│    ▸ Judge drift - no metric exists; use the protocol          │</text><text x="46" y="408" fill="#162438" class="mono" xml:space="preserve">│    ▸ Recency weighting - published evidence says it does       │</text><text x="46" y="428" fill="#162438" class="mono" xml:space="preserve">│      not transfer between corpora (1.00 -&gt; 0.00)                │</text><text x="46" y="448" fill="#162438" class="mono" xml:space="preserve">│                                                                │</text><text x="46" y="468" fill="#557184" class="mono" xml:space="preserve">├────────────────────────────────────────────────────────────────┤</text><text x="46" y="488" fill="#162438" class="mono" xml:space="preserve">│  THE ONE NUMBER TO FEAR                                        │</text><text x="46" y="508" fill="#162438" class="mono" xml:space="preserve">│  Implicit change detection: baselines score 0-10%.             │</text><text x="46" y="528" fill="#162438" class="mono" xml:space="preserve">│  If your corpus is versioned, your system almost certainly     │</text><text x="46" y="548" fill="#162438" class="mono" xml:space="preserve">│  cannot tell you that a document changed.                      │</text><text x="46" y="568" fill="#557184" class="mono" xml:space="preserve">└────────────────────────────────────────────────────────────────┘</text>
</svg>
