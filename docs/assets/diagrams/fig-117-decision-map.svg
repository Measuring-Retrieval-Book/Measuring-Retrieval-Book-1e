<text x="46" y="68" fill="#736747" class="mono" xml:space="preserve">   ═══════════════════════════════════════════════════════════</text><text x="46" y="88" fill="#D98B00" class="mono" xml:space="preserve">   TYPE          WHAT MOVES              DETECTED BY</text><text x="46" y="108" fill="#736747" class="mono" xml:space="preserve">   ═══════════════════════════════════════════════════════════</text><text x="46" y="128" fill="#2A2518" class="mono" xml:space="preserve">   CORPUS        documents change,       VersionQA-style</text><text x="46" y="148" fill="#2A2518" class="mono" xml:space="preserve">                 get revised, get        version-sensitive tests</text><text x="46" y="168" fill="#2A2518" class="mono" xml:space="preserve">                 superseded              (§B.3)</text><text x="46" y="188" fill="#736747" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────────</text><text x="46" y="208" fill="#2A2518" class="mono" xml:space="preserve">   REPRESENTATION you change embedder,   CKA / Jaccard /</text><text x="46" y="228" fill="#2A2518" class="mono" xml:space="preserve">                 vectors mean            RankSimilarity (§B.2)</text><text x="46" y="248" fill="#2A2518" class="mono" xml:space="preserve">                 something new</text><text x="46" y="268" fill="#736747" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────────</text><text x="46" y="288" fill="#2A2518" class="mono" xml:space="preserve">   QUERY         users ask about         per-class recall,</text><text x="46" y="308" fill="#2A2518" class="mono" xml:space="preserve">                 things that didn&#x27;t      query robustness (§B.4)</text><text x="46" y="328" fill="#2A2518" class="mono" xml:space="preserve">                 exist at launch</text><text x="46" y="348" fill="#736747" class="mono" xml:space="preserve">   ───────────────────────────────────────────────────────────</text><text x="46" y="368" fill="#2A2518" class="mono" xml:space="preserve">   JUDGE         your LLM evaluator      NOTHING. This is the</text><text x="46" y="388" fill="#2A2518" class="mono" xml:space="preserve">                 silently updated        open problem. (§B.5)</text><text x="46" y="408" fill="#736747" class="mono" xml:space="preserve">   ═══════════════════════════════════════════════════════════</text>
