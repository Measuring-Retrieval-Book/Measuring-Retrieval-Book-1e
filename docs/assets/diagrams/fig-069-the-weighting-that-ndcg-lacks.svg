<text x="34" y="39" fill="#183029" class="title">THE WEIGHTING THAT α-nDCG LACKS</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#183029" class="mono" xml:space="preserve">   THE WEIGHTING THAT α-nDCG LACKS</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ═══════════════════════════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   Query: &quot;jaguar&quot;</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">     P(car)    = 0.80</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve">     P(animal) = 0.15</text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve">     P(OS)     = 0.05</text><text x="46" y="208" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve">   α-nDCG&#x27;s view:          ERR-IA&#x27;s view:</text><text x="46" y="248" fill="#527368" class="mono" xml:space="preserve">   ┌──────────────┐        ┌──────────────┐</text><text x="46" y="268" fill="#183029" class="mono" xml:space="preserve">   │ car    ▓▓▓▓  │        │ car    ██████│ 0.80</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve">   │ animal ▓▓▓▓  │        │ animal ▓     │ 0.15</text><text x="46" y="308" fill="#183029" class="mono" xml:space="preserve">   │ OS     ▓▓▓▓  │        │ OS     ·     │ 0.05</text><text x="46" y="328" fill="#527368" class="mono" xml:space="preserve">   └──────────────┘        └──────────────┘</text><text x="46" y="348" fill="#183029" class="mono" xml:space="preserve">   all equal               weighted by demand</text><text x="46" y="368" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;So a system serving only &#x27;car&#x27; scores...&quot;</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="448" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="468" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;...0.80 under ERR-IA and 0.33 under</text><text x="46" y="488" fill="#D94C42" class="mono" xml:space="preserve">       /|\     S-recall. ERR-IA is right if your</text><text x="46" y="508" fill="#D94C42" class="mono" xml:space="preserve">       / \     traffic really is 80% car searchers.&quot;</text>
</svg>
