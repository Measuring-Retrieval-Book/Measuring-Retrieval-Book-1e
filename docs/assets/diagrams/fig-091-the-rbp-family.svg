<svg xmlns="http://www.w3.org/2000/svg" width="720" height="466" viewBox="0 0 720 466">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="466" rx="10" fill="#E8F7FA"/>
<rect width="720" height="8" rx="4" fill="#00A6C7"/>
<text x="34" y="39" fill="#162438" class="title">The Rbp Family</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#00A6C7" class="mono" xml:space="preserve">   THE RBP FAMILY</text><text x="46" y="88" fill="#557184" class="mono" xml:space="preserve">   ══════════════</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">   RBP   (§5.5)   quality, single ranking     Moffat &amp; Zobel 2008</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">   RBO   (§7.2)   comparison of rankings      Webber et al. 2010</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">   NRBP  (§8.3.1) quality + novelty           Clarke et al. 2009</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">   SRBP  (§12.2)  quality across a session    Lipani et al. 2019</text><text x="46" y="208" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">   One user model - geometric persistence with an</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">   explicit residual - extended four ways.</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;So if I learn RBP...&quot;</text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="348" fill="#162438" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;...you get the other three nearly free.</text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">       /|\     Best return on conceptual investment</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       / \     in classical IR.&quot;</text>
</svg>
