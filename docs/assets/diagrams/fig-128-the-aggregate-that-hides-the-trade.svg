<svg xmlns="http://www.w3.org/2000/svg" width="720" height="586" viewBox="0 0 720 586">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="586" rx="10" fill="#FFF0ED"/>
<rect width="720" height="8" rx="4" fill="#E45E4F"/>
<text x="34" y="39" fill="#342127" class="title">The Aggregate That Hides The Trade</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   THE AGGREGATE THAT HIDES THE TRADE</text><text x="46" y="88" fill="#7B5960" class="mono" xml:space="preserve">   ══════════════════════════════════</text><text x="46" y="108" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#7B5960" class="mono" xml:space="preserve">   System-level:   no-RAG 0.62 ──▶ RAG 0.71    &quot;+9 points!&quot;</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">   Sample-level:</text><text x="46" y="188" fill="#7B5960" class="mono" xml:space="preserve">     ┌──────────────────────────────────────┐</text><text x="46" y="208" fill="#7B5960" class="mono" xml:space="preserve">     │ 34% of samples:  improved  ▲▲▲       │</text><text x="46" y="228" fill="#C43C32" class="mono" xml:space="preserve">     │ 19% of samples:  DEGRADED  ▼▼        │</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">     │ 47% of samples:  unchanged           │</text><text x="46" y="268" fill="#7B5960" class="mono" xml:space="preserve">     └──────────────────────────────────────┘</text><text x="46" y="288" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;RAG gained us nine points.&quot;</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="368" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;RAG gained you thirty-four points and</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       /|\     LOST you nineteen. The nine is the</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       / \     residue. Nineteen percent of your users</text><text x="46" y="448" fill="#342127" class="mono" xml:space="preserve">              got a worse answer than with no</text><text x="46" y="468" fill="#342127" class="mono" xml:space="preserve">              retrieval at all.&quot;</text><text x="46" y="488" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="508" fill="#342127" class="mono" xml:space="preserve">   (Illustrative split - the paper reports the</text><text x="46" y="528" fill="#342127" class="mono" xml:space="preserve">    phenomenon, not these exact figures.)</text>
</svg>
