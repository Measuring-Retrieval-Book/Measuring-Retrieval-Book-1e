<text x="34" y="39" fill="#FFFFFF" class="title">The Result In One Picture</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">SUMMARY</text>
<text x="46" y="68" fill="#F0A62E" class="mono" xml:space="preserve">   THE RESULT IN ONE PICTURE</text><text x="46" y="88" fill="#00A6C7" class="mono" xml:space="preserve">   ═════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#F0A62E" class="mono" xml:space="preserve">   ABSOLUTE METRICS              PAIRED / INTERLEAVED</text><text x="46" y="148" fill="#00A6C7" class="mono" xml:space="preserve">   ────────────────              ────────────────────</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">   &quot;CTR went from 0.31           &quot;Users preferred B&#x27;s</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">    to 0.34&quot;                      results 58% of the time&quot;</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="228" fill="#FF8A76" class="mono" xml:space="preserve">        ✗ unreliable                  ✓ accurate and</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">          at realistic                  consistent</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve">          sample sizes</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#00A6C7" class="mono" xml:space="preserve">   ┌──────────────────────────────────────────────────┐</text><text x="46" y="328" fill="#FF9D8A" class="mono" xml:space="preserve">   │  o   &quot;Our CTR improved 3 points. Ship it.&quot;       │</text><text x="46" y="348" fill="#FF9D8A" class="mono" xml:space="preserve">   │ /|\                                              │</text><text x="46" y="368" fill="#FF9D8A" class="mono" xml:space="preserve">   │ / \                                              │</text><text x="46" y="388" fill="#EDF5F7" class="mono" xml:space="preserve">   │                                                  │</text><text x="46" y="408" fill="#FF9D8A" class="mono" xml:space="preserve">   │  o   &quot;CTR is one of the eight metrics that was   │</text><text x="46" y="428" fill="#FF9D8A" class="mono" xml:space="preserve">   │ /|\   tested and found unreliable. You need a    │</text><text x="46" y="448" fill="#FF9D8A" class="mono" xml:space="preserve">   │ / \   paired comparison, not a level shift.&quot;     │</text><text x="46" y="468" fill="#00A6C7" class="mono" xml:space="preserve">   └──────────────────────────────────────────────────┘</text>
</svg>
