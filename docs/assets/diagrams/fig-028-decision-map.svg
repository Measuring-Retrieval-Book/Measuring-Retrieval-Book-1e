<svg xmlns="http://www.w3.org/2000/svg" width="720" height="726" viewBox="0 0 720 726">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="726" rx="10" fill="#FFF0ED"/>
<rect width="720" height="8" rx="4" fill="#E45E4F"/>
<text x="34" y="39" fill="#342127" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#7B5960" class="mono" xml:space="preserve">┌──────────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#342127" class="mono" xml:space="preserve">│  SET-BASED METRICS: THE ONE-PAGE VERSION                     │</text><text x="46" y="108" fill="#7B5960" class="mono" xml:space="preserve">├──────────────────────────────────────────────────────────────┤</text><text x="46" y="128" fill="#342127" class="mono" xml:space="preserve">│                                                              │</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve">│  Precision   &quot;Was what I returned good?&quot;                     │</text><text x="46" y="168" fill="#342127" class="mono" xml:space="preserve">│              -&gt; gamed by returning LESS                       │</text><text x="46" y="188" fill="#342127" class="mono" xml:space="preserve">│                                                              │</text><text x="46" y="208" fill="#342127" class="mono" xml:space="preserve">│  Recall      &quot;Did I return what was good?&quot;                   │</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve">│              -&gt; gamed by returning MORE                       │</text><text x="46" y="248" fill="#342127" class="mono" xml:space="preserve">│              -&gt; denominator usually unknowable                │</text><text x="46" y="268" fill="#342127" class="mono" xml:space="preserve">│                                                              │</text><text x="46" y="288" fill="#342127" class="mono" xml:space="preserve">│  F1 / Fβ     &quot;Both, harmonically, with a priority&quot;           │</text><text x="46" y="308" fill="#342127" class="mono" xml:space="preserve">│              -&gt; NEVER report without P and R beside it        │</text><text x="46" y="328" fill="#342127" class="mono" xml:space="preserve">│              -&gt; choose β from real cost ratios                │</text><text x="46" y="348" fill="#342127" class="mono" xml:space="preserve">│                                                              │</text><text x="46" y="368" fill="#342127" class="mono" xml:space="preserve">│  P@K         &quot;Was the part they SAW good?&quot;                   │</text><text x="46" y="388" fill="#342127" class="mono" xml:space="preserve">│              -&gt; set K from your interface / context budget    │</text><text x="46" y="408" fill="#342127" class="mono" xml:space="preserve">│              -&gt; rank-blind within the window                  │</text><text x="46" y="428" fill="#342127" class="mono" xml:space="preserve">│                                                              │</text><text x="46" y="448" fill="#7B5960" class="mono" xml:space="preserve">├──────────────────────────────────────────────────────────────┤</text><text x="46" y="468" fill="#342127" class="mono" xml:space="preserve">│  ALL FOUR ARE RANK-BLIND.                                    │</text><text x="46" y="488" fill="#342127" class="mono" xml:space="preserve">│  ALL FOUR ASSUME BINARY RELEVANCE.                           │</text><text x="46" y="508" fill="#342127" class="mono" xml:space="preserve">│  Chapter 5 fixes rank. Chapter 5 also fixes gradation.       │</text><text x="46" y="528" fill="#7B5960" class="mono" xml:space="preserve">├──────────────────────────────────────────────────────────────┤</text><text x="46" y="548" fill="#342127" class="mono" xml:space="preserve">│  THE RAG-SPECIFIC WARNING:                                   │</text><text x="46" y="568" fill="#342127" class="mono" xml:space="preserve">│  These metrics score passages INDEPENDENTLY. Evidence        │</text><text x="46" y="588" fill="#342127" class="mono" xml:space="preserve">│  sufficiency is a SET property. Two individually-relevant    │</text><text x="46" y="608" fill="#342127" class="mono" xml:space="preserve">│  passages can be jointly redundant; two individually-weak    │</text><text x="46" y="628" fill="#342127" class="mono" xml:space="preserve">│  ones can be jointly sufficient. Nothing in this chapter     │</text><text x="46" y="648" fill="#342127" class="mono" xml:space="preserve">│  can see that. (See SURE-RAG, arXiv:2605.03534.)             │</text><text x="46" y="668" fill="#7B5960" class="mono" xml:space="preserve">└──────────────────────────────────────────────────────────────┘</text>
</svg>
