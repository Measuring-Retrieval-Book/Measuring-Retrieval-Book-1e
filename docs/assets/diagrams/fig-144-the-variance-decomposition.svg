<rect width="720" height="486" rx="10" fill="#EAF7F1"/>
<rect width="720" height="8" rx="4" fill="#168C63"/>
<text x="34" y="39" fill="#183029" class="title">The Variance Decomposition</text>
<text x="686" y="37" text-anchor="end" fill="#E39A21" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#168C63" class="mono" xml:space="preserve">   THE VARIANCE DECOMPOSITION</text><text x="46" y="88" fill="#527368" class="mono" xml:space="preserve">   ══════════════════════════</text><text x="46" y="108" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#183029" class="mono" xml:space="preserve">   You observe:  metric moved from 0.61 -&gt; 0.74</text><text x="46" y="148" fill="#183029" class="mono" xml:space="preserve">   You conclude: &quot;the model got better&quot;</text><text x="46" y="168" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="188" fill="#183029" class="mono" xml:space="preserve">   Actual decomposition:</text><text x="46" y="208" fill="#527368" class="mono" xml:space="preserve">     ~75% ──▶ PR moved (model expressed internal</text><text x="46" y="228" fill="#183029" class="mono" xml:space="preserve">               knowledge more OFTEN)</text><text x="46" y="248" fill="#527368" class="mono" xml:space="preserve">     ~25% ──▶ PKP moved (that knowledge got more</text><text x="46" y="268" fill="#168C63" class="mono" xml:space="preserve">               CORRECT)</text><text x="46" y="288" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;So three quarters of our improvement was...&quot;</text><text x="46" y="328" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="348" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="368" fill="#183029" class="mono" xml:space="preserve"> </text><text x="46" y="388" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;...a change in behaviour frequency,</text><text x="46" y="408" fill="#D94C42" class="mono" xml:space="preserve">       /|\     not a change in quality. The metric</text><text x="46" y="428" fill="#D94C42" class="mono" xml:space="preserve">       / \     conflated them.&quot;</text>
</svg>
