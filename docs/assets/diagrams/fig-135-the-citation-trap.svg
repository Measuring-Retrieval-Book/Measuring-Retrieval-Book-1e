<svg xmlns="http://www.w3.org/2000/svg" width="720" height="646" viewBox="0 0 720 646">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="646" rx="10" fill="#202541"/>
<rect width="720" height="8" rx="4" fill="#5264C8"/>
<text x="34" y="39" fill="#FFFFFF" class="title">The Citation Trap</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E86850" class="mono" xml:space="preserve">   THE CITATION TRAP</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ═════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   PAPER (2309.15217)          LIBRARY (what you run)</text><text x="46" y="148" fill="#5264C8" class="mono" xml:space="preserve">   ──────────────────          ──────────────────────</text><text x="46" y="168" fill="#EDF5F7" class="mono" xml:space="preserve">   Faithfulness                faithfulness</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">   Answer Relevance            answer_relevancy</text><text x="46" y="208" fill="#EDF5F7" class="mono" xml:space="preserve">   Context Relevance           context_precision</text><text x="46" y="228" fill="#EDF5F7" class="mono" xml:space="preserve">                               context_recall</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">                               (+ answer_correctness, ...)</text><text x="46" y="268" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="288" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;We evaluated with RAGAS (Es et al., 2024).&quot;</text><text x="46" y="308" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="328" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="348" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="368" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Which four metrics did you report?&quot;</text><text x="46" y="388" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="408" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="428" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="448" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Faithfulness, answer relevancy, context</text><text x="46" y="468" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     precision, context recall.&quot;</text><text x="46" y="488" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="508" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="528" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Two of those aren&#x27;t in the paper you cited.</text><text x="46" y="548" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     And context_recall isn&#x27;t reference-free,</text><text x="46" y="568" fill="#FF9D8A" class="mono" xml:space="preserve">       / \     so your &#x27;reference-free evaluation&#x27; claim</text><text x="46" y="588" fill="#EDF5F7" class="mono" xml:space="preserve">              is wrong too.&quot;</text>
</svg>
