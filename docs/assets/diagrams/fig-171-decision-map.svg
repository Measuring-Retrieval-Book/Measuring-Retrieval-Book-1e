<svg xmlns="http://www.w3.org/2000/svg" width="720" height="526" viewBox="0 0 720 526">
<style>
  .mono { font-family: 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; }
  .title { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 22px; font-weight: 700; }
  .label { font-family: 'Source Sans 3', 'Avenir Next', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; }
</style>
<rect width="720" height="526" rx="10" fill="#E8F7FA"/>
<rect width="720" height="8" rx="4" fill="#00A6C7"/>
<text x="34" y="39" fill="#162438" class="title">Decision map</text>
<text x="686" y="37" text-anchor="end" fill="#F0A62E" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#557184" class="mono" xml:space="preserve">   ┌──────────────────────────────────────────────────────────┐</text><text x="46" y="88" fill="#162438" class="mono" xml:space="preserve">   │  1. FAITHFULNESS NEVER SHIPS ALONE                       │</text><text x="46" y="108" fill="#162438" class="mono" xml:space="preserve">   │                                                          │</text><text x="46" y="128" fill="#162438" class="mono" xml:space="preserve">   │  RAG-X: adherence 0.84, and 33.9% of correct answers     │</text><text x="46" y="148" fill="#162438" class="mono" xml:space="preserve">   │  ungrounded. Three independent papers named this:        │</text><text x="46" y="168" fill="#162438" class="mono" xml:space="preserve">   │  Lucky Guess, Self-Knowledge, post-rationalization.      │</text><text x="46" y="188" fill="#162438" class="mono" xml:space="preserve">   │  Always print a retrieval-hit denominator beside it.     │</text><text x="46" y="208" fill="#557184" class="mono" xml:space="preserve">   ├──────────────────────────────────────────────────────────┤</text><text x="46" y="228" fill="#162438" class="mono" xml:space="preserve">   │  2. RELEVANCE AND UTILITY CAN POINT OPPOSITE WAYS        │</text><text x="46" y="248" fill="#162438" class="mono" xml:space="preserve">   │                                                          │</text><text x="46" y="268" fill="#162438" class="mono" xml:space="preserve">   │  Cuconasu et al. and Jiang et al., independently:        │</text><text x="46" y="288" fill="#162438" class="mono" xml:space="preserve">   │  highly relevant passages can interfere with reasoning;  │</text><text x="46" y="308" fill="#162438" class="mono" xml:space="preserve">   │  tangential ones can help. Your relevance labels do      │</text><text x="46" y="328" fill="#162438" class="mono" xml:space="preserve">   │  not describe what the model needs.                      │</text><text x="46" y="348" fill="#557184" class="mono" xml:space="preserve">   ├──────────────────────────────────────────────────────────┤</text><text x="46" y="368" fill="#162438" class="mono" xml:space="preserve">   │  3. YOUR GENERATOR MAY IGNORE YOUR RANKING               │</text><text x="46" y="388" fill="#162438" class="mono" xml:space="preserve">   │                                                          │</text><text x="46" y="408" fill="#162438" class="mono" xml:space="preserve">   │  RAG-E: on 47-67% of queries the generator ignored the   │</text><text x="46" y="428" fill="#162438" class="mono" xml:space="preserve">   │  retriever&#x27;s top-ranked document. Run WARG BEFORE you    │</text><text x="46" y="448" fill="#162438" class="mono" xml:space="preserve">   │  spend a quarter improving nDCG.                         │</text><text x="46" y="468" fill="#557184" class="mono" xml:space="preserve">   └──────────────────────────────────────────────────────────┘</text>
</svg>
