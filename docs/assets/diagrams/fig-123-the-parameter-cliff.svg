<text x="686" y="37" text-anchor="end" fill="#197FA2" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#E45E4F" class="mono" xml:space="preserve">   THE PARAMETER CLIFF</text><text x="46" y="88" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="108" fill="#7B5960" class="mono" xml:space="preserve">   recency weight tuned on corpus A  ──▶ Latest@10 = 1.00 on A</text><text x="46" y="128" fill="#7B5960" class="mono" xml:space="preserve">   same weight applied to corpus B   ──▶ Latest@10 = 0.00 on B</text><text x="46" y="148" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="168" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;We enabled the recency prior.&quot;</text><text x="46" y="188" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="208" fill="#D94C42" class="mono" xml:space="preserve">       / \</text><text x="46" y="228" fill="#342127" class="mono" xml:space="preserve"> </text><text x="46" y="248" fill="#D94C42" class="mono" xml:space="preserve">        o    &quot;With whose tuning?&quot;</text><text x="46" y="268" fill="#D94C42" class="mono" xml:space="preserve">       /|\</text><text x="46" y="288" fill="#D94C42" class="mono" xml:space="preserve">       / \</text>
