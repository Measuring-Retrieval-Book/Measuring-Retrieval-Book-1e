<text x="34" y="39" fill="#FFFFFF" class="title">WHAT MAP SEES and WHAT bpref SEES</text>
<text x="686" y="37" text-anchor="end" fill="#E86850" class="label">DIAGRAM</text>
<text x="46" y="68" fill="#EDF5F7" class="mono" xml:space="preserve">   WHAT MAP SEES and WHAT bpref SEES</text><text x="46" y="88" fill="#5264C8" class="mono" xml:space="preserve">   ════════════════════════════════</text><text x="46" y="108" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="128" fill="#EDF5F7" class="mono" xml:space="preserve">   rank  doc  judgment</text><text x="46" y="148" fill="#5264C8" class="mono" xml:space="preserve">   ────  ───  ────────</text><text x="46" y="168" fill="#62D6A8" class="mono" xml:space="preserve">    1     A   ✓ relevant</text><text x="46" y="188" fill="#EDF5F7" class="mono" xml:space="preserve">    2     B   ? UNJUDGED</text><text x="46" y="208" fill="#FF8A76" class="mono" xml:space="preserve">    3     C   ✗ irrelevant</text><text x="46" y="228" fill="#62D6A8" class="mono" xml:space="preserve">    4     D   ✓ relevant</text><text x="46" y="248" fill="#EDF5F7" class="mono" xml:space="preserve">    5     E   ? UNJUDGED</text><text x="46" y="268" fill="#62D6A8" class="mono" xml:space="preserve">    6     F   ✓ relevant</text><text x="46" y="288" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="308" fill="#EDF5F7" class="mono" xml:space="preserve">   MAP&#x27;s view:              bpref&#x27;s view:</text><text x="46" y="328" fill="#5264C8" class="mono" xml:space="preserve">   ┌──────────────┐         ┌──────────────┐</text><text x="46" y="348" fill="#62D6A8" class="mono" xml:space="preserve">   │ 1 ✓          │         │ 1 ✓          │</text><text x="46" y="368" fill="#FF8A76" class="mono" xml:space="preserve">   │ 2 ✗ (assumed)│         │ 2 (skipped)  │</text><text x="46" y="388" fill="#FF8A76" class="mono" xml:space="preserve">   │ 3 ✗          │         │ 3 ✗          │</text><text x="46" y="408" fill="#62D6A8" class="mono" xml:space="preserve">   │ 4 ✓          │         │ 4 ✓          │</text><text x="46" y="428" fill="#FF8A76" class="mono" xml:space="preserve">   │ 5 ✗ (assumed)│         │ 5 (skipped)  │</text><text x="46" y="448" fill="#62D6A8" class="mono" xml:space="preserve">   │ 6 ✓          │         │ 6 ✓          │</text><text x="46" y="468" fill="#5264C8" class="mono" xml:space="preserve">   └──────────────┘         └──────────────┘</text><text x="46" y="488" fill="#EDF5F7" class="mono" xml:space="preserve">   penalizes B and E        stays silent on B and E</text><text x="46" y="508" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="528" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;B might have been relevant!&quot;</text><text x="46" y="548" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\</text><text x="46" y="568" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text><text x="46" y="588" fill="#EDF5F7" class="mono" xml:space="preserve"> </text><text x="46" y="608" fill="#FF9D8A" class="mono" xml:space="preserve">        o    &quot;Exactly. bpref refuses to guess.</text><text x="46" y="628" fill="#FF9D8A" class="mono" xml:space="preserve">       /|\     MAP guesses &#x27;irrelevant&#x27; every time.&quot;</text><text x="46" y="648" fill="#FF9D8A" class="mono" xml:space="preserve">       / \</text>
</svg>
